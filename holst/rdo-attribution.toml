[[job]]
id = "report"
name = "read the ladder"
machine = "rog"
deps = ["baseline-qwen3", "a0", "a1", "a2", "a3", "a3-gemma"]
timeout_secs = 900
success = { type = "stdout-contains", needle = "REPORT_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"

# The verdict comes from the harness, never from a fresh min() in this file. Every spec here used
# to draw its own conclusion with an argmin that had never heard of the guards in
# matched_refusal_table, which is how a one percent KL difference got printed as a win.
#
# report_bands exits non-zero when an arm produced nothing, and REPORT_OK is only echoed on
# success, so a report that found six missing arms can no longer satisfy the needle.
PYTHONPATH=src "$PY" tools/report_bands.py \\
    "A0  control (pre-2026-08-04)=$RUN/attrib/a0.json" \\
    "A1  + per-token score=$RUN/attrib/a1.json" \\
    "A2  + induction=$RUN/attrib/a2.json" \\
    "A3  + warm start (shipped)=$RUN/attrib/a3.json" \\
    "B   difference-of-means=$RUN/attrib/baseline-qwen3.json" \\
    "C   A3 on gemma=$RUN/attrib/a3-gemma.json"

echo
echo "Each rung adds ONE change to the rung above, so the difference between adjacent rows is"
echo "that change and nothing else. Bands the harness refused to rank print their reason instead"
echo "of a winner; do not read past that line. Everything here is one seed."
echo REPORT_OK
"""
