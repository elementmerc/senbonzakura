# ── S: five seeds on the one positive result this project has ─────────────────────────
# Seeds 42 to 46, each a fresh optimisation and a fresh scoring. Chained rather than parallel
# because the card holds one at a time anyway, and chaining makes the resume order obvious.
#
# Seed 42 is REDONE rather than reused, and this is not tidiness. The existing
# rdo/qwen3-k4.pt was optimised from layer 15 by hand, where `--layer-frac auto` derives layer 9
# for this model, and the existing rdo/score-qwen3-rdo.json predates the unablated anchor, so its
# "50% removed" band is measured against its own weakest ablated arm rather than against the
# model. Either difference on its own would make the seed-42 row a different experiment sitting
# in the same table, and it is the row the headline claim rests on.

