# SUPERSEDED 2026-08-05. Do not re-run this spec to produce numbers.
#
# Its resume guards test only whether an output file PARSES, and its outputs exist, so every job
# short-circuits and the run reports success having measured nothing. Its report block recomputes
# a winner with min() instead of reading the harness's `ranking` verdict, so it can crown an arm
# the harness refused to rank. Both are fixed in tools/artefact_ok.py and tools/report_bands.py,
# which this spec predates. Kept for the record of what was run, not as a thing to run.
#
# Why do optimised directions underperform a plain difference-of-means?
#
# RDO reaches 73.4% refusal on gemma where the difference-of-means reaches 14.8%. Directions
# chosen for their effect are doing worse than the simplest possible direction, which is the
# opposite of what should happen and is more likely a mechanical fault than a conceptual one.
# Three candidates, run in the order that makes the later ones interpretable.
#
#   T  the transfer gap. RDO optimises a residual-stream HOOK; the evaluation BAKES weights.
#      Same directions, both operations, the bake's own layer profile. If they disagree, RDO is
#      optimising something the evaluation does not perform, and every RDO number so far is
#      measuring that mismatch. Cheap, and it can invalidate the other two.
#
#      Bundled with it: the projection magnitude. arXiv:2603.22061 found geometrically pure
#      directions that do nothing because matching drops their magnitude below the level at which
#      weight projection perturbs the stream. Our extras are orthogonalised against d0, which
#      removes the largest shared component by construction, so they are that exact shape.
#
#   L  a longer optimisation. 200 steps at batch 2 is small next to what the paper describes.
#      1000 steps, same everything else, so the difference is the budget.
#
#   S  five seeds. The one positive result this project has (Qwen3 RDO, K=2 at 6.3x lower KL than
#      K=1 at matched refusal) is a single sample, and a single sample with complete separation at
#      p about 0.004 has already been withdrawn here once. Five seeds, each optimised and scored
#      independently, is what makes it a finding rather than an anecdote.
#
# Ordered T, L, S deliberately: T is minutes and can explain everything, L is one model, S is the
# expensive one. All jobs are resumable, take the card-wide lock, and short-circuit on a result
# that already parses, so an interrupted day resumes rather than restarts.
run = "close-the-gap-2026-08-04"

[[job]]
id = "setup"
machine = "rog"
timeout_secs = 900
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"
PYTHONPATH=src "$PY" -c "
from senbonzakura import validate
for name in ('experiment_transfer', 'projection_magnitude', 'residual_ablation'):
    assert hasattr(validate, name), name
print('validate has the transfer and magnitude diagnostics')
"
"$PY" -c 'import torch; assert torch.cuda.is_available()'
mkdir -p "$RUN/gap" "$RUN/abl"
echo SETUP_OK
"""

# ── T: the transfer gap, on both models, using directions that already exist ──────────

[[job]]
id = "transfer-gemma"
name = "T: hook against bake, gemma RDO directions"
machine = "rog"
deps = ["setup"]
timeout_secs = 10800
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "T_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"
exec 8>"$RUN/abl/gpu.lock"
flock -n 8 || { echo "GPU_BUSY: waiting"; flock -w 5400 8 || { echo "GPU_WAIT_TIMEOUT"; exit 1; }; }

if "$PY" -c "import json; json.load(open('$RUN/gap/transfer-gemma.json'))" >/dev/null 2>&1; then
    echo "ALREADY_COMPLETE"; echo T_OK; exit 0
fi

PYTHONPATH=src "$PY" -u -m senbonzakura validate \\
    --model google/gemma-2-2b-it --track "$HOME/track-heldout" \\
    --experiment transfer --directions-from "$RUN/rdo/gemma-k4.pt" \\
    --dir-prompts 128 --eval-refusal 128 --eval-kl 64 --device cuda --seed 42 \\
    --out "$RUN/gap/transfer-gemma.json"
echo T_OK
"""

[[job]]
id = "transfer-gemma-clusters"
name = "T: hook against bake, gemma CLUSTER directions (the control)"
machine = "rog"
deps = ["transfer-gemma"]
timeout_secs = 10800
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "T_OK" }
command = """
