exec 8>"$RUN/abl/gpu.lock"
flock -n 8 || { echo "GPU_BUSY: waiting"; flock -w 10800 8 || { echo "GPU_WAIT_TIMEOUT"; exit 1; }; }

if "$PY" -c "
import torch
b = torch.load('$RUN/gap/gemma-k4-long.pt', map_location='cpu', weights_only=False)
assert b['dirs_multi'].ndim == 3
