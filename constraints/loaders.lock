# The optional model loading backends, pinned with the hashes that say the bytes were not swapped.
#
# These are the packages behind the `quant`, `gptq` and `awq` extras (GGUF needs only `gguf`, a core dependency). None is a core
# dependency: a plain safetensors model needs none of them, and `senbonzakura` says in one sentence
# which one is missing, with the install command, when a model asks for it.
#
# Every version here was published at least 21 days before it was chosen (2026-10-19), which is the
# cooldown section 5 of the baseline asks for; the upload date of each file is beside it.
#
#     pip install --no-deps -r constraints/loaders.lock
#
# `gptqmodel` is published as a source archive only, so installing it compiles; on a machine
# without a CUDA toolchain the build can fail, and the loader then refuses GPTQ and AWQ with its
# own sentence instead of a traceback. `optimum` is the GPTQ side's second requirement.
