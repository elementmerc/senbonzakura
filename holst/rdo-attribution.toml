# Did the 2026-08-04 RDO fixes work, and WHICH of them did the work?
#
# Three faults were fixed together in ca95152, each independently capable of explaining why
# optimised directions have been losing to a plain difference-of-means:
#
#   P  the refusal score was a SUM over opener tokens, running to -700 while the preservation KL
#      sat near 1 at weight 1.0. Preservation contributed nothing to the gradient, so the
#      optimiser could buy refusal removal with unlimited damage. Now a per-token mean, which is
#      also what the paper's cross-entropy actually is.
#   I  there was no INDUCTION term. The objective only asked a direction to remove refusal when
#      subtracted, which a direction that merely wrecks the model satisfies perfectly. Adding the
#      direction back to a harmless prompt and requiring a refusal is what tells them apart.
#   W  directions started from NOISE. Warm-starting row 0 from the difference-of-means means the
#      set provably contains the baseline it is compared against at step zero, so RDO cannot start
#      worse than the thing it is meant to beat.
#
# "The fixes helped" would not say which one mattered, and this project has spent two days on
# results whose meaning was not what the label said. So the arms are a LADDER: each adds exactly
# one fix to the one before it, and the difference between adjacent arms is that fix's
# contribution.
#
#   A0  summed,     no induction, random init     the behaviour before today (the control)
#   A1  per-token,  no induction, random init     + P
#   A2  per-token,  induction,    random init     + I
#   A3  per-token,  induction,    warm start      + W   (the shipped default)
#
# Plus B, the reference every arm is read against: the plain difference-of-means and the cluster
# directions on the same model, same stick, same grid. Without it "K=2 beat K=1" says nothing
# about whether either beat the simplest thing in the tool.
#
# EVERYTHING lands in $RUN/attrib, a directory that does not yet exist. That is deliberate. On
# 2026-08-04 a whole run reported "7 done, 0 failed" while every job printed ALREADY_COMPLETE,
# because the resume guards test whether an output PARSES and last night's outputs parse fine. A
# fresh directory is the only guard that cannot be fooled by a stale artefact from a different
# configuration.
#
# Ordered cheapest-and-most-decisive first: B is a scoring run with no optimisation and gives a
# readable number within the hour; A3 is the shipped configuration and is the one that matters
# most, so it runs before the arms that exist only to explain it.
run = "rdo-attribution-2026-08-04c"

[[job]]
id = "setup"
machine = "rog"
timeout_secs = 900
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"

# The code on this machine must be the code that carries the fixes. A run whose whole purpose is
# to measure three changes, executed against a checkout that predates them, would produce four
# arms that differ only by flags the tool ignores and a ladder with no rungs.
PYTHONPATH=src "$PY" -c "
import importlib.util
s = importlib.util.spec_from_file_location('rdo', 'tools/rdo.py')
m = importlib.util.module_from_spec(s); s.loader.exec_module(m)
missing = [n for n in ('addition_hook', 'induction_loss', 'opener_logprob', 'mean_diff_init',
                       'bake_centre_layer') if not hasattr(m, n)]
assert not missing, f'this checkout predates the 2026-08-04 RDO fixes: missing {missing}'
import inspect
assert 'per_token' in inspect.signature(m.opener_logprob).parameters, 'no per-token switch'
assert 'init' in inspect.signature(m.optimise).parameters, 'no init switch'
print('rdo carries the fixes')
"
PYTHONPATH=src "$PY" -c "
from senbonzakura import validate
assert hasattr(validate, 'matched_refusal_table')
import torch; assert torch.cuda.is_available()
print('validate present; cuda up')
"
mkdir -p "$RUN/attrib" "$RUN/abl"
echo SETUP_OK
"""

# ── B: the reference. No optimisation, so it is cheap and it lands first. ──────────────

[[job]]
id = "baseline-qwen3"
name = "B: difference-of-means and clusters on Qwen3, the stick everything is read against"
machine = "rog"
deps = ["setup"]
timeout_secs = 14400
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "B_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"
exec 8>"$RUN/abl/gpu.lock"
flock -n 8 || { echo "GPU_BUSY: waiting"; flock -w 7200 8 || { echo "GPU_WAIT_TIMEOUT"; exit 1; }; }

# A guard that states WHICH configuration it will accept. The parse-only form this
# replaces reported success on any file that happened to be valid JSON.
if "$PY" tools/artefact_ok.py "$RUN/attrib/baseline-qwen3.json" \
    model=Qwen/Qwen3-1.7B seed=42 directions_from=None max_directions=4 eval_refusal=128; then
    echo "ALREADY_COMPLETE"; echo B_OK; exit 0
fi

PYTHONPATH=src "$PY" -u -m senbonzakura validate \\
    --model Qwen/Qwen3-1.7B --track "$HOME/track-heldout" \\
    --experiment e4 --strengths 0.2,0.35,0.5,0.7,1.0 --max-directions 4 \\
    --dir-prompts 128 --eval-refusal 128 --eval-kl 64 --device cuda --seed 42 \\
    --out "$RUN/attrib/baseline-qwen3.json"
echo B_OK
"""

# ── A3: the shipped configuration. Runs before the arms that only explain it. ──────────

[[job]]
id = "a3"
name = "A3: per-token + induction + warm start (the shipped default)"
machine = "rog"
deps = ["baseline-qwen3"]
timeout_secs = 28800
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "ARM_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"
exec 8>"$RUN/abl/gpu.lock"
flock -n 8 || { echo "GPU_BUSY: waiting"; flock -w 14400 8 || { echo "GPU_WAIT_TIMEOUT"; exit 1; }; }

# A guard that states WHICH configuration it will accept. The parse-only form this
# replaces reported success on any file that happened to be valid JSON.
if "$PY" tools/artefact_ok.py "$RUN/attrib/a3.json" \
    model=Qwen/Qwen3-1.7B seed=42 directions_meta.init=mean-diff directions_meta.score=per-token directions_meta.induce=0.2 directions_meta.k=4 directions_meta.steps=200; then
    echo "ALREADY_COMPLETE"; echo ARM_OK; exit 0
fi

PYTHONPATH=src "$PY" -u tools/rdo.py \\
    --model Qwen/Qwen3-1.7B --track "$HOME/track-heldout" \\
    --k 4 --steps 200 --layer-frac auto --preserve 1.0 --indep 0.5 \\
    --score per-token --induce 0.2 --init mean-diff \\
    --lr 0.05 --batch 2 --dir-prompts 128 --device cuda --seed 42 \\
    --out "$RUN/attrib/a3.pt"
PYTHONPATH=src "$PY" -u -m senbonzakura validate \\
    --model Qwen/Qwen3-1.7B --track "$HOME/track-heldout" \\
    --experiment e4 --directions-from "$RUN/attrib/a3.pt" \\
    --strengths 0.2,0.35,0.5,0.7,1.0 --max-directions 4 \\
    --dir-prompts 128 --eval-refusal 128 --eval-kl 64 --device cuda --seed 42 \\
    --out "$RUN/attrib/a3.json"
echo ARM_OK
"""

