# Directions chosen for their effect, against directions chosen for their appearance.
#
# Last night's grid said the cluster extractor's extra directions are worse than useless: at
# matched refusal removal they cost monotonically more KL, and random directions of the same count
# cost 5x less for the same result. The method, not the hypothesis, is what that refutes.
#
# Wollschlaeger et al. (arXiv:2502.17420) optimise each direction for what removing it DOES, with
# a representational-independence term so the second is not the first in a different basis, and
# report attack success rising monotonically with k, passing the difference-in-means baseline at
# k >= 4 ON GEMMA 2 2B. That model fits the 6 GB card and is already cached here, so this is a
# direct replication target rather than an analogy.
#
# Piras et al. (arXiv:2511.08379) add the reason to expect nothing from Qwen3-1.7B: their
# single-versus-multi gap is largest exactly where single-direction ablation barely works
# (Llama2-7B 0.0% single, 59.1% multi) and smallest where it already works (Qwen-7B 81.1% vs
# 88.1%). Qwen3-1.7B is small and weakly aligned; even the weakest arm last night had already
# stripped most of its refusal. Gemma is the better-aligned of the two models available here.
#
# Every arm is scored by the SAME harness at MATCHED refusal removal, because more ablation always
# costs more KL and comparing KL at different refusal levels compares nothing.
#
#   A  RDO k=4 on gemma-2-2b-it     the replication
#   B  clusters on gemma-2-2b-it    the incumbent, same model, same stick
#   C  RDO k=4 on Qwen3-1.7B        does the method rescue the weakly-aligned model too
#
# What would count as success: at a matched refusal level, RDO k=4 reaching it at lower KL than
# K=1. What would count as failure: K=1 still cheapest, which would say the subspace is not there
# to find in these models at this scale, and that is a result worth publishing too.
run = "rdo-vs-clusters-2026-08-04c"

[[job]]
id = "setup"
machine = "rog"
timeout_secs = 900
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
test -f "$RUN/tools/rdo.py" || { echo "MISSING_RDO"; exit 1; }
cd "$RUN"
PYTHONPATH=src "$PY" -c "
import importlib.util
s = importlib.util.spec_from_file_location('rdo', 'tools/rdo.py')
m = importlib.util.module_from_spec(s); s.loader.exec_module(m)
assert hasattr(m, 'ablation_hooks') and hasattr(m, 'optimise')
import torch
print('rdo present; torch', torch.__version__, 'cuda', torch.cuda.is_available())
"
mkdir -p "$RUN/rdo" "$RUN/abl"
echo SETUP_OK
"""

[[job]]
id = "rdo-gemma"
name = "A: optimise 4 directions on gemma-2-2b-it"
machine = "rog"
deps = ["setup"]
timeout_secs = 14400
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "RDO_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"
exec 8>"$RUN/abl/gpu.lock"
flock -n 8 || { echo "GPU_BUSY: waiting"; flock -w 20000 8 || { echo "GPU_WAIT_TIMEOUT"; exit 1; }; }

# Loadable, not merely present. A `[ -f ]` test accepts a torch file truncated by a killed
# run, and the next job would then score whatever half a tensor decodes to. The JSON guards
# three lines below already require a successful parse; this one did not, which is the same
# defect fixed in the arm guards on 2026-08-03 reintroduced next to its own correction.
if "$PY" -c "
import sys, torch
b = torch.load('$RUN/rdo/gemma-k4.pt', map_location='cpu', weights_only=False)
d = b['dirs_multi']
assert d.ndim == 3 and d.shape[1] > 0, d.shape
sys.exit(0)
" >/dev/null 2>&1; then echo "ALREADY_COMPLETE"; echo RDO_OK; exit 0; fi

PYTHONPATH=src "$PY" -u tools/rdo.py \\
    --model google/gemma-2-2b-it --track "$HOME/track-heldout" \\
    --k 4 --steps 200 --layer-frac auto --preserve 1.0 --indep 0.5 \\
    --lr 0.05 --batch 2 --dir-prompts 128 --device cuda --seed 42 \\
    --out "$RUN/rdo/gemma-k4.pt"
echo RDO_OK
"""

