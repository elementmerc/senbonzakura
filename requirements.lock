# The same twelve pins as constraints.txt, with the hashes that say the bytes were not swapped.
#
# WHY THIS IS A SECOND FILE RATHER THAN HASHES ADDED TO constraints.txt
#
# Hashes in a CONSTRAINTS file put pip into --require-hashes mode for the whole install, and that
# mode demands every requirement be pinned with `==` and hashed, including the project itself.
# Measured 2026-09-22: `pip install . -c constraints.txt` then fails with "In --require-hashes
# mode, all requirements must have their versions pinned with ==". So hashing that file would
# have satisfied the supply-chain gate by breaking the one command the install guide offers to
# somebody checking our numbers, which is the kind of fix that is worse than the finding.
#
# So the two files divide the job. `constraints.txt` is the one a reader installs against and it
# stays installable. This one is the tamper-evident record: an `==` pin says which version a run
# used, and a `--hash=` entry additionally says the bytes behind that version were not replaced
# after the fact, which is the half that defends against a compromised release rather than a
# careless one.
#
#     pip install -r requirements.lock      # exactly these bytes, nothing else
#     pip install . -c constraints.txt      # the project, held to these versions
#
# HOW IT WAS PRODUCED, so it can be produced again:
#
#     uv pip compile --generate-hashes --no-deps --python-version 3.14 constraints.txt
#
# `--no-deps` is load-bearing. Without it the resolver adds every transitive dependency at
# whatever version is current today, which is a different environment wearing this filename.
# With it, the twelve versions are exactly the twelve in constraints.txt, verified by
# `tests/test_declared_floors.py`, and all that is added is what they hash to.
#
# The Python floor is the same one constraints.txt carries, and for the same reason: one of these
# releases needs 3.12 or newer, so a resolution on an older interpreter cannot succeed.
