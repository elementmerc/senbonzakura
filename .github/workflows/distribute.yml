# SPDX-License-Identifier: AGPL-3.0-or-later
# Author:  Daniel Iwugo
# Comment: Christ is King
#
# Distribution fan-out: get every channel that needs no approval out of one push.
#
# WHY THIS EXISTS AS ITS OWN WORKFLOW
#
# `publish.yml` puts wheels on PyPI when a release is published, and it is deliberately narrow:
# it holds the trusted-publishing identity, so the less it does the better. This does everything
# else, holds no publishing identity beyond the repository's own package registry, and can
# therefore run on ordinary pushes.
#
# THE TWO LANES, AND WHY PYPI IS NOT IN THE FAST ONE
#
#   push to dev          container :dev, and a rolling pre-release carrying the wheels
#   tag vX.Y.Zrc1        the same, plus PyPI as a pre-release (pip install --pre)
#   tag vX.Y.Z on main   PyPI proper, container :latest, a real release
#
# The fast lane deliberately stops short of PyPI. A version on PyPI can never be reused and never
# really be withdrawn, so publishing one per commit would burn the version space permanently and
# fill the index with builds nobody asked for. A container tag is mutable and a GitHub pre-release
# is deletable, so the fast lane uses the channels where being wrong is recoverable.
#
# WHAT STILL NEEDS A HUMAN, ONCE
#
#   The Action's Marketplace listing is a tick-box on the first release that carries `action.yml`.
#   After that every release updates it automatically.
#
# WHAT IS NOT HERE AND WHY
#
#   Hugging Face Spaces and the VS Code Marketplace both need an account and a token this
#   repository does not hold. They are one secret away rather than one workflow away, and adding
#   half of each would be worse than a note saying so.
name: distribute

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

# The default token, and only what the registry needs. `contents: write` is scoped to the job that
# writes a pre-release rather than granted here, so the build job cannot write to the repository.
permissions:
  contents: read

concurrency:
  # One fan-out at a time per ref. Two pushes in a minute should produce the later artefact, not a
  # race over the same mutable tag.
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    name: work out which lane this is
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.decide.outputs.channel }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml
      - id: decide
        # Stated as one shell step rather than spread across `if:` expressions on every job,
        # because "which lane am I" is one question and answering it in six places is how two of
        # them end up disagreeing.
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "$ref" == refs/tags/v*rc* ]]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/tags/v* ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi
          version=$(python -c "import re,pathlib;\
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/senbonzakura/_version.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lane: $(grep channel= "$GITHUB_OUTPUT" | cut -d= -f2), version $version"

  container:
    name: container to ghcr
    needs: lane
    runs-on: ubuntu-latest
    # Scoped to this job alone, which is why the workflow-level block stays read-only.
    # `attestations: write` and `id-token: write` are what the build-provenance step needs: the
    # first to record the attestation against the repository, the second to get the OIDC token
    # that signs it. Neither is granted to any other job here.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        # `:dev` is mutable on purpose and `:vX.Y.Z` never moves. Somebody pinning a version gets
        # the bytes they pinned; somebody following the edge gets the edge.
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "${{ needs.lane.outputs.channel }}" in
            stable)     tags="$image:latest,$image:v${{ needs.lane.outputs.version }}" ;;
            prerelease) tags="$image:rc,$image:v${{ needs.lane.outputs.version }}" ;;
            *)          tags="$image:dev" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, as pinned in ci.yml
        with:
          python-version: "3.12"

      - name: Build the bundled data, because a checkout does not carry it
        # THE IMAGE SHIPPED WITHOUT ITS CORPORA UNTIL 2026-09-23, and the first run of this
        # workflow is what found it: `doctor` inside the image reported 7 of 19 checks failed,
        # every one of them a missing corpus or the missing evaluation track.
        #
        # The corpora and the track are GENERATED, not committed: they hold 4,895 harmful prompts
        # and the project publishes that corpus as a gated dataset on purpose, so a public git
        # tree must not carry them. A wheel gets them because building a wheel is a deliberate act
        # that attaches the licence notice. `.dockerignore` says in as many words that an image is
        # a release artefact like a wheel and should carry them too. Nothing ever built them here.
        #
        # This is the same two lines ci.yml already runs, for the same reason and with the same
        # credential. The third channel to be caught by one root cause in two days: an artefact
        # generated at build time is absent from every channel that does not explicitly build it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pyarrow
          python tools/packaging/build_corpora.py

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        # BUILT AND LOADED, NOT PUSHED. The smoke test below used to run after the push, and its
        # own failure message said so out loud: "the image was pushed and cannot run doctor".
        # A test that can only report what the public already has is not a gate, and on the first
        # real run of this workflow it published a broken image to :dev before saying anything.
        #
        # The push is a second call below. It costs no rebuild: the layers are in the GitHub
        # Actions cache from this step, so the second call is a cache hit and a registry upload.
        id: build
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: senbonzakura:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image can answer for itself, BEFORE anybody else can pull it
        # `doctor` is the right smoke test because its whole job is to say what an install can and
        # cannot do, and it exercises the vendored binaries rather than only the Python import.
        #
        # Its exit code is not used on its own: a CPU-only image legitimately carries a torch
        # advisory and exits non-zero for a reason that is not a fault. So the report is read.
        # "0 failed" is the assertion, and it is the one that was missing while the image job
        # grepped for two lines that said nothing about the bundled data.
        run: |
          set -euo pipefail
          # `--advisories-ok` RATHER THAN `|| true`, and the difference is what reaches this
          # script. doctor exits 1 on advisories alone, which under `set -e` would abort here for
          # something that is not a fault, so the status had to be discarded. `|| true` discarded
          # a real exit 2 along with it. The flag makes advisories exit 0 and leaves a genuine
          # failure non-zero, so doctor's own verdict is back in play and the greps below are a
          # second check rather than the only one. Measured 2026-10-10: `doctor` exits 1 and
          # `doctor --advisories-ok` exits 0 on a tree reporting 2 advisories and 0 failures.
          docker run --rm senbonzakura:smoke doctor --advisories-ok 2>&1 | tee doctor.txt
          grep -q "llama-quantize *vendored, runs" doctor.txt \
            || { echo "::error::the image ships a quantiser that does not run"; exit 1; }
          # The bundled track is the one named exception: it is packed from a held-out track that
          # lives outside this repository, so no CI job can build one. Named rather than covered
          # by a loosened count, and the line is still asserted to EXIST so that doctor dropping
          # the check entirely cannot pass as doctor being happy about it.
          grep -q "bundled track" doctor.txt \
            || { echo "::error::doctor no longer reports on the bundled track"; exit 1; }
          if grep -vE "bundled track" doctor.txt | grep -qE "^\s+✗"; then
            echo "::error::doctor reports failing checks inside the image, so it is not shippable"
            grep -E "^\s+✗" doctor.txt
            exit 1
          fi

      - name: The MIT notice ships beside the object code, read from the image itself
        # WHAT THIS GUARDS. `vendor/bin/` holds roughly 35 MB of ggml and llama.cpp object code
        # under MIT, and MIT requires the copyright notice travel with "all copies or substantial
        # portions". Until 2026-09-25 the vendoring tool copied that notice only if it happened to
        # already be on disk, and on a clean checkout it never was, because the step that fetches
        # it ran afterwards. Every image pushed to ghcr from this workflow carried the binaries
        # and no notice.
        #
        # WHY IT IS ASSERTED HERE AND NOT ONLY IN THE TOOL. The tool now refuses, which is the
        # real fix, and a gate that reads the tool's intent rather than the artefact is the shape
        # that let this escape in the first place: a comment in vendor_llama.py claimed a
        # re-vendor could not drop the notice while it was dropping it on every run. This reads
        # the image that is about to be pushed. It runs BEFORE the push for the same reason the
        # doctor smoke test does: a check that can only report what the public already has is not
        # a gate.
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh senbonzakura:smoke -c '
            set -eu
            bin=/usr/local/lib/python3.13/site-packages/senbonzakura/vendor/bin
            [ -d "$bin" ] || { echo "no vendored binary tree at $bin"; exit 1; }
            found=0
            for d in "$bin"/*/; do
              [ -d "$d" ] || continue
              found=$((found + 1))
              [ -s "$d/LICENSE" ] || { echo "no MIT notice beside the binaries in $d"; exit 1; }
              grep -qi "MIT License" "$d/LICENSE" || {
                echo "$d/LICENSE is present but is not the MIT notice"; exit 1; }
              echo "ok: ${d}LICENSE"
            done
            [ "$found" -gt 0 ] || { echo "no platform directory under $bin"; exit 1; }
          ' || { echo "::error::the image ships vendored binaries without their MIT notice"; exit 1; }

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        # The same layers, now that something has actually run them.
        id: push
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha

      # BUILD PROVENANCE, AND THE REASON IT IS WORTH ADDING RATHER THAN A CHECKBOX.
      #
      # The v0.4.0 build printed `fatal: not a git repository` and stamped a wheel with a commit
      # it had failed to compute, and nothing noticed. An attestation would not have prevented
      # that, and saying otherwise would be overclaiming: what it gives is a signed claim of the
      # commit and workflow an artefact was built from, so the stamp inside the artefact and the
      # provenance outside it can be COMPARED. A discrepancy becomes detectable rather than
      # invisible.
      #
      # Checked before building any of this, on 2026-10-01, because the PyPI side taught the
      # lesson the hard way: PEP 740 attestations for both distributions already existed and
      # nobody knew, because the legacy JSON API's `provenance` field is null while the Integrity
      # API holds the full document with a Rekor proof. So: does GHCR already carry attestations?
      # **No, and the reason is mechanistic rather than read off a 404.** PyPI's exist because the
      # INDEX mints them as a side effect of Trusted Publishing; GHCR has no automatic producer,
      # only this step, and `git log --all -S` over the whole history returns ZERO commits
      # containing `attest-build-provenance`, `attestations: write`, or even the string
      # `attestations:` anywhere under `.github/`. Nothing could have produced one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2, released 2026-08-06, 55 days clear of the 7-day cooldown
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # THE NAMED VERIFIER, HALF ONE OF TWO. An attestation nobody verifies is a file, exactly
      # like the 207 hashes in requirements.lock that nothing read until today. This half catches
      # the much more likely failure, which is the attest step silently not running.
      #
      # It is CIRCULAR and that is stated rather than hidden: a compromised workflow could attest
      # and verify its own output. The second half, a command in RELEASING.md that the operator
      # runs by hand before promoting, is what breaks the circle at the moment it matters.
      - name: Verify the attestation we just made
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # A digest the push step did not set would make the verify below pass vacuously by
          # verifying nothing, which is this repository's recurring defect: a check that examined
          # nothing reading as a check that passed.
          if [ -z "${DIGEST:-}" ]; then
            echo "::error::the push step reported no image digest, so there is nothing to verify and the attestation above cannot be confirmed to exist."
            exit 1
          fi
          echo "verifying ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"

          gh attestation verify \
            "oci://ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format json > attestation.json

          # `gh attestation verify` exits non-zero on a failed verification, so reaching here
          # means it passed. The assertion below is about something else: that what it verified
          # names THIS workflow and THIS commit, rather than merely being a valid signature over
          # something. A valid attestation for the wrong build is the interesting attack, and it
          # is the one a bare exit status cannot distinguish.
          python3 - <<'PY'
          import json, os, sys
          doc = json.load(open("attestation.json"))
          results = doc if isinstance(doc, list) else [doc]
          if not results:
              sys.exit("::error::gh attestation verify returned an empty result set, so it "
                       "confirmed nothing. An empty pass is not a pass.")
          sha = os.environ["GITHUB_SHA"]
          found = json.dumps(results)
          if sha not in found:
              sys.exit(f"::error::the verified attestation does not name the commit this run "
                       f"built ({sha}). A valid signature over a different build is exactly the "
                       f"case a bare exit status cannot tell from a correct one.")
          print(f"PASS: {len(results)} attestation(s), naming commit {sha}")
          PY

  wheels:
    name: wheels for the fast lane
    needs: lane
    if: needs.lane.outputs.channel != 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, as pinned in ci.yml
        with:
          python-version: "3.12"

      - name: A rolling build may not wear a release version
        # THE HAZARD, and it is not the wheel check being fussy. This lane publishes a PUBLIC rolling
        # pre-release that anybody can install, and it deliberately ships without the packed
        # evaluation track, because that track is cut from a held-out corpus kept off the build
        # machines and no CI job can make one. That was a fair trade while `dev` declared
        # `0.4.0.dev9`: a pre-release is allowed to be thin and the release notes say so.
        #
        # It stops being a fair trade the moment `dev` declares `0.4.0`. The rolling wheel's metadata
        # would then read `senbonzakura 0.4.0`, identical to the real release heading for PyPI, while
        # `--track default` fails for everyone who installed it. That is the 0.3.0 defect with a
        # version number that hides it, and a user comparing two wheels both called 0.4.0 has nothing
        # to go on. `check_wheel.py` caught it on the first push after the bump, which is the
        # "a flag can be forgotten, a version cannot" hardening doing precisely its job.
        #
        # So the lane stands down between the version bump and the tag, loudly. Suppressing the
        # artefact is the cheap and correct half; giving the rolling build a local version of its own
        # (`0.4.0+rolling.<sha>`, which can never be mistaken for the release) is the better one, and
        # it is recorded in DEFERRED.md rather than improvised here.
        #
        # SO IT WEARS A VERSION OF ITS OWN, as of 2026-09-28. Standing the lane down was the cheap
        # and correct half, and it left a public pre-release titled "Rolling development build"
        # serving two-day-old wheels with nothing on the page saying why. A PEP 440 local segment
        # fixes the actual problem: `0.4.0+rolling.<sha>` cannot be mistaken for `0.4.0` by a
        # reader or by pip, it records which commit it came from in the version itself, and
        # `check_wheel.is_release_artefact` already treats anything carrying a local segment as not
        # a release, so the thin-wheel allowance applies without a special case. PyPI rejects local
        # versions outright, which is a second guarantee that this artefact cannot reach the index.
        id: version
        run: |
          set -euo pipefail
          read_version() {
            python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('$1').read_text()).group(1))"
          }
          main_v=$(read_version src/senbonzakura/_version.py)
          echo "rolling=yes" >> "$GITHUB_OUTPUT"
          if printf '%s' "$main_v" | grep -q '\.dev'; then
            echo "declared=$main_v" >> "$GITHUB_OUTPUT"
            echo "the tree declares $main_v, already a pre-release version, so it is published as it stands"
            exit 0
          fi
          # Both distributions, because the wheel job builds both and two artefacts from one commit
          # disagreeing about their version is how a bug gets filed against a build nobody can name.
          local_v="${main_v}+rolling.$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          for f in src/senbonzakura/_version.py checker/src/senbonzakura_check/_version.py; do
            python - "$f" "$local_v" <<'STAMP'
          import pathlib, re, sys
          path, want = pathlib.Path(sys.argv[1]), sys.argv[2]
          text = path.read_text(encoding="utf-8")
          stamped = re.sub(r'^__version__ = "[^"]+"$', f'__version__ = "{want}"',
                           text, count=1, flags=re.M)
          if stamped == text:
              raise SystemExit(f"{path}: the version anchor did not match, so nothing was stamped")
          path.write_text(stamped, encoding="utf-8")
          print(f"{path} stamped {want}")
          STAMP
          done
          echo "declared=$local_v" >> "$GITHUB_OUTPUT"
          echo "::notice::the tree declares $main_v, a release version, so this lane publishes ${local_v} instead. A local segment can never be mistaken for the release and PyPI will not accept it."

      - name: Build the bundled data, because a checkout does not carry it
        if: steps.version.outputs.rolling == 'yes'
        # WITHOUT THIS THE FAST LANE PUBLISHES A WHEEL WITH NO CORPORA, which is the defect the
        # step below exists to catch and the same one that made the Colab notebook unusable. They
        # are generated rather than committed on purpose: they hold 4,895 harmful prompts and the
        # project publishes that corpus as a gated dataset. A wheel carries them because building
        # one is a deliberate act that attaches the licence notice, and nothing here was making
        # that act happen.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pyarrow
          python tools/packaging/build_corpora.py

      - name: Build both distributions
        if: steps.version.outputs.rolling == 'yes'
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build
          python -m build checker --outdir dist

      - name: The wheel carries what it claims
        if: steps.version.outputs.rolling == 'yes'
        # The same check the release path runs. A fast lane that skipped it would be a fast lane
        # for shipping a wheel with no corpora in it, which is the defect this project has already
        # shipped once.
        #
        # ONE WHEEL PER CALL, in a loop. This read `dist/*.whl`, which globs to BOTH distributions
        # since Q-29 put the checker in its own tree, and the script takes a single positional
        # argument: it exited 2 on "unrecognized arguments" before checking anything at all. So on
        # the first real run of this workflow the guard against a corpora-less wheel was itself
        # the reason nothing was checked. The script already knows both distributions and holds a
        # separate table of expectations for each, because what a distribution owes follows from
        # what it ships.
        #
        # NOT `--release`. A fast-lane build is a `.dev` version, `is_release_artefact` says that
        # is not a release artefact, and `test_a_pre_release_of_ours_is_not_forced_into_release_mode`
        # pins that on purpose: a pre-release is allowed to be thin. Forcing the strict table here
        # would override a decision somebody made deliberately and wrote a test for.
        #
        # The thing that actually needs guarding is narrower, so it is guarded directly below
        # rather than by reaching for a flag that means something else.
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test ${#wheels[@]} -eq 2 || {
            echo "::error::expected two wheels, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          }
          for wheel in "${wheels[@]}"; do
            echo "== $wheel"
            python tools/ci/check_wheel.py "$wheel"
          done

      - name: The wheel this lane publishes is not a thin one
        if: steps.version.outputs.rolling == 'yes'
        # The fast lane publishes a rolling pre-release somebody can actually install, and a wheel
        # without the corpora installs, imports, answers `--help` and then fails `--track default`
        # for every one of them. That is not hypothetical: it is what made the Colab notebook
        # unusable, found on 2026-09-22.
        #
        # Asserted against the built wheel rather than against the source tree, because the
        # question is what the artefact carries, and `package-data` has already once listed a glob
        # that matched none of the files it was meant to ship.
        run: |
          set -euo pipefail
          wheel=$(ls dist/senbonzakura-*.whl)
          python -c "import sys, zipfile; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$wheel" > names.txt
          # THE CORPORA ONLY, and `default-track.bin` deliberately is not here. The bundled
          # evaluation track is packed from a HELD-OUT track the operator keeps off this machine
          # and out of this repository (RELEASING.md, "Before anything else"), so no CI job can
          # build one and asserting it here would fail every push forever. What a CI-built
          # artefact can and cannot do is a live question, recorded in DEFERRED.md.
          for want in senbonzakura/data/corpora.bin; do
            grep -qxF "$want" names.txt || {
              echo "::error::$wheel does not carry $want, so --track default fails for anyone who installs it"
              exit 1
            }
          done
          echo "the published wheel carries its corpora and its track"

      - name: Publish or refresh the rolling pre-release
        if: steps.version.outputs.rolling == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One rolling tag rather than a release per commit. `dev` moves; anybody who wants a fixed
        # artefact takes a real release. Deleting and recreating is deliberate: a release whose
        # assets are stale is worse than no release, because the version string still looks right.
        run: |
          set -euo pipefail
          tag="rolling-dev"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* \
            --prerelease \
            --title "Rolling development build" \
            --notes "Built from ${GITHUB_SHA}. This is not a release: it is whatever \`dev\` was
          at the time, it has not been through the release review, and it will be replaced without
          warning. Use it to try something today. Do not build anything on it.

          Install: \`pip install <the wheel below>\`
          Container: \`docker run --rm ghcr.io/${GITHUB_REPOSITORY,,}:dev doctor\`"

  packaging-manifests:
    name: refresh the brew formula and scoop manifest
    needs: lane
    if: needs.lane.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      # The only job here that writes to the repository, and it touches exactly two files. Kept
      # separate from the container and wheel jobs for the reason ci.yml gives about its badge
      # job: a token that can write should never be in the same job as code it did not build.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml
        with:
          # `main` rather than the tag, because this job COMMITS the rewritten manifests and a tag
          # is not a branch. The check below is what makes that safe.
          ref: main
          fetch-depth: 0

      - name: The tag has to be on main before its manifests can be rewritten
        env:
          VERSION: ${{ needs.lane.outputs.version }}
        # WHY THIS EXISTS. On 2026-09-26 this job died on the v0.4.0 tag with
        # `FileNotFoundError: packaging/senbonzakura-check.rb`, and the formula and the manifest
        # carried placeholder URLs and a zeroed hash for two days as a result. The file was added
        # on `dev` three days before the tag and `main` had not been promoted yet, so the job
        # checked out a branch that genuinely did not have it.
        #
        # A traceback naming a missing file sends the reader looking for a packaging bug. The cause
        # was an ORDERING one: the release was tagged before `main` was moved. So this states the
        # real condition and refuses on it, rather than discovering it three steps later as an
        # exception. Promote first, then tag, which is what the branch discipline says anyway.
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "v${VERSION}" HEAD; then
            echo "::error::v${VERSION} is not an ancestor of main, so main does not carry what was tagged. Promote main to the released commit, then re-run this job. Rewriting the manifests now would point them at a tarball built from code main does not have."
            exit 1
          fi
          missing=""
          for f in packaging/senbonzakura-check.rb bucket/senbonzakura-check.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::main is missing:$missing. These are the files this job rewrites, so there is nothing to point at a release. If they were renamed, this job needs teaching; if main is behind, promote it."
            exit 1
          fi

      - name: Rewrite the version and the hashes
        env:
          VERSION: ${{ needs.lane.outputs.version }}
        # Hand-editing these is how a formula ends up pointing at a tarball that no longer has
        # that hash, which fails for the user and nobody else. The hash is taken from the archive
        # GitHub actually serves rather than computed from the working tree, because those are not
        # the same bytes and only one of them is what `brew` will download.
        run: |
          set -euo pipefail
          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          zipball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.zip"
          tar_sha=$(curl -fsSL "$tarball" | sha256sum | cut -d' ' -f1)
          zip_sha=$(curl -fsSL "$zipball" | sha256sum | cut -d' ' -f1)
          repo_name="${GITHUB_REPOSITORY#*/}"

          python - "$VERSION" "$tarball" "$tar_sha" "$zip_sha" "$repo_name" <<'PY'
          import json, pathlib, re, sys
          version, tarball, tar_sha, zip_sha, repo = sys.argv[1:6]

          formula = pathlib.Path("packaging/senbonzakura-check.rb")
          text = formula.read_text(encoding="utf-8")
          text = re.sub(r'^  url ".*"$', f'  url "{tarball}"', text, flags=re.M)
          text = re.sub(r'^  sha256 ".*"$', f'  sha256 "{tar_sha}"', text, flags=re.M)
          formula.write_text(text, encoding="utf-8")

          manifest = pathlib.Path("bucket/senbonzakura-check.json")
          doc = json.loads(manifest.read_text(encoding="utf-8"))
          doc["version"] = version
          doc["url"] = tarball.replace(".tar.gz", ".zip")
          doc["hash"] = zip_sha
          doc["extract_dir"] = f"{repo}-{version}\\checker"
          manifest.write_text(json.dumps(doc, indent=4) + "\n", encoding="utf-8")
          print(f"refreshed both manifests to {version}")
          PY

      - name: Commit them if they moved
        env:
          VERSION: ${{ needs.lane.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "manifests already describe ${VERSION}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/senbonzakura-check.rb bucket/senbonzakura-check.json
          git commit -m "chore(packaging): point the brew formula and scoop manifest at v${VERSION}"
          git push
