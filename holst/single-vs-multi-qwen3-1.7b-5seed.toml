# SUPERSEDED 2026-08-05. Do not re-run this spec to produce numbers.
#
# Its resume guards test only whether an output file PARSES, and its outputs exist, so every job
# short-circuits and the run reports success having measured nothing. Its report block recomputes
# a winner with min() instead of reading the harness's `ranking` verdict, so it can crown an arm
# the harness refused to rank. Both are fixed in tools/artefact_ok.py and tools/report_bands.py,
# which this spec predates. Kept for the record of what was run, not as a thing to run.
#
# Does removing three refusal directions beat removing one?
#
# The project's headline claim, measured on rows nothing was fitted or selected on. Two arms
# per seed, identical in every respect except the one being tested, across five seeds.
#
# Pre-registered in private/plans/pre-registration-2026-07-30-rematch.md section 5, which was
# amended BEFORE this file existed to record why the third arm (K=3 with the hedging
# direction) is not here: there is no hedged-compliance dataset anywhere, so the hedging
# direction cannot be folded in either arm. That absence is what makes these two arms a clean
# isolation of K rather than a confound.
#
# Why this is not a rented run: Qwen3-1.7B fits the 6 GB card, and the arms differ by one
# integer, so the whole comparison is affordable on hardware already owned.
#
# The ten arm blocks are mechanical copies differing only in SEED and K. They are generated
# and then read back and checked rather than hand-copied, because a seed that silently repeats
# turns five independent measurements into three and nothing in the output would say so.
#
# Seed 42 ran on 2026-08-02 and its three result files are already on disk. Its two arms are
# still listed here and will short-circuit on the already-complete check below. That is the
# point: the run is declared in full, and what has already been measured is not measured again.
run = "single-vs-multi-qwen3-1.7b-5seed"

[[job]]
id = "setup"
machine = "rog"
timeout_secs = 1800
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout
test -d "$RUN/src/senbonzakura" || { echo "MISSING_TREE"; exit 1; }
test -d "$T/bad_eval_ds" || { echo "MISSING_TRACK"; exit 1; }
"$PY" -c 'import torch; assert torch.cuda.is_available()'
cd "$RUN"
PYTHONPATH=src "$PY" -u -m senbonzakura.track --out "$T" --audit

# The claim under test is about K, so the thing that would quietly invalidate it is a hedge
# set appearing in the track and being folded into the K=3 arm only. Refuse rather than
# measure a confound: if a hedge set is added later, this spec must be rewritten to carry
# the third arm, not silently run a different comparison under the same name.
if [ -d "$T/hedge_ds" ]; then
    echo "HEDGE_SET_PRESENT: this spec's two arms no longer isolate K; see the pre-registration"
    exit 1
fi
mkdir -p "$RUN/results" "$RUN/margins" "$RUN/gens" "$RUN/abl"
echo SETUP_OK
"""

# The search knobs below are NOT kageyoshi's. kageyoshi resolves its own budget and pins
# --max-directions to 3, so the K=1 arm cannot be expressed through it. Both arms therefore
# set the knobs by hand, to the same values kageyoshi would choose for a sub-5B model, so the
# only difference between the arms is --max-directions:
#
#   trials 100, dir-prompts 256, eval-refusal 64, eval-kl 64, eval-refusal-final 128,
#   search pareto, per-component, kl-scale 4.0, top-rescore 6, patience 33
#
# 128 fits inside the recorded 132-row search partition, and 256 + 64 inside the 385
# harmless rows set aside; the tree refuses the run rather than crossing either boundary.

[[job]]
id = "arm-k1-seed-42"
name = "K=1, seed 42"
machine = "rog"
deps = ["setup"]
timeout_secs = 14400
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "ARM_OK" }
command = """
set -euo pipefail
exec 2>&1
SEED=42
K=1
ARM="k$K-s$SEED"
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout
M=$HOME/track-matched/good_matched_ds
O=$RUN/abl/$ARM
cd "$RUN"
mkdir -p "$RUN/results" "$RUN/margins" "$RUN/gens" "$RUN/abl"

# TWO locks, because they stop two different accidents and neither covers the other.
#
# The per-arm lock stops a second copy of THIS arm. A detached job survives the orchestrator
# giving up on its launcher, so a launch wrongly written off leaves this arm running while a
# retry is dispatched at it.
exec 9>"$RUN/abl/$ARM.lock"
flock -n 9 || { echo "ARM_BUSY: another attempt of $ARM holds the lock; refusing to run a second copy"; exit 1; }

# The card lock stops two DIFFERENT arms sharing one GPU, which the per-arm lock permits by
# construction and which happened on 2026-08-03: the orchestrator reattached to a running job
# after a restart without re-taking its GPU slot, believed the card was free, and put a second
# arm on it. That is not merely slow. The VRAM governor sizes the generation batch from
# available headroom, so the second arm baselined at 0.9 GB where every other arm had 1.9 GB,
# and reproducibility only holds at a fixed batch size. Both arms had to be discarded.
#
# It WAITS rather than failing, because the second arm is legitimate work that simply must not
# start yet, and it announces the wait so a run that serialises does not look like a run that
# hung.
exec 8>"$RUN/abl/gpu.lock"
if ! flock -n 8; then
    echo "GPU_BUSY: another arm holds the card; waiting rather than sharing it"
    flock -w 14000 8 || { echo "GPU_WAIT_TIMEOUT: the card never came free"; exit 1; }
fi
echo "GPU_ACQUIRED $ARM"

# Already measured is a success, not work to repeat. On 2026-08-02 both arms wrote all three
# result files and were then retried anyway, and the retry died on the Optuna study the first
# attempt had already created. A completed arm now says so and stops.
#
# The test is that all three files PARSE, not that they are non-empty. The scorers write their
# result with a plain open-and-dump, so a job killed mid-write leaves a truncated file that is
# still non-empty; a size test would call that arm complete and skip re-measuring it.
if "$PY" -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]" "results/$ARM-compass.json" "results/$ARM-harmful.json" "results/$ARM-harmless.json" >/dev/null 2>&1; then
    echo "ARM_ALREADY_COMPLETE: $ARM has all three result files and they parse, leaving them untouched"
    echo ARM_OK
    exit 0
fi

# A fresh attempt is a fresh search. A part-written study from a killed attempt is never
# resumed silently: the seed fixes the trial sequence, so a resumed search is not the search
# the pre-registration describes, and the difference would be invisible in the output.
rm -f "$RUN/abl/$ARM.db"
rm -rf "$O"

# The commit is read from the file the ship step writes beside the tree, not from the
# environment: this job runs over ssh to PowerShell to wsl to bash, and an exported variable
# does not survive that. Reading it from the tree also ties the declared commit to the code
# that was actually shipped, which is what provenance is supposed to mean.
export SENBONZAKURA_COMMIT="$(cat "$RUN/COMMIT" 2>/dev/null || true)"
[ -n "$SENBONZAKURA_COMMIT" ] || { echo "NO_COMMIT_FILE: $RUN/COMMIT is missing, so this run could not name its own code"; exit 1; }
export PYTHONPATH=src

"$PY" -u -m senbonzakura.cli --model Qwen/Qwen3-1.7B --out "$O" --track "$T" \
    --max-directions $K --seed $SEED --device cuda --gen-batch 16 \
    --trials 100 --dir-prompts 256 --eval-refusal 64 --eval-kl 64 --eval-refusal-final 128 \
    --search pareto --per-component --kl-scale 4.0 --top-rescore 6 --patience 33 \
    --study-db "$RUN/abl/$ARM.db"
test -d "$O"

"$PY" -u -m senbonzakura.score --model "$O" --eval "$T/bad_eval_ds" --skip 132 --n 512 \
    --batch 16 --device cuda --label "$ARM-harmful" \
    --out "results/$ARM-harmful.json" --save-generations "gens/$ARM-harmful.jsonl"
# The harmless arm is not optional. A refusal rate that fell because the model can no longer
# refuse anything is indistinguishable from one that fell because the surgery worked, unless
# this is measured beside it.
"$PY" -u -m senbonzakura.score --model "$O" --eval "$T/good_ds" --skip 385 --n 512 \
    --batch 16 --device cuda --label "$ARM-harmless" \
    --out "results/$ARM-harmless.json" --save-generations "gens/$ARM-harmless.jsonl"
"$PY" -u -m senbonzakura.margin --model "$O" \
    --harmful "$T/bad_eval_ds" --harmless "$T/good_ds" --harmless-matched "$M" \
    --skip-harmful 132 --skip-harmless 385 --n 4504 \
    --batch 16 --bootstrap 2000 --seed $SEED --device cuda --label "$ARM-compass" \
    --out "results/$ARM-compass.json" --margins "margins/$ARM-compass.jsonl" \
    --compare-to "margins/base-Qwen3-1.7B.jsonl"

# Keep the record of the K that was actually APPLIED before the output tree goes. abliteration.json
# carries dirs_per_layer, and the separation filter can leave a layer with fewer directions than
# were requested: on 2026-08-03 every K=3 arm reported one direction per layer within the search
# window. Deleting the only file that says so, which this script used to do, makes the arm
# unfalsifiable. The result is not evidence about K unless the applied K is on record beside it.
mkdir -p "$RUN/applied-k"
cp "$O/abliteration.json" "$RUN/applied-k/$ARM-abliteration.json" 2>/dev/null     || echo "WARNING: $O/abliteration.json is missing, so the applied K for $ARM is unrecorded"

rm -rf "$O"
echo ARM_OK
"""

