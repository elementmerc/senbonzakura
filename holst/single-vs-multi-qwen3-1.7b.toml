# Does removing three refusal directions beat removing one?
#
# The project's headline claim, measured on rows nothing was fitted or selected on. Two arms,
# identical in every respect except the one being tested.
#
# Pre-registered in private/plans/pre-registration-2026-07-30-rematch.md section 5, which was
# amended BEFORE this file existed to record why the third arm (K=3 with the hedging
# direction) is not here: there is no hedged-compliance dataset anywhere, so the hedging
# direction cannot be folded in either arm. That absence is what makes these two arms a clean
# isolation of K rather than a confound.
#
# Why this is not a rented run: Qwen3-1.7B fits the ROG's 6 GB, and the arms differ by one
# integer, so the whole comparison is affordable on hardware already owned.
run = "single-vs-multi-qwen3-1.7b-2026-07-30"

[[job]]
id = "setup"
machine = "rog"
timeout_secs = 1800
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout
test -d "$RUN/src/senbonzakura" || { echo "MISSING_TREE"; exit 1; }
test -d "$T/bad_eval_ds" || { echo "MISSING_TRACK"; exit 1; }
"$PY" -c 'import torch; assert torch.cuda.is_available()'
cd "$RUN"
PYTHONPATH=src "$PY" -m senbonzakura.track --out "$T" --audit

# The claim under test is about K, so the thing that would quietly invalidate it is a hedge
# set appearing in the track and being folded into the K=3 arm only. Refuse rather than
# measure a confound: if a hedge set is added later, this spec must be rewritten to carry
# the third arm, not silently run a different comparison under the same name.
if [ -d "$T/hedge_ds" ]; then
    echo "HEDGE_SET_PRESENT: this spec's two arms no longer isolate K; see the pre-registration"
    exit 1
fi
mkdir -p "$RUN/results" "$RUN/margins" "$RUN/gens" "$RUN/abl"
echo SETUP_OK
"""

# ── the two arms ──────────────────────────────────────────────────────────────────────
# NOT kageyoshi. kageyoshi resolves its own budget and pins --max-directions to 3, so the
# K=1 arm cannot be expressed through it. Both arms therefore set the search knobs by hand,
# to the same values kageyoshi would choose for a sub-5B model, so the only difference
# between the arms is --max-directions:
#
#   trials 100, dir-prompts 256, eval-refusal 64, eval-kl 64, eval-refusal-final 128,
#   search pareto, per-component, kl-scale 4.0, top-rescore 6, patience 33
#
# 128 fits inside the recorded 132-row search partition, and 256 + 64 inside the 385
# harmless rows set aside; the tree refuses the run rather than crossing either boundary.

[[job]]
id = "arm-a-k1-seed-42"
name = "K=1, the single-direction baseline, seed 42"
machine = "rog"
deps = ["setup"]
timeout_secs = 14400
resources = { needs_gpu = true, ram_gb = 8 }
success = { type = "stdout-contains", needle = "ARM_OK" }
command = """
set -euo pipefail
exec 2>&1
SEED=42
K=1
ARM="k$K-s$SEED"
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout
M=$HOME/track-matched/good_matched_ds
O=$RUN/abl/$ARM
cd "$RUN"
export SENBONZAKURA_COMMIT="${SENBON_COMMIT:-unset}"
[ "$SENBONZAKURA_COMMIT" != "unset" ] || { echo "SET SENBON_COMMIT"; exit 1; }
export PYTHONPATH=src

"$PY" -m senbonzakura.cli --model Qwen/Qwen3-1.7B --out "$O" --track "$T" \
    --max-directions $K --seed $SEED --device cuda --gen-batch 16 \
    --trials 100 --dir-prompts 256 --eval-refusal 64 --eval-kl 64 --eval-refusal-final 128 \
    --search pareto --per-component --kl-scale 4.0 --top-rescore 6 --patience 33 \
    --study-db "$RUN/abl/$ARM.db"
test -d "$O"

"$PY" -m senbonzakura.score --model "$O" --eval "$T/bad_eval_ds" --skip 132 --n 512 \
    --batch 16 --device cuda --label "$ARM-harmful" \
    --out "results/$ARM-harmful.json" --save-generations "gens/$ARM-harmful.jsonl"
# The harmless arm is not optional. A refusal rate that fell because the model can no longer
# refuse anything is indistinguishable from one that fell because the surgery worked, unless
# this is measured beside it.
"$PY" -m senbonzakura.score --model "$O" --eval "$T/good_ds" --skip 385 --n 512 \
    --batch 16 --device cuda --label "$ARM-harmless" \
    --out "results/$ARM-harmless.json" --save-generations "gens/$ARM-harmless.jsonl"
"$PY" -m senbonzakura.margin --model "$O" \
    --harmful "$T/bad_eval_ds" --harmless "$T/good_ds" --harmless-matched "$M" \
    --skip-harmful 132 --skip-harmless 385 --n 4504 \
    --batch 16 --bootstrap 2000 --seed $SEED --device cuda --label "$ARM-compass" \
    --out "results/$ARM-compass.json" --margins "margins/$ARM-compass.jsonl" \
    --compare-to "margins/base-Qwen3-1.7B.jsonl"
rm -rf "$O"
echo ARM_OK
"""

[[job]]
id = "arm-b-k3-seed-42"
name = "K=3, the refusal subspace, seed 42"
machine = "rog"
deps = ["setup"]
timeout_secs = 14400
resources = { needs_gpu = true, ram_gb = 8 }
success = { type = "stdout-contains", needle = "ARM_OK" }
command = """
set -euo pipefail
exec 2>&1
SEED=42
K=3
ARM="k$K-s$SEED"
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout
M=$HOME/track-matched/good_matched_ds
O=$RUN/abl/$ARM
cd "$RUN"
export SENBONZAKURA_COMMIT="${SENBON_COMMIT:-unset}"
[ "$SENBONZAKURA_COMMIT" != "unset" ] || { echo "SET SENBON_COMMIT"; exit 1; }
export PYTHONPATH=src

# Byte-identical to arm A but for --max-directions. Written out in full rather than shared
# through a variable, because the one line that differs between two arms of a comparison
# should be visible in a diff of the two blocks.
"$PY" -m senbonzakura.cli --model Qwen/Qwen3-1.7B --out "$O" --track "$T" \
    --max-directions $K --seed $SEED --device cuda --gen-batch 16 \
    --trials 100 --dir-prompts 256 --eval-refusal 64 --eval-kl 64 --eval-refusal-final 128 \
    --search pareto --per-component --kl-scale 4.0 --top-rescore 6 --patience 33 \
    --study-db "$RUN/abl/$ARM.db"
test -d "$O"

"$PY" -m senbonzakura.score --model "$O" --eval "$T/bad_eval_ds" --skip 132 --n 512 \
    --batch 16 --device cuda --label "$ARM-harmful" \
    --out "results/$ARM-harmful.json" --save-generations "gens/$ARM-harmful.jsonl"
"$PY" -m senbonzakura.score --model "$O" --eval "$T/good_ds" --skip 385 --n 512 \
    --batch 16 --device cuda --label "$ARM-harmless" \
    --out "results/$ARM-harmless.json" --save-generations "gens/$ARM-harmless.jsonl"
"$PY" -m senbonzakura.margin --model "$O" \
    --harmful "$T/bad_eval_ds" --harmless "$T/good_ds" --harmless-matched "$M" \
    --skip-harmful 132 --skip-harmless 385 --n 4504 \
    --batch 16 --bootstrap 2000 --seed $SEED --device cuda --label "$ARM-compass" \
    --out "results/$ARM-compass.json" --margins "margins/$ARM-compass.jsonl" \
    --compare-to "margins/base-Qwen3-1.7B.jsonl"
rm -rf "$O"
echo ARM_OK
"""

# Seeds 43 to 46: copy the pair and change SEED. Deliberately not written out until seed 42
# has run once, because ten jobs sized from a guess is how a spec wastes a night.

[[job]]
id = "compare"
name = "K=1 against K=3, from the files"
machine = "rog"
deps = ["arm-a-k1-seed-42", "arm-b-k3-seed-42"]
timeout_secs = 600
success = { type = "stdout-contains", needle = "COMPARE_OK" }
command = """
set -euo pipefail
exec 2>&1
cd "$HOME/senbon-run"
$HOME/track2/venv/bin/python - <<'PY'
import glob
import json

def read(pattern):
    out = {}
    for path in glob.glob(pattern):
        out[path] = json.loads(open(path).read())
    return out

rows = []
for k in (1, 3):
    h = read(f"results/k{k}-s*-harmful.json")
    g = read(f"results/k{k}-s*-harmless.json")
    c = read(f"results/k{k}-s*-compass.json")
    if not h:
        continue
    # score.py's own key names: heretic, refusal, soft_refusal, broken.
    rows.append({
        "K": k,
        "seeds": len(h),
        "keyword_mean": round(sum(d["heretic"] for d in h.values()) / len(h), 4),
        "refusal_mean": round(sum(d["refusal"] for d in h.values()) / len(h), 4),
        "soft_mean": round(sum(d["soft_refusal"] for d in h.values()) / len(h), 4),
        # The harmless arm, always beside the harmful one.
        "harmless_refusal_mean": (round(sum(d["refusal"] for d in g.values()) / len(g), 4)
                                  if g else None),
        "broken_mean": round(sum(d["broken"] for d in h.values()) / len(h), 4),
        "auc_mean": (round(sum(d["auc"] for d in c.values()) / len(c), 4) if c else None),
        # The paired interval on the change from base, which is the number that says whether
        # a difference is distinguishable from no change at all.
        "paired": [d.get("paired", {}).get("delta_ci") for d in c.values()],
        "length_only_auc": [(d.get("controls") or {}).get("length_only_auc") for d in c.values()],
    })
print(json.dumps(rows, indent=2))
open("results/SINGLE_VS_MULTI.json", "w").write(json.dumps(rows, indent=2) + "\\n")

# The declared outcome, evaluated by the script rather than by eye on the evening the
# numbers land. Says "inconclusive" out loud, because that is a result and not a failure.
if len(rows) == 2:
    a, b = rows[0], rows[1]
    delta = b["keyword_mean"] - a["keyword_mean"]
    print(f"\\nK=3 minus K=1 on the keyword axis: {delta:+.4f} "
          f"({'K=3 better' if delta < 0 else 'K=1 better or equal'})")
    print("One seed per arm carries no interval; five are needed before this is read as "
          "evidence either way.")
PY
echo COMPARE_OK
"""
