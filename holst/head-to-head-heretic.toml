# Task 27: the Qwen3-1.7B head to head against Heretic. A v0.4 exit gate.
#
# THIS FILE USED TO BE 421 LINES AND IS NOW TWO JOBS.
#
# It carried the whole benchmark as shell embedded in configuration: the arms, their resume
# guards, the scoring, the report, and about a dozen invariants asserted by hand. Of the fifteen
# defects found on 2026-08-05 and 06, most were in that shell rather than in either tool. Two
# resume guards asked their artefacts for a key those artefacts never carried, so neither could
# ever fire. A success marker was printed whether or not the work happened, so a rehearsal
# reported five jobs done having measured nothing, and the fix for that was undone by a careless
# splice a few hours later. The scorer was invoked three wrong ways at once.
#
# None of that is a coincidence: configuration cannot be tested, and it does not ship in a wheel,
# so nobody outside this machine could run the benchmark at all. Decision Q-5 moved the operation
# into the tool, where it has 73 tests and a `--help`. What is left here is the part an
# orchestrator is genuinely for.
#
# WHO OWNS WHAT, NOW
#
#   senbonzakura owns the OPERATION: which arms, the equal budget, the resume guards, the
#   artefact contracts, one judge over both tools, the tie rule, the report. All of it testable,
#   all of it runnable by a stranger with `pip install senbonzakura` and no orchestrator at all.
#
#   holst owns the MACHINE: which box, the GPU lock, the wall-clock ceiling, the stall watchdog,
#   retries across a dropped link, and streaming the log somewhere durable. None of that is part
#   of the method, which is why none of it is in the public tool.
#
# The rule this file now satisfies by construction: a spec may not contain bash beyond a single
# command invocation. There is nothing here for a careless splice to break.
#
# WHAT WOULD MAKE THIS RUN MEANINGLESS is still guarded, but by the tool rather than by this file:
# different corpora per tool (the staged slices record which corpus they were cut from, and the
# run refuses a pair that disagree), different judges (one compass over every model), a stale
# artefact reused (a manifest must agree on tool, seed, model and budget AND every artefact must
# be present), and an arm that exits cleanly having produced nothing (a failure, and it leaves no
# manifest, so the next run retries rather than inheriting the silence).
#
# A CARD THAT DROPS MID-RUN remains holst's problem and is why `stall_secs` is set: when WSL2 goes
# away under a running arm the work stops but the ssh channel does not close, so the job is
# neither finished nor failed. A rehearsal once sat like that for two and a half hours after its
# arm had already written every artefact and exited.
run = "head-to-head-heretic-2026-08-05"

[[job]]
id = "stage"
name = "cut the evaluation slices both tools are scored on"
machine = "rog"
timeout_secs = 3600
success = { type = "all", of = [
    { type = "exit-zero" },
    { type = "stdout-contains", needle = "STAGE_OK" },
    { type = "stdout-lacks", needle = "FAILED" },
    { type = "not-timed-out" },
] }
command = """
set -euo pipefail
exec 2>&1
PYTHONPATH=$HOME/senbon-run/src $HOME/track2/venv/bin/python -m senbonzakura.bench stage \\
    --track "$HOME/track-heldout" --out "$HOME/bench-eval" \\
    --dir-prompts 256 --eval-refusal 64 --eval-refusal-final 128 --eval-kl 64
echo STAGE_OK
"""

[[job]]
id = "bench"
name = "both tools, five seeds each, scored by one instrument, reported"
machine = "rog"
deps = ["stage"]
# Measured, not guessed: 13.7s a trial for Heretic and about 19s for ours, five seeds each at 200
# trials, plus roughly 11 minutes a seed for Heretic's selection pass and the scoring afterwards.
# That is a little over ten hours; this ceiling is a shade over four times it.
timeout_secs = 172800
max_retries = 3
success = { type = "all", of = [
    { type = "exit-zero" },
    { type = "stdout-contains", needle = "BENCH_OK" },
    { type = "stdout-lacks", needle = "FAILED" },
    { type = "not-timed-out" },
] }
command = """
set -euo pipefail
exec 2>&1
PYTHONPATH=$HOME/senbon-run/src $HOME/track2/venv/bin/python -m senbonzakura.bench head-to-head \\
    --tools senbon,heretic --seeds 42,43,44,45,46 --trials 200 \\
    --model "$HOME/bench-models/Qwen3-1.7B" --track "$HOME/track-heldout" \\
    --eval-slices "$HOME/bench-eval" \\
    --harmful "$HOME/track-heldout/bad_eval_ds" --harmless "$HOME/track-heldout/good_ds" \\
    --skip-harmful 128 --batch 16 \\
    --isolate docker --image senbon=senbon-bench:senbonzakura --image heretic=senbon-bench:heretic \\
    --out "$HOME/bench-out/h2h"
echo BENCH_OK
"""

# The stall watchdog belongs here rather than beside `timeout_secs`, and writing it at the job's
# top level is how a ten-hour GPU job ended up with none at all: serde accepted the key and threw
# it away. holst now refuses an unknown key rather than dropping it, which is what makes this note
# a note rather than a trap. No new output for 45 minutes means the card has gone, not that a
# trial is slow: the slowest single step measured is the save, at under a minute.
[job.resources]
stall_secs = 2700
