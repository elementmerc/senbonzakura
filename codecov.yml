# Codecov reports; it does not gate.
#
# The coverage gate for this project is `fail_under` in pyproject.toml, enforced by pytest on
# every run, locally and on every CI job. Codecov exists here to publish a figure a reader can
# click through to, and to make the README badge something measured rather than something typed.
#
# So every status below is `informational: true`: Codecov posts its verdict and never marks a
# check failed. Two reasons. A third party deciding whether this repository's build is green is
# a dependency the build does not need; and Codecov's project status compares against a base
# commit it may not have a report for, which fails for reasons that have nothing to do with the
# change under review.
#
# The uploaded figure comes from ONE matrix row (ubuntu-latest, python 3.12) and is measured
# WITHOUT the release artefacts, so it sits a couple of points below the local full-suite
# figure. That gap is documented in ci.yml and is deliberately not papered over.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true

# Test code is measured by `source = ["senbonzakura"]` in pyproject, so this is belt and braces
# rather than the control. Named here so the two configurations cannot silently disagree.
ignore:
  - "tests/**"
  - "tools/**"
  - "docs/**"
  - "src/senbonzakura/vendor/**"
