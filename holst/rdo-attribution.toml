[[job]]
id = "report"
name = "read the ladder"
machine = "rog"
deps = ["baseline-qwen3", "a0", "a1", "a2", "a3", "a3-gemma"]
timeout_secs = 900
success = { type = "stdout-contains", needle = "REPORT_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python

PYTHONPATH="$RUN/src" "$PY" - <<'EOF'
import json, os, sys
sys.path.insert(0, os.path.expanduser("~/senbon-run/src"))
from senbonzakura.validate import matched_refusal_table

RUN = os.path.expanduser("~/senbon-run")
LADDER = [("A0  control (pre-2026-08-04)", "a0"), ("A1  + per-token score", "a1"),
          ("A2  + induction", "a2"), ("A3  + warm start (shipped)", "a3"),
          ("B   difference-of-means", "baseline-qwen3"), ("C   A3 on gemma", "a3-gemma")]


def load(name):
    try:
        with open(f"{RUN}/attrib/{name}.json", encoding="utf-8") as f:
            return json.load(f)
    except (OSError, ValueError):
        return None


print("\\n=== KL at matched refusal removal, by arm ===")
print("Lower KL at the SAME refusal level is better. An arm missing from a band could not reach")
print("it at any strength on the grid, which is itself a result and not a gap in the table.\\n")

for label, name in LADDER:
    r = load(name)
    print(f"--- {label}")
    if not r or "e4" not in r:
        print("    MISSING\\n"); continue
    e4 = r["e4"]
    if e4.get("degenerate_reason"):
        print(f"    UNREADABLE: {e4['degenerate_reason']}\\n"); continue
    t = matched_refusal_table(e4["rows"])
    if not t.get("baseline_is_unablated"):
        print("    DROPPED: no unablated anchor, so its bands are not comparable\\n"); continue
    print(f"    baseline refusal {t['baseline_refusal']:.4f} (unablated)")
    for band, entries in t["targets"].items():
        parts = []
        for K, e in sorted(entries.items(), key=lambda kv: int(kv[0])):
            parts.append(f"K={K}:{e['kl']:.4f}(over {e['overshoot']:+.3f})")
        kls = {int(K): e["kl"] for K, e in entries.items()}
        best = min(kls, key=kls.get)
        print(f"    {band:<14} " + "  ".join(parts) + f"   cheapest K={best}")
    print()

print("How to read it. Each rung adds ONE change to the rung above, so the difference between")
print("adjacent rows is that change's contribution and nothing else. If A0 and A3 are alike, the")
print("three fixes did not matter and the RDO underperformance is somewhere we have not looked.")
print("If any arm beats B at a matched band, an optimised direction has beaten the simplest")
print("direction in the tool for the first time. If none does, that is publishable as it stands,")
print("and it is one seed either way.")
EOF
echo REPORT_OK
"""
