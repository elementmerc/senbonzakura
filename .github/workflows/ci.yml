name: CI

# Actions are pinned by commit SHA, not by tag (baseline §5): a tag can be moved
# to point at different code, and a compromised action runs with the workflow's
# token. The version comment after each SHA is for humans; the SHA is the pin.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# THE RUNNER'S COVERAGE FLOOR IS NOW THE DEVELOPER'S FLOOR, and the separate number that used to
# live here is gone, along with the `env:` block that held it. A workflow with an `env:` key and
# nothing under it is not an empty mapping, it is null, and GitHub rejects the whole file: the
# run completes as a failure with ZERO jobs, which looks nothing like a normal red build. PyYAML
# parses it happily, so a local `yaml.safe_load` is not enough to catch it and did not.
#
# Keeping the history because the reason the floor existed was sound and the reason it stopped
# is the interesting part.
#
# It read 92.5, against pyproject's fail_under = 95, because a developer has the packed track,
# the packed corpora and the vendored binaries and a runner has none of them, so the tests that
# exercise that code skipped, and skipped tests cover nothing. Measured then:
#
#     everything present                   95.08%   <- developers and the release build
#     corpora and binaries, no track       94.58%
#     nothing, which is what a runner had  92.98%
#
# Two things closed that gap on 2026-09-11. The coverage row now fetches the corpora and the
# vendored binaries itself, which un-skips 61 tests that had never run on a runner at all; and
# roughly two hundred branches that executed only one way got their other side tested. Measured
# again, same tree, coverage.py's own blended figure:
#
#     coverage row, corpora and binaries   96.25%
#     every other row, no artefacts        95.73%   <- the weakest configuration
#
# The weakest runner now clears 95 with room, so the divergence has nothing left to describe.
# One number, in one place, and CI meets the gate a developer meets rather than a softer one
# that has to be kept honest by hand.
#
# If this has to come back, put the measurement beside it as above. A floor is the number the
# WEAKEST configuration must clear, and it is only worth having when that number is genuinely
# lower for a reason nobody can fix.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on every runner, including Windows, so one `run:` line cannot mean
        # two different things. Windows runners ship Git Bash.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Python versions are swept on Linux: the ends of the supported range plus
        # one in the middle. The floors differ per version because torch's wheel
        # availability does: 2.5 has no cp313 build and the first with cp314 is 2.9,
        # which pyproject encodes.
        #
        # Windows and macOS get one representative version rather than the full
        # sweep. Three OSes times three versions is nine jobs to catch what one
        # version per platform catches, and what differs across platforms here is
        # the platform, not the interpreter: /proc/meminfo does not exist off Linux,
        # and an open file handle blocks deletion on Windows.
        #
        # macos-latest is arm64. Do not pin macos-13: the CPU index's newest x86_64
        # torch is 2.2.2, below this project's declared 2.5 floor, so an x86 runner
        # cannot install a supported torch at all.
        #
        # THE COVERAGE FLOOR IS PER CONFIGURATION, AND EVERY NUMBER IS MEASURED. A single floor
        # has to be the weakest row's, which would stop the strong rows describing what they
        # actually do; a single 95 fails a row for a reason that is not about its testing.
        #
        # Windows is genuinely lower and it is not thinner testing: `/proc/meminfo` does not
        # exist there, POSIX permissions do not apply, and the code guarded on those is
        # unreachable. Measured 2026-09-11: 94.53%, against 95.73% on Linux with the same
        # dependencies. The floor sits just under the measurement, and is raised when the
        # measurement rises.
        #
        # Read these off the job logs. Two floors were wrong today because I measured one
        # configuration and wrote "the weakest" beside it.
        include:
          - {os: ubuntu-latest, python: "3.10", floor: "95"}
          - {os: ubuntu-latest, python: "3.12", floor: "95"}
          - {os: ubuntu-latest, python: "3.14", floor: "95"}
          - {os: windows-latest, python: "3.12", floor: "94.4"}
          - {os: macos-latest, python: "3.12", floor: "95"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: GNU coreutils, on macOS only
        # `tools/e2_arms.sh` runs every step under `timeout`, which is GNU coreutils and is not on
        # a macOS runner. Installed rather than skipped, because the two tests it gates assert
        # that a failed arm does not exit 0 and that a failing doctor does not block the run, and
        # those are exactly the properties this project keeps finding broken.
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Install torch (CPU build)
        # The CPU wheel is a fraction of the CUDA one and the suite never touches
        # a GPU: every test runs against hand-built fixtures, no model downloads.
        # One line for all three platforms: the CPU index carries manylinux,
        # win_amd64 and macosx arm64 wheels for every Python this matrix uses.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install the package and its dev extra
        # From the published extras rather than a bespoke list, so a broken
        # dependency declaration fails here instead of failing a user.
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ tools/

      - name: Fetch the artefacts this row's tests need
        # ONE row, and the reason is not coverage. 61 tests skip on every runner because the
        # corpora blob and the vendored llama.cpp binaries are built at release time and are
        # not in the tree. A skipped test covers nothing and, worse, gates nothing: `convert`,
        # `quantise`, `imatrix` and the bundled-corpus paths have never once been exercised by
        # CI, so a regression in them is invisible here and shows up in a release.
        #
        # That asymmetry is this project's most repeated failure shape. It is written down as
        # "my machine has artefacts CI does not", and it turned CI red twice on 2026-09-11
        # alone. This step closes it on the row that also reports coverage.
        #
        # It stays on ONE row deliberately. The other four, plus `pinned` and
        # `dependency-floor`, keep running with no network at all, so "the suite runs without a
        # network" is still proved on every commit by the rows that prove it today.
        #
        # Both fetches are hash-pinned: `vendor_llama.py` verifies against the sha256 recorded
        # in `vendor/pins.json` and refuses a mismatch, and `build_corpora.py` reads files at
        # pinned commits through `gh`. Neither accepts a hash typed by a human.
        #
        # It fails loud on purpose. A step that shrugged off a failed fetch would put the row
        # back to skipping the same 61 tests while reporting green, which is the exact defect
        # being fixed.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/vendor_llama.py
          python tools/build_corpora.py

      - name: Test, with the coverage gate
        # The floor comes from this row's matrix entry, where the measurement that justifies it
        # is written down. `pyproject.toml` still carries fail_under = 95, which is what a bare
        # `pytest` meets locally and what four of these five rows meet here.
        run: pytest --cov-report=xml --cov-fail-under=${{ matrix.floor }}

      - name: Publish coverage to Codecov
        # ONE matrix row uploads, not five. Five uploads of the same suite measured on five
        # environments would be merged by Codecov into a union, and a union of "Linux skipped the
        # Windows branch" and "Windows skipped the Linux branch" reports coverage nobody has.
        # This row is the one whose figure the badge quotes.
        #
        # The badge this feeds shows what CI measured, which is the figure a stranger cloning
        # the repository can reproduce. That is the point of wiring it at all.
        #
        # TWO MEASURES, AND THEY ARE NOT IN CONFLICT. Read this before concluding one is wrong:
        #
        #     96.25  coverage.py on this row, which is what the `pytest` step gates on.
        #            branch = true, so branches are in the denominator:
        #            (statements hit + branches taken) / (statements + branches).
        #     95.09  what Codecov shows, and therefore what the badge says. Codecov reads the
        #            Cobertura XML and reports LINE coverage, counting partially-taken branches
        #            as a separate `partials` bucket rather than blending them in.
        #
        # So the badge sits about a point below the gate for a reason that has nothing
        # to do with this repository: the two tools answer slightly different questions. Do not
        # "fix" the gap by changing the gate.
        #
        # `fail_ci_if_error` stays false deliberately. The coverage GATE is `--cov-fail-under`
        # in the step above and it is unchanged; this step only reports. An outage at a third
        # party must not turn this repository's build red, and a silent gap in the badge is
        # visible on its own.
        #
        # Pinned by commit SHA per baseline section 5, and this action earns the rule more than
        # most: Codecov's bash uploader was compromised in 2021 and shipped credential
        # exfiltration to everyone who curled it at a tag.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: The tests badge states the real number
        # The other half of the same problem Codecov solves for coverage. `tests-3166` was typed
        # by hand and was 35 short by the time anyone looked. One matrix row, because the count
        # is the same on all of them: a skipped test is still a collected test.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/check_tests_badge.py

      - name: The checker, run on this project's own published evidence
        # DOGFOODING THE ACTION'S OWN COMMAND, on the row that already has the artefacts.
        #
        # Running the published action here would be circular: it installs from PyPI, so it
        # would test the last release rather than this commit. This runs the same command the
        # action runs, against the thirty-one committed head-to-head arms, so a change that
        # makes the checker fire on our own evidence fails here rather than in somebody's CI.
        #
        # Exit 0 is required. A finding means either a published artefact has the defect, and
        # the figure needs re-examining, or a check is wrong and would have fired on a
        # stranger's file too. Both are worth stopping for.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m senbonzakura check head-to-head/results/

      - name: No committed prompts or generations
        # The hard gate. .gitignore stops an accidental `git add .`; it does nothing
        # about `git add -f`, a path that matches no pattern, or a file moved into a
        # tracked directory. This reads what is actually in the tree, and it runs on
        # every matrix row because it costs milliseconds.
        run: python tools/check_prompt_artefacts.py .

  pinned:
    # The counterpart to `test`. That job floats every version, which is how an
    # upstream release that breaks us gets noticed early; this one holds the
    # environment still, so when a run goes red it is possible to tell "our
    # change broke it" from "something upstream shifted under us".
    #
    # Python is 3.14 and not a matrix, because constraints/ci.txt was resolved on
    # 3.14: pandas 3.0.5 and numpy 2.5.1 have no 3.10 wheels, so the same pins on
    # an older interpreter cannot resolve at all.
    name: pinned environment (python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history, in exactly one job. The AGPL 5(a) date check compares the notice against
          # the last commit that touched the file carrying the copied code, and in a shallow clone
          # every file's last commit is the tip, so the check silently becomes "is the notice dated
          # today". It skips on a shallow clone now, and this is where it runs for real.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the pinned environment
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -e ".[dev]" -c constraints/ci.txt
      - name: Lint
        run: ruff check src/ tests/ tools/
      - name: Test, with the coverage gate
        run: pytest

  dependency-floor:
    # Installs the *lowest* version each declared dependency permits. Without this
    # the declared floors are decoration: a clean resolve always picks the newest
    # release and satisfies any floor, however wrong. This is the job that would
    # have caught `torch>=2.2` against a MIN_TORCH of 2.5.
    #
    # The floors come from constraints/floors.txt rather than from pyproject
    # alone, because pip has no lowest-version resolution mode: `>=4.56` is
    # satisfied by the newest release, so without the `==` pins this job would
    # install the same versions as `test` and prove nothing about any floor
    # except torch's.
    name: declared floors resolve and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install at the declared minimums
        # torch is pinned here rather than in floors.txt because its CPU wheels
        # are not on PyPI and its floor varies by Python version. 2.5.1 is the
        # earliest patch of the declared 2.5 floor that the July environment
        # record names, so it is the one worth holding the line at.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -e ".[dev]" -c constraints/floors.txt --upgrade-strategy only-if-needed
      - name: The tool starts and reports its version
        run: |
          python -c "import senbonzakura, torch; print(senbonzakura.__version__, torch.__version__)"
          senbonzakura --help > /dev/null
      - name: Test
        # THE ONE JOB WITH ITS OWN FLOOR, and the number is measured rather than chosen.
        #
        # It installs the LOWEST version every declared dependency permits, on Python 3.10, and
        # an older library takes different branches: code guarded on a newer API is unreachable,
        # and code that only runs on the old path is reached here and nowhere else. Measured on
        # this configuration on 2026-09-11: 94.71%, against 95.73% on the same commit with
        # current dependencies.
        #
        # That difference is a property of the dependency set, not thinner testing, so gating it
        # at 95 would fail a job for succeeding at its actual purpose. 94.5 is set just under the
        # measured figure, the same way the old global floor was.
        #
        # I removed the global floor earlier today on the strength of a Linux measurement with
        # current dependencies and called it "the weakest configuration". It was not: this job is
        # weaker, and CI said so within the hour. The lesson is the project's own and I walked
        # past it: a claim about the weakest case has to be measured on every case, not on the
        # one nearest to hand.
        run: pytest --cov-fail-under=94.5

  checker:
    # THE TORCH-FREE DISTRIBUTION, RESOLVED FOR REAL (decision Q-29).
    #
    # The suite asserts the property two ways already: a test walks `senbonzakura_check`'s import
    # graph and fails on anything heavy, and `test_torch_free.py` runs the command with the stack
    # made unimportable. Neither of those is an INSTALL. A dependency can be declared in
    # `checker/pyproject.toml` and reach a user without any import in our tree changing, and that
    # user is the one person who never appears in the rest of this file: somebody who typed
    # `pip install senbonzakura-check` and nothing else.
    #
    # So this job builds the wheel, installs it into an environment with nothing in it, and reads
    # back what pip actually resolved. It is the only check here that would catch a dependency
    # arriving through packaging rather than through code.
    name: the checker installs with nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"          # the declared floor, not a convenient version
      - name: Build the checker wheel
        run: |
          pip install --quiet build
          python -m build --wheel --outdir dist-checker checker/
      - name: Install it, and nothing else
        # Deliberately NOT --no-deps. The point is to let pip resolve whatever the metadata asks
        # for, so a dependency that crept into `checker/pyproject.toml` actually arrives here.
        run: pip install --quiet dist-checker/*.whl
      - name: Nothing heavy came with it
        run: |
          set -euo pipefail
          python - <<'PYCHECK'
          import importlib.metadata as md
          heavy = {"torch", "transformers", "accelerate", "optuna", "datasets",
                   "bitsandbytes", "sentencepiece", "gguf", "numpy", "pyarrow",
                   "senbonzakura"}
          installed = {d.metadata["Name"].lower().replace("_", "-")
                       for d in md.distributions() if d.metadata["Name"]}
          found = sorted(h for h in heavy if h in installed)
          assert not found, f"the torch-free distribution pulled in: {found}"
          print(f"resolved to {len(installed)} distribution(s), none of them heavy")
          PYCHECK
      - name: And it works
        # An install that resolves to nothing and then cannot run is not the property wanted.
        # The exit code is 1 on purpose: a metric with no estimator is a finding, so a 0 here
        # would mean the checks did not load, which is the failure a wheel without its data has.
        run: |
          set -euo pipefail
          cat > /tmp/arm.json <<'JSON'
          {"version": 2, "status": "success", "eval": {"task": "t", "model": "m"},
           "results": {"total_samples": 4, "completed_samples": 4,
                       "scores": [{"name": "s", "scorer": null, "scored_samples": 4,
                                   "metrics": {"accuracy": {"name": "accuracy", "value": 0.5}}}]}}
          JSON
          senbonzakura-check /tmp/arm.json && { echo "expected a finding, got a clean run"; exit 1; }
          test $? -eq 1
          senbonzakura-check /tmp/arm.json | grep -q "metric-reported-without-its-estimator"

  docs:
    # The documentation site, built and link-checked on every change.
    #
    # It is a separate job on purpose. npm lives in docs/ and nowhere else: the Python package is
    # built from src/ and cannot see this tree, so a node_modules cannot reach a wheel. Keeping
    # the boundary visible in the job list is half the point of it.
    #
    # Per hephaestus ADR 75 this build MUST fail on a broken link. VitePress exits non-zero on a
    # dead internal link, so no extra checker is needed; `ignoreDeadLinks` is deliberately unset
    # in the config, and a build that only warns is a build nobody reads the output of.
    name: Docs build and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install, from the lockfile only
        # `npm ci` refuses to run if package.json and the lockfile disagree, which is the
        # property that makes a committed lockfile worth having (baseline section 5).
        working-directory: docs
        run: npm ci
      - name: Build, which fails on a dead link
        working-directory: docs
        run: npm run build
      - name: Every documentation link in the README resolves to a built page
        # The build checks links between pages of the site. This checks the links pointing INTO
        # it from the README, which is the direction a reader arrives from and the direction that
        # was broken: the site was never deployed at all and all eleven of them returned 404,
        # here and on the PyPI project page, while this job stayed green.
        #
        # It runs on `dev` as well as on the publish path so a page rename is caught where it
        # lands rather than on the release that publishes it.
        run: python3 tools/readme_links_resolve.py docs/.vitepress/dist
      - name: Nothing from the docs tree reached the package
        # A guard rather than a comment. If npm ever installs into the repository root, or a
        # docs dependency finds its way under src/, the wheel would carry it.
        run: |
          test ! -d node_modules || { echo "node_modules at the repository root"; exit 1; }
          test ! -d src/node_modules || { echo "node_modules inside the package"; exit 1; }
          ! git ls-files | grep -q '^docs/node_modules' || { echo "node_modules is tracked"; exit 1; }

  wheel:
    # The wheel is what a stranger actually installs, and every other job runs in a
    # checkout that already has the vendored binaries, the corpora sources and the dev
    # dependencies on disk. This is the only job that asks what someone with none of
    # that receives.
    #
    # THE NEGATIVE CONTROL IS THE POINT. Building a wheel and checking it passes proves
    # nothing about the check: a gate only ever seen agreeing has not been shown to
    # work. So the job also constructs a wheel it knows is wrong and requires the same
    # check to refuse it. That is the discipline this project arrived at the hard way,
    # after a check shipped that passed a tree with the bug reinstated.
    name: the wheel describes itself honestly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist-ci
      - name: The tag and the contents agree
        run: python tools/check_wheel.py dist-ci/*.whl
      - name: The source distribution carries nothing platform-specific
        run: |
          python -m build --sdist --outdir dist-ci
          python tools/check_wheel.py dist-ci/*.tar.gz

      - name: A deliberately wrong sdist is refused
        # The same argument as the mislabelled wheel below: a gate only ever seen passing has
        # not been shown to work.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/pkg/src/senbonzakura/vendor/bin/linux-x86_64"
          echo x > "$work/pkg/src/senbonzakura/vendor/bin/linux-x86_64/libggml-base.so"
          tar czf "$work/bad.tar.gz" -C "$work" pkg
          python tools/check_wheel.py "$work/bad.tar.gz" --expect-failure

      - name: A deliberately mislabelled wheel is refused
        # Renaming a platform wheel to the universal tag produces the one combination
        # that installs on machines it cannot run on. If this step passes, the check
        # above is decoration.
        run: |
          set -euo pipefail
          orig="$(ls dist-ci/*.whl)"
          case "$orig" in
            *-py3-none-any.whl)
              # Nothing was vendored, so invent the opposite lie: a platform tag with
              # no platform payload to justify it.
              bad="dist-ci/mislabelled-0.0.0-py3-none-linux_x86_64.whl" ;;
            *)
              bad="dist-ci/mislabelled-0.0.0-py3-none-any.whl" ;;
          esac
          cp "$orig" "$bad"
          python tools/check_wheel.py "$bad" --expect-failure
      - name: The wheel installs and runs where nothing else exists
        # It builds its own wheel into dist-cleanroom/ rather than taking a path, and
        # runs two containers: one with a network to install, one with `--network none`
        # to check. A single container with the network left on would prove nothing
        # about whether the corpora are really bundled.
        run: bash tools/clean_room.sh

  images:
    # Both published images, built and then asked what they can do. `doctor` is the
    # right question because it answers "does this WORK" rather than "is this present",
    # and a container that imports cleanly and cannot run the quantiser is exactly the
    # failure it was written for: that happened twice inside python:3.13-slim, where
    # the binary was correct and libgomp1 was missing.
    name: both container images can do what they claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the CPU image
        run: docker build -f Dockerfile -t senbonzakura:ci-cpu .
      - name: The CPU image runs the quantiser
        # Not `doctor` exiting 0: it exits 1 on warnings, and a CPU image legitimately
        # warns about having no card. The claim under test is narrower and is read from
        # the check line itself.
        run: |
          set -euo pipefail
          docker run --rm senbonzakura:ci-cpu doctor > cpu.txt 2>&1 || true
          cat cpu.txt
          grep -qE '^\s*✓\s+llama-quantize' cpu.txt
          grep -qE '^\s*✓\s+architecture modules' cpu.txt
          # THE BUNDLED DATA, AND WHY THIS ASKS THE OPPOSITE QUESTION ON A RUNNER.
          #
          # An image that ships without the blobs looks identical from outside: it builds,
          # imports, answers --help, and fails --track default for every user. So this used to
          # assert they were present. The comment above it said, correctly, that Docker's context
          # ignores .gitignore and an image built where the blobs exist works while the same build
          # from a clone does not, and the check was written anyway. A runner is always the second
          # case, so the assertion could never hold here and the job had been red since August.
          #
          # A release image is built where the blobs are, and `check_wheel --release` plus the
          # clean room already gate that. What a runner can prove is the property that must hold
          # for the image it CAN build: that the absence is legible rather than silent. An image
          # that quietly returned rows from somewhere, or reported a pass with no corpora, is the
          # failure worth catching, and this catches it.
          grep -qE '^\s*✗\s+corpus advbench' cpu.txt
          grep -q 'build_corpora.py' cpu.txt
          # WHATEVER THE IMAGE CARRIES, IT MUST BE HONEST ABOUT IT. A runner builds without the
          # blobs and a release build has them, so this asserts the property that matches what is
          # actually there: corpora present must load at their declared size, corpora absent must
          # REFUSE and name the builder. Asserting only one of those is how this job came to hold
          # an assertion a runner could never satisfy.
          #
          # `--entrypoint python` IS LOAD-BEARING. The image's ENTRYPOINT is `senbonzakura`, so
          # `docker run <image> python foo.py` hands `python foo.py` to the CLI's argument parser
          # as positional arguments rather than running python at all. That is what happened here:
          # the step printed a `usage:` block and exited 2, and every grep above it had passed.
          docker run --rm -v "$PWD/tools:/check:ro" --entrypoint python senbonzakura:ci-cpu /check/image_is_honest.py
          docker run --rm --entrypoint python senbonzakura:ci-cpu -c "import pathlib, senbonzakura; hits = list(pathlib.Path(senbonzakura.__file__).resolve().parents[2].rglob('THIRD-PARTY-CORPORA.md')); assert hits, 'the image carries no THIRD-PARTY-CORPORA.md'; print('attribution present at', hits[0])"
      - name: Build the CUDA image
        run: docker build -f Dockerfile.cuda -t senbonzakura:ci-cuda .
      - name: The CUDA image carries a CUDA torch
        # There is no card on a GitHub runner, so this cannot test that CUDA WORKS. It
        # tests the thing that is actually easy to get wrong and impossible to notice:
        # that the image shipped a CPU torch while calling itself the CUDA image.
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python senbonzakura:ci-cuda -c "
          import torch
          print('torch', torch.__version__)
          assert '+cu' in torch.__version__, f'the CUDA image carries {torch.__version__}, which is not a CUDA build'
          "

  smoke:
    # THE JOB THAT ACTUALLY DOES THE THING.
    #
    # Everything above this runs unit tests, checks packaging, or builds documentation.
    # Not one of them abliterates a model. On 2026-09-10 that was measured: 3048 tests
    # across three operating systems and three interpreters, and the product itself had
    # been exercised by nothing except hand-run jobs on one laptop. A suite that green
    # lights every commit without once doing the job is measuring the parts.
    #
    # It does not need a GPU. SmolLM2-135M-Instruct against the toy track committed in
    # `examples/toy-track` runs a genuine two-trial search, bakes the winner and saves a
    # real model in about 25 seconds of CPU, and the whole chain below finishes in
    # roughly a minute.
    #
    # WHY IT ASSERTS REFUSALS TOO. Three stages require the tool to say NO: `kageyoshi`
    # on a track too small for its own auto budget, and the guided mode both without a
    # terminal and with one. A tool that cannot refuse is a tool whose approvals mean
    # nothing, and the guided mode's 48 unit tests all fake `isatty`, so the pty stage
    # is the only place a real terminal is ever used.
    name: it can actually abliterate a model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU build)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install the package
        # Plain install, no extras: since the editor's dependencies became base
        # dependencies this is what a user gets, and the smoke should exercise that
        # rather than a developer environment.
        run: pip install -e .

      - name: Abliterate a model, measure it, and drive the guided mode
        # The script asserts on the markers each command prints when it has done the
        # work, not on exit codes. Five benchmark jobs once reported success having
        # measured nothing, because success was printed unconditionally.
        run: python tools/smoke_end_to_end.py

      - name: The artefacts it produced are readable
        # A separate step so a failure here is distinguishable from a failure in the
        # run: the model existing and the model being loadable are different claims.
        run: |
          set -euo pipefail
          ls -la "${RUNNER_TEMP}/smoke/model"
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "smoke"
          for name in ("score.json", "compass.json", "drift.json"):
              doc = json.loads((out / name).read_text(encoding="utf-8"))
              assert doc, f"{name} is empty"
              print(f"  {name}: {len(doc)} keys")
          card = (out / "CARD.md").read_text(encoding="utf-8")
          assert "NOT MEASURED" in card or "Capability" in card, "the card lost its sections"
          print(f"  CARD.md: {len(card.splitlines())} lines")
          PY
