# Author:  Daniel Iwugo
# Comment: Christ is King
name: Publish

# Uploads to PyPI with trusted publishing (OIDC), so there is no long-lived API
# token on anyone's laptop, in a repository secret, or in a shell history. GitHub
# mints a short-lived identity for this workflow in this repository, and PyPI
# accepts it only for the publisher it was told to expect.
#
# Actions are pinned by commit SHA, not by tag (baseline §5): a tag can be moved
# to point at different code, and a compromised action runs with the workflow's
# token. The version comment after each SHA is for humans; the SHA is the pin.
#
# WHY THIS EXISTS. The 0.3.0 release was published from a laptop, and nothing in
# the repository records how, by whom, or from which commit. It also shipped
# without the AGPL section 5(a) statement of modification, which is the kind of
# thing a gate catches and a person doing it by hand does not.
#
# WHY IT DOES NOT BUILD THE WHEEL, which is the part that surprises anyone
# reading this expecting an ordinary publish workflow.
#
# The wheel ships an evaluation track. The repository does not, deliberately:
# `.gitignore` excludes it because a corpus of harmful prompts committed to a
# public repository is in its history permanently and no later commit takes it
# back out. `tools/packaging/pack_track.py` builds the blob from a track the operator holds
# on their own machine. So a runner that has only this repository CANNOT produce
# a release wheel, and making it able to would mean putting those prompts into
# GitHub, which is the decision the exclusion exists to prevent.
#
# So the artefacts are built where the track lives and attached to a GitHub
# Release, and this workflow verifies and uploads them. The wheel is going to a
# public index either way, so attaching it to the release discloses nothing new.
# See RELEASING.md for the local half.

on:
  release:
    types: [published]
  # Manual, for a re-run after a failed upload, or to rehearse against TestPyPI.
  # It takes the release tag rather than reading the ref, so a dispatch cannot
  # quietly publish something other than the release it names.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose attached artefacts to publish (e.g. v0.4.0)"
        required: true
        type: string
      repository:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  check:
    name: check the attached artefacts
    runs-on: ubuntu-latest
    steps:
      # Pinned to the release tag, so the checks run against the source the
      # artefacts claim to come from rather than against whatever is on a branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the artefacts attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir dist
          ls -l dist

      # THE GATE, and it runs before anything leaves the runner. It refuses a
      # wheel missing its licence files, its corpora or its templates, and one
      # carrying the build machine's bytecode. A release that cannot pass this is
      # not a release. It reads the wheel, so it needs none of the corpus sources.
      # Scoped to the platform and universal wheels by name. It used to glob `dist/*.whl`, which
      # was right while there was one distribution and would now drag the checker through a gate
      # that asks for corpora, templates and licence files it deliberately does not carry.
      - name: Check the wheel describes itself honestly
        run: |
          python -m pip install --upgrade pip
          shopt -s nullglob
          found=0
          for f in dist/senbonzakura-*.whl; do
            python tools/ci/check_wheel.py "$f" --release
            found=1
          done
          # A release that attached no senbonzakura wheel would otherwise pass this step having
          # checked nothing, which is the same arithmetic that let `senbonzakura check` report a
          # clean sweep over zero applicable checks.
          [ "$found" = 1 ] || { echo "::error::no senbonzakura wheel was attached to this release"; exit 1; }

      # The sdist is a separate question with a separate answer. `setup.py` refuses to let a
      # WHEEL carrying Linux binaries claim py3-none-any; nothing asked the same of the source
      # distribution, and this job uploads dist/* after checking dist/*.whl alone. On 2026-09-10
      # the sdist held 33 entries under vendor/bin/linux-x86_64, about 19 MB, inside an artefact
      # that has no platform tag by construction.
      - name: Check the source distribution carries nothing platform-specific
        run: |
          shopt -s nullglob
          for f in dist/*.tar.gz; do python tools/ci/check_wheel.py "$f"; done

      - name: Check the metadata renders
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # The version in the artefacts must be the version the tag names. A wheel
      # built from an uncommitted tree is the failure this catches: it uploads
      # under a version number whose source nobody can find afterwards.
      # THE CHECKER IS A SECOND DISTRIBUTION AND THIS STEP USED TO REFUSE IT.
      #
      # `senbonzakura-check` ships from `checker/` as its own torch-free package, and the platform
      # wheel declares `Requires-Dist: senbonzakura-check`. It had never been published, and this
      # is why: the pattern below named one distribution, so any file called
      # `senbonzakura_check-0.4.0-py3-none-any.whl` failed the check and the release stopped. The
      # missing piece was never a credential. There was no route.
      #
      # Found on 2026-09-17 by a plain `pip install` of the platform wheel, which fails with
      # "No matching distribution found for senbonzakura-check" on any machine that does not
      # already have both wheels sitting side by side. That is every machine except ours.
      #
      # Both projects must have a trusted publisher configured on PyPI pointing at THIS workflow
      # in THIS repository. For a name that does not exist yet, that is a PENDING publisher, which
      # PyPI supports precisely so a first upload need not come from a token on a laptop.
      - name: Check the artefacts match the tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          for f in dist/*; do
            case "$(basename "$f")" in
              senbonzakura-"$expected"-*|senbonzakura-"$expected".tar.gz) ;;
              senbonzakura_check-"$expected"-*|senbonzakura_check-"$expected".tar.gz) ;;
              *) echo "::error::$f is not version $expected, which is what $TAG names"; exit 1 ;;
            esac
          done

      # The platform wheel and the checker are checked by different questions. The release check
      # asks for the corpora, the templates and the licence files, and the checker carries none of
      # them by design: its whole pitch is that it installs in seconds with nothing. Running the
      # release gate over it would either fail honestly or force the gate to be loosened for both,
      # and loosening it for both is how the 0.3.0 wheel shipped with no corpora.
      - name: Check the checker declares what the platform wheel depends on
        run: |
          shopt -s nullglob
          for f in dist/senbonzakura_check-*.whl; do
            python -m pip install --upgrade twine >/dev/null
            python -m twine check "$f"
            echo "checked $f"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: upload to ${{ inputs.repository || 'pypi' }}
    needs: check
    runs-on: ubuntu-latest
    # A protected environment, so an upload waits for a human even when the
    # workflow started on its own. Uploading is irreversible: a filename on PyPI
    # can never be reused, and a version number can never be replayed.
    environment:
      name: ${{ inputs.repository || 'pypi' }}
    permissions:
      # The whole point. This is what lets PyPI verify the run rather than verify
      # a secret, and it is scoped to this job alone.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Named in full both ways rather than leaving one to the action's
          # default, so a misreading of the expression cannot upload to the real
          # index when TestPyPI was asked for.
          repository-url: >-
            ${{ inputs.repository == 'testpypi'
                && 'https://test.pypi.org/legacy/'
                || 'https://upload.pypi.org/legacy/' }}
          print-hash: true
