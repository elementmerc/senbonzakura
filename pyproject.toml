[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senbonzakura"
# ONE SOURCE OF TRUTH. This used to be a literal here AND a literal in
# `src/senbonzakura/_version.py`, with nothing checking they agreed, so the wheel's metadata
# version and the version the tool prints about itself could drift silently. The panel found the
# tree still saying 0.3.0 across 344 commits that included withdrawn measurements and a rewritten
# search, which made two very different trees indistinguishable in every artefact they produced.
dynamic = ["version"]
description = "Precision abliteration, with receipts. Multi-direction refusal abliteration for transformer language models."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
# THIRD-PARTY-NOTICES.md carries the AGPL section 5(a) statement of modification: this work
# includes code from Heretic and is not Heretic. Listing it here is what puts it INSIDE the
# wheel. The 0.3.0 release on PyPI shipped LICENSE alone, so the statement existed in the
# repository and was absent from the artefact anyone actually installs, which is the only place
# section 5(a) asks for it.
# THIRD-PARTY-CORPORA.md is here because the corpora it documents SHIP IN THE WHEEL, and
# MIT and CC-BY both require the attribution to travel with the work. It was generated at
# build time into the repository and left out of the artefact, so a user installing the
# package received 520 MIT rows and 250 CC-BY rows with the attribution present nowhere
# they could see it. `corpora.notice()` now prints it at load and points here.
# APACHE-2.0.txt is here because Apache-2.0 section 4(a) requires the licence text itself to
# travel with the work, and the bundled evaluation track carries an Apache-2.0 component.
# Documenting the obligation in docs/ did not satisfy it: docs/ does not ship.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "THIRD-PARTY-CORPORA.md",
                 "APACHE-2.0.txt"]
authors = [{ name = "Daniel Iwugo" }]
keywords = ["abliteration", "refusal-direction", "interpretability", "ai-safety", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  # Declared because CI runs on all three, not because the code looks portable.
  # Before 2026-07-30 there were no OS classifiers at all, which PyPI presents as
  # OS-independent: a claim nothing had ever tested. macOS means arm64; the CPU
  # index's newest x86_64 torch is 2.2.2, below this project's 2.5 floor.
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  # `datasets` USED TO BE HERE and is now the `hub` extra below. It is the heaviest thing in
  # this tree, Debian does not package it in stable, testing or unstable, and it was carrying
  # a single job: reading and writing a one-column table. `senbonzakura/trackio.py` does that
  # job on pyarrow, which Debian does package, and the on-disk format is unchanged in both
  # directions. Reading a Hub dataset id still needs `datasets`, and says so when asked to.
  #
  # 14 is the floor because it is the release that removed `pyarrow.PyExtensionType`, and
  # every pyarrow this project has ever run against is newer. Nothing here uses an API added
  # since 8, so the floor is about the ecosystem around it rather than about our own calls.
  "pyarrow>=14",
  # THE EDITOR, in the base install since 2026-09-10 (Q-27). These were the base dependencies until
  # 2026-09-08, moved out to the `abliterate` extra under Q-3 so a checker could install
  # torch-free, and moved back because the split served the wrong reader: somebody who types
  # `pip install senbonzakura` wants to abliterate a model, and a skeleton that then asks them to
  # work out which extra they needed is a worse first five minutes than a large download.
  #
  # THE TORCH-FREE CAPABILITY IS NOT WITHDRAWN, only the default. `tests/test_torch_free.py` still
  # runs the checking commands with every one of these made unimportable, so the property Q-3
  # actually wanted, that a Debian package or a verifier can be built with neither CUDA nor
  # `datasets`, is still measured on every commit. What changed is what a bare `pip install`
  # resolves to.
  #
  # pip CANNOT pick the right torch here: there is no environment marker for a GPU, a wheel runs no
  # code at install time, and PyPI forbids depending on PyTorch's own index. So the default is the
  # platform's wheel, which is CUDA on Linux and CPU-ONLY on Windows, and `senbonzakura setup`
  # corrects it on the machine it is run on.
  # The code refuses to start below 2.5 (crashsafe.MIN_TORCH): transformers' MoE
  # path imports torch.distributed.tensor.DTensor. Declaring 2.2 let `pip install`
  # succeed into an environment the tool then rejects.
  #
  # The floors above 3.12 are wheel availability, not a code requirement: 2.5 has
  # no cp313 wheels and the first build with cp314 is 2.9 (checked against PyPI,
  # 2026-07-29). Declaring a floor nothing can install is the same class of
  # mistake as declaring one the code rejects, just further from the user.
  "torch>=2.5; python_version < '3.13'",
  "torch>=2.6; python_version == '3.13'",
  "torch>=2.9; python_version >= '3.14'",
  "transformers>=4.56",
  "accelerate>=0.26",
  # 3.0 predates SQLAlchemy 2.0 and its RDBStorage trips an internal assertion against
  # it ("assert version is not None"), which took out 17 tests in the floors job.
  # 3.1 is the first release that works with SQLAlchemy 2.x, verified directly.
  "optuna>=4.0",
  # Needed by the vendored `convert_hf_to_gguf.py`, whose first real statement is `import gguf`.
  # A 0.11 MB pure-Python `py3-none-any` wheel, and its four dependencies (numpy, pyyaml,
  # requests, tqdm) all arrive anyway via torch, transformers and datasets, so this adds a tenth
  # of a megabyte and nothing transitive.
  #
  # KEPT AS A FALLBACK ONLY, and the reasoning that first put it here was wrong. It said the 0.19
  # floor pinned us to "the gguf-py that ships inside the pinned llama.cpp build", inferred from
  # libggml's soname being 0.19.0. Measured on 2026-08-18: PyPI gguf 0.19.0 and llama.cpp b10355's
  # own gguf-py BOTH declare 0.19.0 and are DIFFERENT CODE. The PyPI one is missing constants the
  # pinned converter uses, so `conversion/lfm2.py` raised on import and both LFM2 targets were
  # unconvertible while still being advertised as supported.
  #
  # No version constraint can express the difference, because the two share a version number. The
  # fix is that `gguf-py/gguf/` is vendored from the same tag and the upstream entry point puts it
  # first on the path, so the converter and its library are consistent by construction. This
  # dependency now only matters if the vendored package is absent.
  "gguf>=0.19",
  # Required by the vendored converter's vocabulary path, which several architectures reach,
  # including both of the families this tool is currently pointed at: llama.cpp's own
  # requirements-convert_legacy_llama.txt lists it, and a conversion without it dies at
  # `from sentencepiece import SentencePieceProcessor` after the weights have been read.
  #
  # The upper bound is upstream's own (`>=0.1.98,<0.3.0`). 0.2.2 was 37 days old when adopted, so
  # it clears the 7-day cooldown comfortably (baseline Section 5, checked against PyPI upload
  # dates rather than assumed). A 1.2 MB compiled wheel.
  #
  # `protobuf`, which upstream lists beside it, is deliberately NOT here: the conversion path was
  # run end to end without it and does not need it. Upstream's constraint is also `<5.0.0` while
  # PyPI is at 7.x, so adopting it would have meant carrying a pin nobody had shown was necessary.
  "sentencepiece>=0.1.98,<0.3.0",
]

[project.optional-dependencies]

# THE EDITOR. Everything needed to abliterate a model, convert it and quantise it.
#
# These were the base dependencies until 2026-09-08. They are most of a gigabyte and they
# expect a GPU, and the largest single thing standing between this tool and the people who
# would use it was that a plain `pip install` bought all of it whether or not you were going
# to edit a model. Checking somebody else's published claim needs none of it: a track, its
# audit, its contamination report and the installation check are text files, JSON and
# arithmetic, and `tests/test_torch_free.py` runs them with every one of these made
# unimportable, so this is a measured boundary rather than an intended one.
#
# BREAKING for anyone installed from 0.3.0: `senbonzakura abliterate` now needs this extra.
# The refusal names the exact command rather than leaving it to be worked out.
# KEPT, AND NOW AN ALIAS. Everything it used to bring is in the base install. The name appears in
# 0.3.x-era documentation, in this project's own error messages and in whatever people have already
# written down, and an extra that stops existing turns all of those into "senbonzakura has no extra
# named abliterate" for no gain. It resolves to the package itself and keeps working.
abliterate = ["senbonzakura"]
# 4-bit loading for the head-to-head bench and low-VRAM runs.
quant = ["bitsandbytes>=0.43"]
# Shell completion. Optional because cli.py degrades gracefully without it; it is
# in `dev` as well so the developer and CI parser surface stays identical, which
# the argument-namespace fixture depends on.
completion = ["shtab>=1.6"]
# Reading a dataset straight off the HuggingFace Hub by its `owner/name` id, and reading the
# few local shapes `trackio` declines to guess at (a DatasetDict, a formatted set). Local
# tracks, the bundled corpora and every file format the tool accepts work without it.
#
# 2.15 is the first release that does not call `pyarrow.PyExtensionType`, which pyarrow
# removed in 14. The old 2.0 floor resolved cleanly and then died at import, which is
# precisely what the dependency-floor CI job exists to catch, and did, on its first ever run.
hub = ["datasets>=2.15"]
# `datasets` is in `dev` because the test suite asserts BOTH backends read and write the same
# bytes, and a suite that can only exercise the backend it happens to have installed is how a
# fallback path rots into something nobody has ever run.
dev = ["senbonzakura[abliterate,hub,completion]", "pytest>=7", "pytest-cov>=4",
       "build>=1.0", "ruff==0.16.0",
       # `tomllib` is stdlib from 3.11 and this project supports 3.10, where the suite could not
       # be collected at all. Test-only, and only on the versions that lack it, so nothing a user
       # installs grows because of it.
       'tomli>=2.0; python_version < "3.11"']
# Everything. For anyone who does not want to think about which half they need.
all = ["senbonzakura[abliterate,hub,quant,completion]"]

[project.urls]
Homepage = "https://github.com/elementmerc/senbonzakura"
Repository = "https://github.com/elementmerc/senbonzakura"
Issues = "https://github.com/elementmerc/senbonzakura/issues"

[project.scripts]
# `senbonzakura --help` after `pip install .`  (also works: `python -m senbonzakura`)
senbonzakura = "senbonzakura.entry:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
# `_version.py` imports nothing, deliberately, so reading it costs no dependencies here and
# `doctor` can still answer on a machine where torch is exactly what is missing.
version = {attr = "senbonzakura._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# The bundled evaluation track. Without this the wheel installs the code and no corpus, and
# `--track default` fails on an installed package while working in a source checkout, which is
# the worst shape of bug: it only appears for users.
[tool.setuptools.package-data]
# `data/*.bin` is the packed evaluation track and the packed corpora. `vendor/*.json` is the pin
# manifests, and they are READ AT RUNTIME: `vendoring.load_manifest()` opens
# `vendor/pins.json` to answer what this install ships and how old the pins are. Without them the
# wheel installs, imports, and raises the moment anything asks about a vendored artefact, which is
# the worst shape of bug because it only appears for users. Caught by unzipping a built wheel
# rather than by reasoning about the glob.
# `vendor/bin/**` and `vendor/src/**` are here so a PLATFORM wheel can carry the llama.cpp
# binaries and the pinned converter. They are absent from a normal checkout until
# `tools/vendor_llama.py` runs, so a build with nothing vendored still produces a universal wheel
# with no binaries in it; `setup.py` makes the tag follow the contents, so the two cannot
# disagree. A `py3-none-any` wheel holding a Linux executable is the state this arrangement makes
# impossible to build.
# `vendor/src/**/*` swept `__pycache__` as well, so the published platform wheel carried 93
# `.pyc` files compiled on one developer's Python 3.14: 2 MB of stale bytecode shipped to
# strangers, and two builds of the same source were not byte-identical. Named by extension
# instead. The vendored tree is 103 `.py` files, a LICENSE and a `py.typed`, and each of
# those is listed rather than swept, so a new kind of file has to be added deliberately.
senbonzakura = ["data/*.bin", "data/templates/*.jinja", "vendor/*.json", "vendor/bin/*/*",
                "vendor/src/**/*.py", "vendor/src/**/LICENSE", "vendor/src/**/py.typed",
                # MIT asks for the notice in "all copies or substantial portions". The
                # vendored SOURCE tree carried it and the 35 MB of ggml/llama.cpp object
                # code beside it did not, which is the one omission an auditor can check
                # in ten seconds. `vendor/bin/*/*` already sweeps this directory; it is
                # named here so a reader can see the obligation being met on purpose.
                "vendor/bin/*/LICENSE"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/senbonzakura.1"]

[tool.ruff]
# 88 would flag 787 lines in a codebase whose median line is 56 characters and
# whose p99 is 115: the long ones are weight-surgery expressions with a trailing
# explanation, and breaking them reads worse. 120 keeps the rule meaningful.
line-length = 120

[tool.ruff.lint]
# Everything, then subtract with a reason. Selecting a handful of families means
# the rules that catch real defects are the ones nobody thought to enable: the
# leaked file handle in the crash-recovery path was found by SIM115, which is not
# in ruff's defaults.
select = ["ALL"]
ignore = [
  # Deliberate, permanent.
  "N806", "N803",  # non-lowercase names: W, Wf, Wn, Xc, Vh, H, NL are the maths
  "D1",       # missing docstrings: shape-documenting docstrings are going on the
              # surgery functions specifically; a blanket requirement produces noise
  "COM812",   # trailing-comma rules that fight a formatter
  "ISC001",
  "TD002", "TD003", "FIX002",  # TODO authorship/issue-link rules; this repo tracks
                               # deferred work in DEFERRED.md, not in issue numbers
  "PLC0415", # imports inside functions are deliberate: torch and transformers cost
             # seconds to import and the CLI must be able to print --help without them
  "TRY003", "EM101", "EM102",  # long messages built at the raise site. Baseline §2.1
                               # wants errors a user can act on, which is the opposite
                               # of short exception strings and a lookup table
  "PTH",      # os.path to pathlib is a migration with no defect behind it
  "S603", "S607",  # subprocess calls with known-literal arguments (nvidia-smi)
  "FURB122",  # its fix turned an explicit write loop into a 136-character
              # f.writelines generator, breaking the line limit it was run under.
              # The loop is clearer in a module whose job is being auditable
  "E702",     # `basis = [gd, d0]; kept = [d0]`: paired assignments on one line are
              # a deliberate idiom in the surgery code, used consistently
  "T201",     # print() is how the scorers report results; they are CLI entry points
  "BLE001", "S110",  # the broad catches left are fail-open probes: /proc/meminfo with
             # a documented fallback, VRAM queries that return None, a warm-start
             # enqueue that logs its own exception. A hardware probe must never take
             # down a multi-hour run. NOTE: this does not bless the two genuinely
             # silent degradations (the SVD non-convergence path and the fake
             # chat-template fallback); those are wrong for the opposite reason, they
             # continue with a weaker result rather than failing open, and they are
             # scheduled in tranche 4
  "PLR2004", # comparison thresholds sit at their use site with the reasoning next to
             # them; hoisting them to named constants moves the explanation away from
             # the decision
  "FBT001", "FBT002", "FBT003",  # boolean flags in signatures mirror the CLI flags
                                 # one-for-one; renaming them would decouple the two
  "D205", "D401", "D213",  # docstring formatting: these are prose paragraphs, not
                           # one-line summaries with a body
  "D203",     # mutually exclusive with D211, which ALL also selects, so leaving both
              # on printed a config warning on every single ruff run. D211 (no blank
              # line before a class docstring) is the style the code already uses
  "PLW0108",  # explicit lambdas that name their argument read better than operator
  "EXE001",   # shebangs on modules that are also importable
  "N812",     # `import torch.nn.functional as F` is the universal torch convention
  "C408",     # dict(...) with keyword arguments reads as a record, not a literal
  "ARG001", "ARG005",  # Optuna callback signatures and no-op log sinks are fixed by
                       # their caller; the unused half is not ours to rename
  "SIM105",   # contextlib.suppress hides which line is allowed to fail
  "D400",     # docstring first lines that end in a colon introduce a list
  "PLR0913", "PLR0917",  # argument counts. Real, and being addressed structurally by
                         # the run() decomposition in tranche 3, not by suppression
  "C901", "PLR0912", "PLR0915", "PLR0911",  # cyclomatic complexity, same answer:
                         # run() is 237 lines and the fix is decomposition
  "SIM103",   # the multi-branch predicates carry a comment per branch; collapsing
              # them into one boolean expression would delete the explanations
  "RUF001", "RUF003",  # the curly apostrophe in metrics.py is DATA, not typography:
              # it is the character the verbatim Heretic normaliser folds to an
              # ASCII quote. "Fixing" it would silently change what the metric matches
  # Temporary. Type annotations are being adopted in one pass alongside the run()
  # decomposition (sprint decision D19); this comes off when that lands.
  "ANN",
]

[tool.ruff.lint.flake8-copyright]
# CPY001 was suppressed with a note saying the headers were "real and scheduled". They are now on
# every file, so the note is retired and the rule is on: a header that nothing enforces is one
# that quietly stops being applied to new files. `tools/add_license_headers.py --check` is the
# same assertion in a form CI and a pre-commit hook can run.
author = "Daniel Iwugo"
notice-rgx = "(?i)Copyright \\(C\\) \\d{4}"

[tool.ruff.lint.per-file-ignores]
# Only rules that are NOT in the global `ignore` above belong here. A per-file
# entry duplicating a global one is dead config that reads as a decision, and
# the wrong lesson gets drawn from it when the global entry is later lifted.
# The one deliberate exception is ANN, whose global ignore is temporary: it is
# repeated here so that lifting the global one does not silently start
# demanding annotations on fixtures.
"tests/*" = [
  "S101",     # assert is what a test is made of
  "SLF001",   # tests reach into private state deliberately
  "INP001",   # tests/ is not a package
  "ARG002",   # fake method signatures ignore their arguments
  "PT018",    # composite assertions read fine in a table-driven test
  "ANN",      # global ignore is temporary (D19); this one is not
  "S108",     # /tmp paths in tests are fixtures for "this path does not exist"
  "S311",     # random.Random(seed) is the scrambled-label control for the AUC statistic.
              # A cryptographic generator would make it unseedable, which is the one
              # property the test needs
  "RUF059",   # unused unpacking is how a test says "I only care about this half"
  "S105",     # "pad_token" / "eos_token" are tokeniser fields, not credentials
  "E741",     # `I` is the identity matrix
  "PT011", "PT013",  # pytest.raises breadth and import style in existing tests
  "N818",     # _FakeOOM is a test double for torch's OOM, named after what it fakes
]

# The validation experiments deliberately reuse the extractor's own maths helpers
# rather than reimplementing them. That is the whole point of them: a probe that
# re-derives the geometry measures the probe, which is exactly how a broken filter
# went unnoticed for the project's history. Scoped to the files that need it.
# `validate` is a sibling module reaching into `cli`'s module-private helpers, which
# is package-internal reuse rather than reaching across an API boundary.
"src/senbonzakura/validate.py" = ["SLF001"]
"tools/axis_probe.py" = ["SLF001"]

# The vendoring tool runs from a git checkout, where the package is not installed, so it must
# put `src/` on the path before it can import from it. E402 is describing that accurately and
# there is no arrangement of the file that both imports the package and satisfies it.
# S310 is the URL-scheme audit: every URL here is built from the committed pin manifest against
# a fixed https host, so the scheme cannot be influenced by anything a caller passes.
"tools/vendor_llama.py" = ["E402", "S310"]

# Same reason as above: these run from a checkout where the package is not installed, so `src/`
# has to reach the path before the import.
"tools/build_corpora.py" = ["E402"]

[tool.pytest.ini_options]
# Coverage runs on a bare `pytest`, so the gate is something you meet while working
# rather than something CI tells you about after you push.
# -W error::ResourceWarning is the gate for a leak the suite had for months: Optuna's
# sqlite storage kept a connection pool nobody disposed, and the 26 warnings it printed
# were noise that any genuinely new warning would have hidden in. It is affordable
# because, once fixed, this suite emits no warnings of any kind, so the setting costs
# nothing today and turns the next leak into a failure instead of more noise.
# -rs prints why every skipped test skipped. A skip is a test that did not run, and in a
# 963-dot stream it looks exactly like a test that did. Twenty-one of these were skipping on
# the CPU box for months because the route there strips `private/`, and the tests that guard
# the rehearsal spec were the ones being dropped. The reason has to be on the screen.
addopts = "--cov=senbonzakura --cov-branch --cov-report=term-missing -W error::ResourceWarning -rs"
# THE REPO ROOT ON sys.path, EXPLICITLY, because the two ways of starting pytest do not agree.
# `python -m pytest` puts the working directory on sys.path and the `pytest` console script does
# not. Several tests share fixtures with `from tests.test_abliterator import ...`, which therefore
# worked for anyone running the first form and failed with "No module named 'tests'" for anyone
# running the second. CI runs the second, and had been failing on it on every platform.
pythonpath = ["."]

[tool.coverage.run]
source = ["senbonzakura"]              # without this, a run measures whatever happened to import
branch = true
omit = ["*/senbonzakura/__main__.py"]   # a two-line `from .cli import main; main()` shim

[tool.coverage.report]
# A ratchet, not a target. Raised at each tranche close, so uncovered code is
# caught as it lands rather than in one reckoning at the end.
#   84  tranche 0: the suite went green
#   86  tranche 1: score.py's compass path and coherence.py's main()
#   92  tranche 2: margin.py, 0% to 100%, which took the total to 93.17%
# 92 rather than 93 leaves one point of room for the rest of tranche 2, which adds
# code to this same module. The operator's target was above 90 and that is met; the
# ratchet keeps going up at each tranche close, but it is never set above the
# measured figure, because a gate that is red on a clean checkout gets commented out.
fail_under = 95
exclude_also = [
  "if __name__ == .__main__.:",
  "pragma: no cover",
]
