# Author:  Daniel Iwugo
# Comment: Christ is King
name: "Senbonzakura check"
description: >-
  Read evaluation result files and report how the numbers could be wrong. Reads
  lm-evaluation-harness results, Inspect eval logs, and senbonzakura artefacts. No model, no
  GPU, no network.
author: "Daniel Iwugo"

branding:
  icon: "search"
  color: "purple"

# WHY THIS ACTION EXISTS, AND WHY IT SHIPS WITH THE CLI RATHER THAN AFTER IT
#
# `strategy-2026-08-02.md` tweak 4, and the v0.8 exit gate: CI is where a tool runs without
# anyone choosing to run it. Of the six properties shared by tools that took a domain in under
# two years, "runs constantly rather than occasionally" is the one this project most clearly
# failed, and it is the structural difference between Burp's decade and Ruff's eighteen months.
# A checker somebody remembers to run is a checker that runs occasionally.
#
# WHY IT INSTALLS `senbonzakura-check` AND NOT `senbonzakura`
#
# `pip install senbonzakura` brings torch, transformers, accelerate and optuna: most of a
# gigabyte, on every CI run, of a repository that only wants its result files read. An action
# that costs five minutes of install per run is an action nobody keeps, which would lose exactly
# the property it was added for.
#
# The checker imports nothing beyond the standard library. That is a measured claim, not a
# hoped-for one: `tests/test_torch_free.py` runs the checker in a subprocess with every heavy
# package made unimportable at the import-machinery level, and asserts it produces a finding and
# the right exit code rather than a traceback. A separate test walks the import graph of
# `senbonzakura/check/` and fails on anything reaching the deep-learning stack.
#
# THIS USED TO READ `pip install --no-deps senbonzakura`, AND THAT WAS BROKEN FROM THE DAY Q-29
# SHIPPED. The comment here named its own expiry: "Decision Q-29 ships a torch-free distribution
# of its own, at which point this becomes an ordinary install." Q-29 shipped, `senbonzakura-check`
# went to PyPI at 0.4.0, and nothing checked. `--no-deps` on the BIG distribution installs the
# `senbonzakura` launcher without the `senbonzakura_check` package it dispatches to, so
# `senbonzakura check` exited 1 saying it was not installed, and the step then reported success
# because the report it could not write parsed to an empty string rather than to a zero. Measured
# on 2026-09-28 by running the two commands, not by reading them.
#
# `senbonzakura-check` declares `dependencies = []`, so this is the ordinary install the comment
# above was waiting for and `--no-deps` is no longer load-bearing. It is deliberately NOT passed:
# a flag that suppresses dependency resolution is exactly what hid the previous break, and if this
# distribution ever gains a real dependency the honest outcome is that it gets installed.

inputs:
  path:
    description: "File or directory to check. Directories are searched for .json files."
    required: false
    default: "."
  version:
    description: >-
      Version specifier for the package, e.g. "==0.4.0". Pin it. An unpinned checker changes
      what your CI enforces without anything in your repository changing.
    required: false
    default: ""
  fail-on-findings:
    description: >-
      Fail the step when a check fires. Set false to report without blocking, which is the
      sensible first week on an existing repository.
    required: false
    default: "true"
  fail-on-empty:
    description: >-
      Fail the step when NOTHING was checked. Defaults false, because a repository that does not
      produce artefacts on every run is a normal thing and breaking it would make adoption worse.
      Set it true once the path is stable: a directory that exists and holds nothing produces zero
      findings and zero unchecked, which is arithmetically identical to a clean sweep, so a path
      that drifts reports green forever.
    required: false
    default: "false"
  fail-on-unchecked:
    description: >-
      Fail the step when a file could not be read at all. Left true on purpose: a file the
      checker cannot parse is reported UNCHECKED, never clean, and a gate that ignores that goes
      green on the day your result format changes under it.
    required: false
    default: "true"
  python-version:
    description: "Python to run on. 3.10 or newer."
    required: false
    default: "3.12"

outputs:
  checked:
    description: >-
      How many files were actually examined. Zero means nothing was checked, which is not the same
      as a clean result and is what a drifted path looks like.
    value: ${{ steps.run.outputs.checked }}
  findings:
    description: "How many checks fired."
    value: ${{ steps.run.outputs.findings }}
  unchecked:
    description: "How many files could not be read."
    value: ${{ steps.run.outputs.unchecked }}
  report:
    description: "Path to the JSON report."
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the checker, and nothing else
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet "senbonzakura-check${{ inputs.version }}"
        # THE INSTALL HAS TO PROVE ITSELF BEFORE THE REPORT IS TRUSTED. The previous break was a
        # package that installed cleanly and could not run the one command this action exists to
        # run, so "pip succeeded" is not the property worth asserting here. `--help` is used rather
        # than `--version`, which this command does not have: it exits 0 only if the entry point
        # resolved AND dispatched into `senbonzakura_check`, which is the half that was missing.
        senbonzakura-check --help > /dev/null

    - name: Check the artefacts
      id: run
      shell: bash
      run: |
        set -uo pipefail
        report="$RUNNER_TEMP/senbonzakura-check.json"
        senbonzakura-check "${{ inputs.path }}" --json > "$report" || true

        # Run again for the log. The two formats come from different branches of the command, so
        # a tee would show the reader JSON where they want the report, and rendering the report
        # from the JSON here would be a third formatter to keep in step with the other two.
        # Reading a handful of JSON files twice costs nothing.
        senbonzakura-check "${{ inputs.path }}" || true

        # THE REPORT IS READ ONCE, AND AN UNREADABLE ONE STOPS THE STEP.
        #
        # This used to be three `$(python -c ...)` substitutions whose failures were invisible.
        # `|| true` above swallows the command's exit code on purpose, because findings are a
        # normal non-zero outcome, so the report is the ONLY evidence the command ran at all. When
        # the command could not run, the report was empty, all three substitutions failed, and the
        # three variables held the empty string. Every gate below is an integer test, `[ "" -eq 0 ]`
        # errors rather than being false, and a failing test is a skipped branch, so all three
        # gates were jumped and the step reached `exit 0`. A broken install reported a clean run.
        #
        # So: one reader, its failure is fatal, and it emits the three counts on one line.
        #
        # `checked` IS THE CHECKER'S OWN `n_checked`, NOT AN APPROXIMATION OF IT. It used to be
        # `len(d)`, which counts every file the command looked at including the ones it could not
        # parse, so a directory holding nothing but unrecognised JSON reported `checked=1` while
        # the command itself printed "NOTHING WAS CHECKED". `fail-on-empty` could then never fire
        # for the exact case its own description names.
        #
        # The command computes `n_checked` as `not problem and applied`: a file that parsed AND
        # had at least one check run on it. `applied` is in the report as of this release, so this
        # is the same expression rather than a second definition that agrees most of the time.
        # Two definitions of one count is how the first version of this line went wrong.
        # A PINNED OLDER CHECKER HAS NO `applied` FIELD, and this says so rather than quietly
        # meaning something else. `version:` lets somebody pin 0.4.0 under a newer action, and a
        # count that silently changes definition with the pin is the kind of thing this whole
        # project exists to catch in other people's tooling.
        if ! counts=$(python -c "
        import json, sys
        with open(sys.argv[1]) as fh:
            d = json.load(fh)
        parsed = [e for e in d if not e['unchecked'] and not e['not_a_result']]
        if all('applied' in e for e in d):
            checked = sum(1 for e in parsed if e['applied'])
            note = ''
        else:
            checked = len(parsed)
            note = 'legacy'
        print(sum(len(e['findings']) for e in d),
              sum(1 for e in d if e['unchecked']),
              checked, note)
        " "$report"); then
          echo "::error::The checker produced no readable report at $report, so nothing about this run is known. This is a broken checker install or a crash, NOT a clean result."
          exit 1
        fi
        read -r findings unchecked checked note <<< "$counts"
        if [ "${note:-}" = "legacy" ]; then
          echo "::warning::The pinned checker predates the report's \`applied\` field, so \`checked\` counts files that PARSED rather than files a check actually ran on. A file whose checks were all skipped is counted here and is not counted by the checker itself. Unpin, or pin at or above the release that added the field, to make the two agree."
        fi
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "unchecked=$unchecked" >> "$GITHUB_OUTPUT"
        echo "checked=$checked" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"

        {
          echo "### Senbonzakura check"
          echo
          echo "$checked file(s) checked, $findings finding(s), $unchecked file(s) unchecked."
          echo
          echo "This looks for known failure modes. It cannot tell you a number is right."
        } >> "$GITHUB_STEP_SUMMARY"

        # THE EXIT CODE IS REBUILT FROM THE INPUTS rather than passed through, because the two
        # failure kinds are gated separately. `2` means a file could not be read, and that is
        # the one worth failing on even when findings are advisory: it is the outcome that makes
        # the rest of the report meaningless.
        if [ "$checked" -eq 0 ]; then
          echo "::warning::No result artefacts were found at '${{ inputs.path }}'. Nothing was checked, which is not the same as a clean result."
          if [ "${{ inputs.fail-on-empty }}" = "true" ]; then
            echo "::error::Nothing was checked and fail-on-empty is set. Check the path."
            exit 1
          fi
        fi
        if [ "$unchecked" -gt 0 ] && [ "${{ inputs.fail-on-unchecked }}" = "true" ]; then
          echo "::error::$unchecked file(s) could not be read. An unreadable artefact is reported unchecked, never clean."
          exit 1
        fi
        if [ "$findings" -gt 0 ] && [ "${{ inputs.fail-on-findings }}" = "true" ]; then
          echo "::error::$findings finding(s). See the step log for each one and what would make it wrong."
          exit 1
        fi
        exit 0
