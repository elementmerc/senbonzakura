[[job]]
id = "report"
name = "read the day together"
machine = "rog"
deps = ["transfer-gemma", "transfer-gemma-clusters", "score-gemma-long", "seed-42", "seed-43", "seed-45"]
timeout_secs = 900
success = { type = "stdout-contains", needle = "REPORT_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python

PYTHONPATH="$RUN/src" "$PY" - <<'EOF'
import glob, json, os, statistics, sys
sys.path.insert(0, os.path.expanduser("~/senbon-run/src"))
from senbonzakura.validate import matched_refusal_table

RUN = os.path.expanduser("~/senbon-run")


def load(p):
    try:
        with open(p, encoding="utf-8") as f:
            return json.load(f)
    except (OSError, ValueError):
        return None


print("\\n=== T: does the hook agree with the bake? ===")
for tag, name in (("RDO directions", "transfer-gemma"),
                  ("cluster directions (control)", "transfer-gemma-clusters")):
    r = load(f"{RUN}/gap/{name}.json")
    if not r or "transfer" not in r:
        print(f"  {tag}: MISSING"); continue
    t = r["transfer"]
    print(f"  {tag}: mean |delta| {t['mean_abs_delta']}, worst {t['max_abs_delta']}")
    print(f"     {t['reading']}.")
    m = r.get("projection_magnitude")
    if m:
        print(f"     magnitudes: {m['reading']}.")

print("\\n=== L: does 1000 steps beat 200? ===")
r = load(f"{RUN}/gap/score-gemma-long.json")
if not r or "e4" not in r:
    print("  MISSING")
else:
    e4 = r["e4"]
    if e4["degenerate_reason"]:
        print(f"  UNREADABLE: {e4['degenerate_reason']}")
    else:
        for band, entries in e4["matched_refusal"]["targets"].items():
            kls = {int(K): e["kl"] for K, e in entries.items()}
            best = min(kls, key=kls.get) if kls else None
            print(f"  {band}: " + "  ".join(f"K={K}:{v:.4f}" for K, v in sorted(kls.items()))
                  + (f"   -> cheapest K={best}" if best else ""))

print("\\n=== S: does the Qwen3 K=2 advantage hold across seeds? ===")
# Every seed in this table must define its band against the same thing. A run without the
# unablated anchor measures "percent removed" against its own weakest ablated arm, which is a
# different question wearing the same label, so it is dropped loudly rather than averaged in.
per_seed = {}
for p in sorted(glob.glob(f"{RUN}/gap/qwen3-seed*.json")):
    seed = os.path.basename(p).replace("qwen3-seed", "").replace(".json", "")
    r = load(p)
    if not r or "e4" not in r:
        continue
    rows = r["e4"]["rows"]
    t = matched_refusal_table(rows)
    if not t.get("baseline_is_unablated"):
        print(f"    seed {seed}: DROPPED, no unablated anchor, so its band is not comparable")
        continue
    band = t["targets"].get("50%_removed") or {}
    if band:
        per_seed[seed] = {int(K): e["kl"] for K, e in band.items()}

if not per_seed:
    print("  no seeds produced a usable band")
else:
    print("  KL at the 50%-removed band, by seed:")
    for seed in sorted(per_seed):
        kls = per_seed[seed]
        best = min(kls, key=kls.get)
        print(f"    seed {seed}: " + "  ".join(f"K={K}:{v:.3f}" for K, v in sorted(kls.items()))
              + f"   cheapest K={best}")
    winners = [min(k, key=k.get) for k in per_seed.values()]
    from collections import Counter
    tally = Counter(winners)
    print(f"\\n  cheapest K per seed: {dict(tally)} over {len(per_seed)} seeds")
    if len(per_seed) >= 3:
        k1 = [k.get(1) for k in per_seed.values() if k.get(1) is not None]
        k2 = [k.get(2) for k in per_seed.values() if k.get(2) is not None]
        if len(k1) >= 3 and len(k2) >= 3:
            print(f"  K=1 KL: mean {statistics.mean(k1):.3f} sd {statistics.pstdev(k1):.3f}")
            print(f"  K=2 KL: mean {statistics.mean(k2):.3f} sd {statistics.pstdev(k2):.3f}")
            print("  A K=2 advantage that survives five seeds is a finding. One that appears in "
                  "two of five is the single-seed result this project already withdrew once.")
EOF
echo REPORT_OK
"""
