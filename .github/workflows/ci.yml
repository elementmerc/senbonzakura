# Author:  Daniel Iwugo
# Comment: Christ is King
name: CI

# Actions are pinned by commit SHA, not by tag (baseline §5): a tag can be moved
# to point at different code, and a compromised action runs with the workflow's
# token. The version comment after each SHA is for humans; the SHA is the pin.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# ── Q-71, AND THE FLIP IS THE ONE LINE BELOW ───────────────────────────────────────────────────
#
# `--required` turns a dependency audit that could not reach the advisory service from a loud
# green into a red. It is off today because the only thing reading these conclusions is a person,
# who can see the warning annotation saying nothing was checked, and because a gate that goes red
# whenever pypi.org hiccups is a gate everybody learns to re-run rather than read.
#
# It has to go on the day required status checks land on `main` and `dev`, because a branch rule
# reads green as "verified" and cannot see an annotation. That is a settings change on the
# operator's GitHub account, so the sequence is: turn protection on, then change the `'false'`
# below to `'true'`.
#
# It is one line per workflow rather than one line overall, because GitHub gives workflows no way
# to share an `env` block. `.github/workflows/supply-chain.yml` carries the other one, named
# REQUIRE_EVERY_CHECK_TO_RUN, and both are listed in the ledger entry that carries this flip.
#
# AN EMPTY `env:` KEY IS NOT AN EMPTY MAPPING, IT IS NULL, and GitHub rejects the whole file: the
# run completes as a failure with ZERO jobs, which looks nothing like a normal red build. That has
# happened here. If this block's last key is ever removed, remove the `env:` line with it.
env:
  AUDIT_REQUIRED: 'false'

# THE RUNNER'S COVERAGE FLOOR IS NOW THE DEVELOPER'S FLOOR, and the separate number that used to
# live here is gone, along with the `env:` block that held it. A workflow with an `env:` key and
# nothing under it is not an empty mapping, it is null, and GitHub rejects the whole file: the
# run completes as a failure with ZERO jobs, which looks nothing like a normal red build. PyYAML
# parses it happily, so a local `yaml.safe_load` is not enough to catch it and did not.
#
# Keeping the history because the reason the floor existed was sound and the reason it stopped
# is the interesting part.
#
# It read 92.5, against pyproject's fail_under = 95, because a developer has the packed track,
# the packed corpora and the vendored binaries and a runner has none of them, so the tests that
# exercise that code skipped, and skipped tests cover nothing. Measured then:
#
#     everything present                   95.08%   <- developers and the release build
#     corpora and binaries, no track       94.58%
#     nothing, which is what a runner had  92.98%
#
# Two things closed that gap on 2026-09-11. The coverage row now fetches the corpora and the
# vendored binaries itself, which un-skips 61 tests that had never run on a runner at all; and
# roughly two hundred branches that executed only one way got their other side tested. Measured
# again, same tree, coverage.py's own blended figure:
#
#     coverage row, corpora and binaries   96.25%
#     every other row, no artefacts        95.73%   <- the weakest configuration
#
# The weakest runner now clears 95 with room, so the divergence has nothing left to describe.
# One number, in one place, and CI meets the gate a developer meets rather than a softer one
# that has to be kept honest by hand.
#
# If this has to come back, put the measurement beside it as above. A floor is the number the
# WEAKEST configuration must clear, and it is only worth having when that number is genuinely
# lower for a reason nobody can fix.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # TORCH'S OWN THREADING WAS COSTING THIS JOB THREE MINUTES, MEASURED.
    #
    # torch defaults its intra-op pool to the core count, and every model in this suite is tiny:
    # the thread coordination costs more than the arithmetic it divides. Emulating a runner by
    # pinning a 16-core box to 4 CPUs, the whole suite ran 16:09 with the default pool and 13:16
    # with one thread, identical at 5,643 passed and 54 skipped. The emulation is faithful rather
    # than assumed: the 16:09 matches the 15.9 minutes this job actually takes here.
    #
    # It is set per job rather than on the workflow, because that is where it was measured. The
    # smoke job runs a real abliteration and might well want the pool, and nothing has asked it.
    #
    # THE ONE THING TO KNOW IF A TEST EVER FAILS ONLY HERE: thread count changes the order of
    # floating-point reductions, so a number can move in the last bits. Nothing in this suite
    # noticed, across every row, but that is the mechanism to suspect first rather than last.
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    defaults:
      run:
        # bash on every runner, including Windows, so one `run:` line cannot mean
        # two different things. Windows runners ship Git Bash.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Python versions are swept on Linux: the ends of the supported range plus
        # one in the middle. The floors differ per version because torch's wheel
        # availability does: 2.5 has no cp313 build and the first with cp314 is 2.9,
        # which pyproject encodes.
        #
        # Windows and macOS get one representative version rather than the full
        # sweep. Three OSes times three versions is nine jobs to catch what one
        # version per platform catches, and what differs across platforms here is
        # the platform, not the interpreter: /proc/meminfo does not exist off Linux,
        # and an open file handle blocks deletion on Windows.
        #
        # macos-latest is arm64. Do not pin macos-13: the CPU index's newest x86_64
        # torch is 2.2.2, below this project's declared 2.5 floor, so an x86 runner
        # cannot install a supported torch at all.
        #
        # THE COVERAGE FLOOR IS PER CONFIGURATION, AND EVERY NUMBER IS MEASURED. A single floor
        # has to be the weakest row's, which would stop the strong rows describing what they
        # actually do; a single 95 fails a row for a reason that is not about its testing.
        #
        # Windows is genuinely lower and it is not thinner testing: `/proc/meminfo` does not
        # exist there, POSIX permissions do not apply, and the code guarded on those is
        # unreachable. Measured 2026-09-11: 94.53%, against 95.73% on Linux with the same
        # dependencies. The floor sits just under the measurement, and is raised when the
        # measurement rises.
        #
        # Read these off the job logs. Two floors were wrong today because I measured one
        # configuration and wrote "the weakest" beside it.
        include:
          # 3.10 and 3.14 DO NOT fetch the corpora and the vendored binaries; only 3.12 does, so
          # that the other rows keep proving the suite runs with no network at all. That makes
          # them a different measurement, and they carried 95 anyway. Measured on 2026-09-25 from
          # three green runs: 94.58% and 94.74% on 3.10, against 96.02% on the row that fetches.
          #
          # They were not failing, because `fail_under` compared a rounded total until `precision`
          # was set in pyproject.toml in the same change. They printed "FAIL Required test coverage
          # of 95% not reached" and concluded success, for at least three days.
          #
          # 94 is the measured figure rather than a nudge, following the same rule as the Windows
          # row below: never above what the configuration actually reports. The honest way to put
          # these back to 95 is to let them fetch the artefacts too, which costs the network-free
          # property they are here to prove.
          - {os: ubuntu-latest, python: "3.10", floor: "94"}
          - {os: ubuntu-latest, python: "3.12", floor: "95"}
          - {os: ubuntu-latest, python: "3.14", floor: "94"}
          # 94, from the measured figure rather than nudged: the 2026-09-11 run reported 94% on
          # this row against a floor of 94.4 and failed. coverage.py prints the total to whole
          # percent in its failure message, so the decimals are not in the log to set a tighter
          # number from; 94 is the floor the measurement actually supports. Raise it when a run
          # reports a figure with decimals to raise it to.
          - {os: windows-latest, python: "3.12", floor: "94"}
          # 94, for the same reason and from the same audit: this row reported 94.53% against a
          # floor of 95 on the last green run and concluded success on the rounding. It does not
          # fetch the artefacts either. Three of these five floors were unreachable and silent;
          # Windows was the only one already telling the truth, which is why it is unchanged.
          - {os: macos-latest, python: "3.12", floor: "94"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: GNU coreutils, on macOS only
        # `tools/research/e2_arms.sh` runs every step under `timeout`, which is GNU coreutils and is not on
        # a macOS runner. Installed rather than skipped, because the two tests it gates assert
        # that a failed arm does not exit 0 and that a failing doctor does not block the run, and
        # those are exactly the properties this project keeps finding broken.
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Install torch (CPU build)
        # The CPU wheel is a fraction of the CUDA one and the suite never touches
        # a GPU: every test runs against hand-built fixtures, no model downloads.
        # One line for all three platforms: the CPU index carries manylinux,
        # win_amd64 and macosx arm64 wheels for every Python this matrix uses.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install the package and its dev extra
        # From the published extras rather than a bespoke list, so a broken
        # dependency declaration fails here instead of failing a user.
        # THE CHECKER FIRST, AND IT HAS TO BE. `senbonzakura` depends on `senbonzakura-check`
        # by name (decision Q-29), and that name is not on PyPI yet, so a plain install cannot
        # resolve: "Could not find a version that satisfies the requirement senbonzakura-check".
        # Installing the local one first satisfies it from this tree.
        #
        # This is the interim state RELEASING.md's ordering note is about, met from the inside:
        # the small distribution is published FIRST at release time for exactly this reason, and
        # until it is published every install path needs the local copy.
        run: |
          pip install -e ./checker --no-deps
          pip install -e ".[dev]"

      # THE THIRD RESOLVED ENVIRONMENT: the free resolve, which floats every version to whatever
      # is newest today. The pinned job and the floors job bracket the declared range; this one
      # catches an advisory against a release newer than anything we pin, which neither of them
      # can see.
      #
      # One representative row, following this job's existing convention, because the advisory
      # set does not vary by platform and five rows would pay five times for one answer.
      #
      # It runs here rather than in a job of its own because a job of its own would have to
      # resolve this environment again, and that resolve is the expensive part: measured
      # 2026-10-01, `pip install --dry-run` over `.[dev]` did not finish in five minutes. This
      # row has already paid for it.
      - name: Dependency advisories, free resolve
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          # setuptools IS UPGRADED FIRST, and not for tidiness. This row audits a FREE resolve, so
          # it also audits whatever setuptools the runner image happens to ship, which nothing in
          # this repository pins or can pin: a constraints file cannot reach a package that is
          # already installed in the interpreter. On 2026-10-06 that was 78.1.0, carrying
          # CVE-2025-47273 and CVE-2026-59890, and the step failed on an advisory against a version
          # we neither chose nor ship.
          #
          # Upgrading it is the honest fix rather than ignoring the finding, because the advisory is
          # real and a user who installs into a fresh environment today gets a current setuptools.
          # What this row is for is catching an advisory against a release newer than anything we
          # pin; the image's build tooling is not that.
          pip install --upgrade "setuptools>=83.0.0"
          pip install pip-audit==2.10.1
          python tools/ci/audit_env.py --label "free resolve (no constraints, python 3.12)" --min-packages 40 --required "$AUDIT_REQUIRED"

      - name: Lint
        run: ruff check src/ tests/ tools/ checker/src/

      - name: Every shipped source file carries its licence header
        # WIRED 2026-09-28, having been written months earlier and run by nothing. pyproject.toml
        # points at this command as "the same assertion in a form CI and a pre-commit hook can
        # run", and no workflow, hook or release step invoked it. It was failing, too: the build
        # stamp `setup.py` writes into every wheel carried an SPDX line and no copyright line, so
        # the one file in the distribution with no notice was the generated one, in a project that
        # ships a tool to prevent exactly that.
        #
        # Cheap enough to run on every matrix row: it reads file heads and touches no dependency.
        run: python tools/packaging/add_license_headers.py --check

      - name: Fetch the artefacts this row's tests need
        # ONE row, and the reason is not coverage. 61 tests skip on every runner because the
        # corpora blob and the vendored llama.cpp binaries are built at release time and are
        # not in the tree. A skipped test covers nothing and, worse, gates nothing: `convert`,
        # `quantise`, `imatrix` and the bundled-corpus paths have never once been exercised by
        # CI, so a regression in them is invisible here and shows up in a release.
        #
        # That asymmetry is this project's most repeated failure shape. It is written down as
        # "my machine has artefacts CI does not", and it turned CI red twice on 2026-09-11
        # alone. This step closes it on the row that also reports coverage.
        #
        # It stays on ONE row deliberately. The other four, plus `pinned` and
        # `dependency-floor`, keep running with no network at all, so "the suite runs without a
        # network" is still proved on every commit by the rows that prove it today.
        #
        # Both fetches are hash-pinned: `vendor_llama.py` verifies against the sha256 recorded
        # in `vendor/pins.json` and refuses a mismatch, and `build_corpora.py` reads files at
        # pinned commits through `gh`. Neither accepts a hash typed by a human.
        #
        # It fails loud on purpose. A step that shrugged off a failed fetch would put the row
        # back to skipping the same 61 tests while reporting green, which is the exact defect
        # being fixed.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/packaging/vendor_llama.py
          python tools/packaging/build_corpora.py

      - name: Test, with the coverage gate
        # The floor comes from this row's matrix entry, where the measurement that justifies it
        # is written down. `pyproject.toml` still carries fail_under = 95, which is what a bare
        # `pytest` meets locally and what four of these five rows meet here.
        run: pytest -n 4 --cov-report=xml --cov-fail-under=${{ matrix.floor }}

      - name: Publish coverage to Codecov
        # ONE matrix row uploads, not five. Five uploads of the same suite measured on five
        # environments would be merged by Codecov into a union, and a union of "Linux skipped the
        # Windows branch" and "Windows skipped the Linux branch" reports coverage nobody has.
        # This row is the one whose figure the badge quotes.
        #
        # The badge this feeds shows what CI measured, which is the figure a stranger cloning
        # the repository can reproduce. That is the point of wiring it at all.
        #
        # TWO MEASURES, AND THEY ARE NOT IN CONFLICT. Read this before concluding one is wrong:
        #
        #     96.25  coverage.py on this row, which is what the `pytest` step gates on.
        #            branch = true, so branches are in the denominator:
        #            (statements hit + branches taken) / (statements + branches).
        #     95.09  what Codecov shows, and therefore what the badge says. Codecov reads the
        #            Cobertura XML and reports LINE coverage, counting partially-taken branches
        #            as a separate `partials` bucket rather than blending them in.
        #
        # So the badge sits about a point below the gate for a reason that has nothing
        # to do with this repository: the two tools answer slightly different questions. Do not
        # "fix" the gap by changing the gate.
        #
        # `fail_ci_if_error` stays false deliberately. The coverage GATE is `--cov-fail-under`
        # in the step above and it is unchanged; this step only reports. An outage at a third
        # party must not turn this repository's build red, and a silent gap in the badge is
        # visible on its own.
        #
        # Pinned by commit SHA per baseline section 5, and this action earns the rule more than
        # most: Codecov's bash uploader was compromised in 2021 and shipped credential
        # exfiltration to everyone who curled it at a tag.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Measure the tests badge, and correct it rather than failing on it
        # The other half of the same problem Codecov solves for coverage. `tests-3166` was typed
        # by hand and was 35 short by the time anyone looked. One matrix row, because the count
        # is the same on all of them: a skipped test is still a collected test.
        #
        # IT CORRECTS RATHER THAN REFUSES, since 2026-09-21. A hand-typed count goes stale the
        # moment anybody adds a test, so this failed the build twice in one day for something
        # nobody needed telling, and a red build everybody knows to ignore is what teaches people
        # to ignore the next real one. The measurement still happens here; only the verdict moved.
        #
        # THIS JOB DOES NOT COMMIT IT. This row has just installed torch, transformers and the
        # rest of the dependency tree, so it is the last place that should hold a token able to
        # write to the repository. It measures, and hands the result to a job that runs nothing.
        #
        # `always()` BECAUSE THE COUNT IS NOT A VERDICT. Two panel reviewers reached the same
        # finding on 2026-09-28: the badge was stale and the thing that corrects it is skipped
        # exactly when the suite is red, which is when a stale number is most likely to be
        # noticed and least likely to be fixed. What this measures is how many tests COLLECT,
        # and collection succeeds or fails on its own: a suite with ten failures collects
        # exactly as many tests as a green one. So nothing about this number depends on the
        # suite having passed, and gating it on that was a guess rather than a reason.
        # Collection breaking is a different matter and the script exits 2 on it, which fails
        # this step rather than writing a figure it could not measure.
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/ci/check_tests_badge.py --write

      - name: Hand the corrected badge to the job that can commit it
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tests-badge-readme
          path: README.md
          retention-days: 1

      - name: The checker, run on this project's own published evidence
        # DOGFOODING THE ACTION'S OWN COMMAND, on the row that already has the artefacts.
        #
        # Running the published action here would be circular: it installs from PyPI, so it
        # would test the last release rather than this commit. This runs the same command the
        # action runs, against the thirty-one committed head-to-head arms, so a change that
        # makes the checker fire on our own evidence fails here rather than in somebody's CI.
        #
        # Exit 0 is required. A finding means either a published artefact has the defect, and
        # the figure needs re-examining, or a check is wrong and would have fired on a
        # stranger's file too. Both are worth stopping for.
        #
        # `--min-applied 2` is what stops this being a step that cannot fail. Exit 0 alone only
        # proves the checker ran: an artefact counts as checked when ONE check applied to it, so
        # a rename that stopped fourteen of the fifteen recognising these files would leave this
        # step green and the numbers identical. Measured 2026-09-22 across the thirty arms: ten
        # get 2 checks, ten get 3, ten get 7, so 2 is the floor the evidence actually supports
        # rather than a number chosen to pass. A drop below it is drift in one of the two
        # directions that matter, and both deserve a red build: the artefacts stopped carrying
        # what the checks read, or the checks stopped recognising the artefacts.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m senbonzakura check head-to-head/results/ --min-applied 2

      - name: The resume guard, run against evidence whose configuration is known
        # WHY THIS STEP EXISTS, 2026-09-28. `artefact_ok.py` decides whether an arm on a rented box
        # has already finished, so a fault in it either re-runs a completed arm and spends GPU hours
        # again, or skips one that never ran. It was invoked from a provisioning script that lives
        # outside this repository, which means it was gated nowhere a clone could see: the guard that
        # checks `tools/ci` scripts are actually run read that local file and passed, and this job
        # failed on the same commit.
        #
        # So the invocation lives here, and it is a real check rather than a call made to satisfy a
        # test. The four keys are the configuration the 2026-09-10 drift arm is published under, so
        # this fails if the committed evidence stops carrying what it is quoted as, or if the dotted
        # path lookup stops resolving. Both would otherwise surface on a pod, unattended, as a
        # completed arm reading stale.
        run: |
          python tools/ci/artefact_ok.py head-to-head/results/2026-09-10/drift-heretic-seed42.json \
            label=heretic-seed42 n_prompts=200 batch=16 logits_dtype=bfloat16

      - name: No committed prompts or generations
        # The hard gate. .gitignore stops an accidental `git add .`; it does nothing
        # about `git add -f`, a path that matches no pattern, or a file moved into a
        # tracked directory. This reads what is actually in the tree, and it runs on
        # every matrix row because it costs milliseconds.
        run: python tools/ci/check_prompt_artefacts.py .

      - name: Public prose carries no writing tells
        # THE WHOLE TREE, not only the lines a commit added. The pre-commit hook scans staged
        # ADDITIONS to public docs, which is the right scope for a hook: it must not fail on text
        # that was already there. This runs the same patterns over every public doc on every push,
        # so a file nobody edited cannot drift and a pattern added to the list later is applied
        # retroactively rather than only to the next change.
        #
        # It also reaches what the hook's glob cannot. A bash `case` pattern of `docs/*.md` does
        # not match a slash, so `docs/guide/` and `docs/reference/` sit outside the hook's scope
        # entirely, and `docs/reference/flags.md` alone gained about ninety lines of prose on
        # 2026-10-08 that nothing scanned. Shell globbing here covers them without a second
        # fleetwide change to a hook every project carries.
        #
        # Measured before it was wired: 32 public docs, zero findings, so this starts green rather
        # than starting disabled. A gate that is red on a clean checkout gets commented out.
        #
        # THE PATTERN SOURCE IS NAMED HERE, and it has to be. The checker's default is the
        # pre-commit hook, which it parses rather than copying so the two cannot drift. That is
        # right on a developer's machine and impossible here: the hooks are kept out of this
        # repository on purpose, so a public checkout has no hook to read and the checker
        # correctly refused, which is what turned every test job red from 2026-10-09. The
        # generated export below is the copy, a test fails when it drifts from the hook, and
        # naming it in the command keeps CI from quietly reading a different list than it looks
        # like it reads.
        run: python tools/ci/check_prose_tells.py --hook tools/ci/prose-tells.sh README.md ACCEPTABLE-USE.md docs/*.md docs/guide/*.md docs/reference/*.md

      - name: Contributed probes keep their shape
        # `probes/` holds probes other people wrote and this project distributes, so a malformed
        # one reaches everybody who installs. The gate is mechanical and checks shape only: it
        # cannot tell whether the items measure what their author says. That is what the human
        # review in probes/README.md is for, and this step prints as much on success rather than
        # letting a green tick read as "somebody checked the contents".
        run: python tools/ci/check_probes.py

      - name: Every author of the pushed commits has agreed to the CLA
        # `CLA.md` clause 2 is the only thing that would ever allow this code to be offered under
        # terms other than the AGPL, and that permission can only come from whoever wrote each
        # contribution. Asking later is the part that fails: people change jobs and addresses, and
        # a contributor who cannot be found cannot be asked, so one unagreed commit closes the
        # option for the code it touched for good.
        #
        # `CONTRIBUTING.md` already asks for the line. This makes it a gate rather than an honour
        # system, which is the difference between "we had a CLA" and a record somebody can audit.
        # It proves a line exists in a file, which is evidence and not a signature; CLA.md says on
        # its own first line that it has not been reviewed by a solicitor.
        #
        # The range is deliberately the push, not the history: a full-history check would fail
        # forever on the first unagreed commit rather than stopping the next one.
        # The two values come through `env` rather than `${{ }}` inside the script. Interpolating
        # an expression into a run block makes whatever it holds into shell, and the habit is the
        # defect rather than any one field: these two are commit ids, but the same line written
        # next to a branch name or a PR title is a remote shell.
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          else
            RANGE="$(git rev-list --max-parents=0 "$HEAD_SHA" | head -1)..${HEAD_SHA}"
          fi
          echo "checking $RANGE"
          python tools/ci/check_cla_assent.py --range "$RANGE"

  tests-badge:
    # THE ONLY JOB IN THIS WORKFLOW THAT CAN WRITE TO THE REPOSITORY, and it is deliberately the
    # one that runs nothing. It installs no dependencies, executes no project code and no
    # third-party action beyond checkout and download, so the token it holds is never in the same
    # process as anything a compromised package could reach. Baseline section 5 is the reason:
    # the defence against a hostile dependency is that when one turns, it reaches nothing worth
    # having.
    #
    # It exists because the badge check used to fail the build over a number nobody had retyped.
    # The measurement happens in `test`, which has the suite; the commit happens here, which has
    # the permission. Neither job has both.
    needs: test
    runs-on: ubuntu-latest
    # Only on a push to our own branches. A pull request from a fork must never reach a job with
    # write access, and `github.event_name` is what separates them.
    #
    # AND ONLY ON `dev`, which is a branch-shape constraint rather than a security one.
    #
    # `main` moves forward only as a fast-forward from `dev`. This job pushed to whatever branch
    # triggered it, so the v0.4.0 promotion was immediately followed by a badge commit on `main`
    # alone, and `main` stopped being reachable from `dev`: the next promotion was no longer a
    # fast-forward, and the branch workflow forbids the force-push that would "fix" it. It also
    # pushes to `origin` only, so the same commit left the two remotes' `main` branches holding
    # different trees.
    #
    # Measured 2026-09-26, one promotion after the job was written. The badge is cosmetic and it
    # reaches `main` at the next promotion like everything else does, so confining it to `dev`
    # costs nothing and keeps both invariants: `main` is always a fast-forward of `dev`, and every
    # remote holds the same `main`.
    #
    # `always()` AND NOT `needs: test` ALONE. `needs` skips this job when any matrix row fails, so
    # the one job that keeps the badge honest stood down on exactly the days the badge was most
    # likely to be wrong, which is the half of the finding two reviewers reached independently on
    # 2026-09-28. The number is a COLLECTION count and not a verdict, and the step that produces
    # it says why that makes the suite's result irrelevant to it. `cancelled()` is still a stop:
    # a cancelled run proves nothing and may not have reached the measurement at all.
    #
    # Nothing about the blast radius changes. This job still installs nothing, runs no project
    # code, and the step below still refuses to commit a diff that touches anything but the badge
    # line, so the worst a red run can hand it is a number it then checks.
    if: >-
      always() && !cancelled()
      && github.event_name == 'push' && github.repository == 'elementmerc/senbonzakura'
      && github.ref_name == 'dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        # NOT A FAILURE WHEN IT IS ABSENT, and it is absent for a readable reason: `test` can go
        # red before it reaches the measurement, for instance on a failed install, and then there
        # is no count to commit. Failing here would add a second red job to a run that is already
        # red and would say nothing new. The step below reports the absence in words rather than
        # letting it look like a badge that was already correct.
        continue-on-error: true
        with:
          name: tests-badge-readme
          path: badge

      - name: Commit the corrected badge, or say why it did not
        run: |
          set -euo pipefail
          if [ ! -f badge/README.md ]; then
            echo "no measured badge was handed over, so there is nothing to correct."
            echo "the test job did not reach the measurement step; this is not a badge failure."
            exit 0
          fi
          if cmp -s badge/README.md README.md; then
            echo "tests badge already correct; nothing to commit"
            exit 0
          fi
          cp badge/README.md README.md
          # The diff is checked rather than trusted. This job holds a write token, so the one
          # thing it must never do is commit whatever an earlier job handed it: if anything but
          # the badge number changed, that is not a badge correction and it stops here.
          if ! git diff --unified=0 -- README.md | grep -qE '^[-+].*img\.shields\.io/badge/tests-'; then
            echo "the handed-over README differs somewhere other than the tests badge:"
            git diff --stat -- README.md
            git checkout -- README.md
            exit 1
          fi
          if [ "$(git diff --numstat -- README.md | awk '{print $1+$2}')" != "2" ]; then
            echo "expected exactly one changed line in README.md, got:"
            git diff --numstat -- README.md
            git checkout -- README.md
            exit 1
          fi
          git config user.name  "senbonzakura-ci"
          git config user.email "ops@themalwarefiles.com"
          # `[skip ci]` because the tree this describes has just been tested by the run that
          # measured it. Re-running the whole matrix to confirm a four-digit number in a README
          # would double CI on every test somebody adds, which is the cost this change exists to
          # remove.
          git commit -m "chore(readme): the tests badge states the measured count [skip ci]" -- README.md
          # A race with a human push is expected and is not a failure. The badge is cosmetic and
          # self-correcting: whatever lands next measures again. Failing the build here would put
          # back exactly the noise this job was built to remove.
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "badge committed"
          else
            echo "could not push the badge update, most likely a race with another push."
            echo "this is not a failure: the next run measures again and corrects it."
          fi

  pinned:
    # The counterpart to `test`. That job floats every version, which is how an
    # upstream release that breaks us gets noticed early; this one holds the
    # environment still, so when a run goes red it is possible to tell "our
    # change broke it" from "something upstream shifted under us".
    #
    # Python is 3.14 and not a matrix, because constraints/ci.txt was resolved on
    # 3.14: pandas 3.0.5 and numpy 2.5.1 have no 3.10 wheels, so the same pins on
    # an older interpreter cannot resolve at all.
    name: pinned environment (python 3.14)
    runs-on: ubuntu-latest
    # TORCH'S OWN THREADING WAS COSTING THIS JOB THREE MINUTES, MEASURED.
    #
    # torch defaults its intra-op pool to the core count, and every model in this suite is tiny:
    # the thread coordination costs more than the arithmetic it divides. Emulating a runner by
    # pinning a 16-core box to 4 CPUs, the whole suite ran 16:09 with the default pool and 13:16
    # with one thread, identical at 5,643 passed and 54 skipped. The emulation is faithful rather
    # than assumed: the 16:09 matches the 15.9 minutes this job actually takes here.
    #
    # It is set per job rather than on the workflow, because that is where it was measured. The
    # smoke job runs a real abliteration and might well want the pool, and nothing has asked it.
    #
    # THE ONE THING TO KNOW IF A TEST EVER FAILS ONLY HERE: thread count changes the order of
    # floating-point reductions, so a number can move in the last bits. Nothing in this suite
    # noticed, across every row, but that is the mechanism to suspect first rather than last.
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history, in exactly one job. The AGPL 5(a) date check compares the notice against
          # the last commit that touched the file carrying the copied code, and in a shallow clone
          # every file's last commit is the tip, so the check silently becomes "is the notice dated
          # today". It skips on a shallow clone now, and this is where it runs for real.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the pinned environment
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -e ./checker --no-deps
          pip install -e ".[dev]" -c constraints/ci.txt

      # ONE OF THE THREE RESOLVED ENVIRONMENTS THIS PROJECT SHIPS AGAINST, audited here rather
      # than in a job of its own. A separate job would have to rebuild this environment, and
      # rebuilding it from constraints/ci.txt does not work: that file pins `torch==2.13.0+cpu`,
      # a local version segment that exists on the PyTorch CPU index and not on PyPI, so the
      # resolve fails outright. Measured 2026-10-01. The environment already exists here, built
      # correctly, so the audit costs the advisory lookup and nothing else.
      #
      # The floor is what stops a subset audit reading as clean. See tools/ci/audit_env.py.
      - name: Dependency advisories, pinned environment
        run: |
          pip install pip-audit==2.10.1
          python tools/ci/audit_env.py --label "pinned (constraints/ci.txt, python 3.14)" --min-packages 60 --required "$AUDIT_REQUIRED"
      - name: Lint
        run: ruff check src/ tests/ tools/ checker/src/
      - name: Every shipped source file carries its licence header
        run: python tools/packaging/add_license_headers.py --check
      - name: Test, with the coverage gate
        # THE FLOOR IS EXPLICIT HERE FOR THE SAME REASON IT IS IN THE MATRIX ROWS.
        #
        # A bare `pytest` takes `fail_under = 95` from pyproject.toml, which is the figure a
        # developer meets with the packed track, the corpora and the vendored binaries all
        # present. This job fetches none of them, so the tests that exercise that code skip, and
        # skipped tests cover nothing: measured 94.42% on 2026-09-25.
        #
        # It was failing on that and had been. It went unnoticed while `fail_under` compared a
        # rounded total, because 94.42 rounds to 94 and the comparison was against 95, so this
        # one failed honestly all along while three matrix rows passed on the rounding. Setting
        # `precision` in pyproject.toml fixed the rounding; this line fixes the floor.
        #
        # 94, from the measurement, never above it. The honest route back to 95 is to fetch the
        # artefacts here too, which costs this job the no-network property it exists to prove.
        run: pytest -n 4 --cov-fail-under=94

  dependency-floor:
    # Installs the *lowest* version each declared dependency permits. Without this
    # the declared floors are decoration: a clean resolve always picks the newest
    # release and satisfies any floor, however wrong. This is the job that would
    # have caught `torch>=2.2` against a MIN_TORCH of 2.5.
    #
    # The floors come from constraints/floors.txt rather than from pyproject
    # alone, because pip has no lowest-version resolution mode: `>=4.56` is
    # satisfied by the newest release, so without the `==` pins this job would
    # install the same versions as `test` and prove nothing about any floor
    # except torch's.
    name: declared floors resolve and run
    runs-on: ubuntu-latest
    # TORCH'S OWN THREADING WAS COSTING THIS JOB THREE MINUTES, MEASURED.
    #
    # torch defaults its intra-op pool to the core count, and every model in this suite is tiny:
    # the thread coordination costs more than the arithmetic it divides. Emulating a runner by
    # pinning a 16-core box to 4 CPUs, the whole suite ran 16:09 with the default pool and 13:16
    # with one thread, identical at 5,643 passed and 54 skipped. The emulation is faithful rather
    # than assumed: the 16:09 matches the 15.9 minutes this job actually takes here.
    #
    # It is set per job rather than on the workflow, because that is where it was measured. The
    # smoke job runs a real abliteration and might well want the pool, and nothing has asked it.
    #
    # THE ONE THING TO KNOW IF A TEST EVER FAILS ONLY HERE: thread count changes the order of
    # floating-point reductions, so a number can move in the last bits. Nothing in this suite
    # noticed, across every row, but that is the mechanism to suspect first rather than last.
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install at the declared minimums
        # torch is pinned here rather than in floors.txt because its CPU wheels
        # are not on PyPI and its floor varies by Python version. It tracks the
        # declared floor in pyproject.toml and nothing else: raised to 2.7.0 on
        # 2026-10-07 with that floor, because transformers 5.x declares torch>=2.5
        # and then uses a dtype PyTorch added in 2.7.0.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0
          pip install -e ./checker --no-deps
          pip install -e ".[dev]" -c constraints/floors.txt --upgrade-strategy only-if-needed

      # THIS IS THE AUDIT THAT JUSTIFIES AUDITING IN CI AT ALL, and the finding it produced on
      # its first run has since been fixed rather than allowlisted. Checked against OSV on
      # 2026-10-01:
      #
      #     datasets==2.15.0  PYSEC-2026-3716   <- the declared floor until that day
      #     datasets==4.0.0   PYSEC-2026-3716
      #     datasets==5.0.1   clean             <- the floor since, and what every job resolves
      #
      # A path traversal in folder-based builders, live across the whole declared range below 5.
      # The exposure was INVISIBLE to the pre-push gate, which audits the pushing machine's
      # environment, and invisible to the pinned job, because both see 5.0.1. This job was the
      # only place the declared floor was ever installed, so it was the only place that could
      # see it, and it did. The `hub` extra now declares `datasets>=5.0.1` (Q-72).
      #
      # Python 3.10 here is load-bearing for a second reason: a cp310 wheel has to exist for
      # every pin in floors.txt, or pip falls back to building from source. That bit once
      # already, with `pyarrow==14` on 3.14, and it is why every pin in that file is exact rather
      # than "whatever is newest". The pyarrow pin is 23.0.1 since 2026-10-06, raised for
      # PYSEC-2026-113 and still above the `pyarrow>=21.0.0` that datasets 5.0.1 forces; its cp310
      # wheel was checked against PyPI rather than assumed.
      - name: Dependency advisories, declared floors
        run: |
          # setuptools is upgraded first for the same reason as the free-resolve row above: it is
          # the runner image's build tooling, not a declared dependency of this project, and
          # `constraints/floors.txt` cannot reach a package already installed in the interpreter.
          # It was 79.0.1 here on 2026-10-06, carrying CVE-2026-59890. It is deliberately NOT
          # pinned in the floors file, because that file tests DECLARED dependency floors and
          # setuptools is a `[build-system]` requirement; `test_declared_floors.py` refuses a pin
          # that nothing declares, and it was right to.
          pip install --upgrade "setuptools>=83.0.0"
          pip install pip-audit==2.10.1
          python tools/ci/audit_env.py --label "declared floors (constraints/floors.txt, python 3.10)" --min-packages 40 --required "$AUDIT_REQUIRED"
      - name: The tool starts and reports its version
        run: |
          python -c "import senbonzakura, torch; print(senbonzakura.__version__, torch.__version__)"
          senbonzakura --help > /dev/null
      - name: Test
        # THE ONE JOB WITH ITS OWN FLOOR, and the number is measured rather than chosen.
        #
        # It installs the LOWEST version every declared dependency permits, on Python 3.10, and
        # an older library takes different branches: code guarded on a newer API is unreachable,
        # and code that only runs on the old path is reached here and nowhere else. Measured on
        # this configuration on 2026-09-11: 94.71%, against 95.73% on the same commit with
        # current dependencies.
        #
        # That difference is a property of the dependency set, not thinner testing, so gating it
        # at 95 would fail a job for succeeding at its actual purpose. 94.5 is set just under the
        # measured figure, the same way the old global floor was.
        #
        # I removed the global floor earlier today on the strength of a Linux measurement with
        # current dependencies and called it "the weakest configuration". It was not: this job is
        # weaker, and CI said so within the hour. The lesson is the project's own and I walked
        # past it: a claim about the weakest case has to be measured on every case, not on the
        # one nearest to hand.
        run: pytest -n 4 --cov-fail-under=94.5

  archive:
    # THE SUITE FROM A TREE THAT IS NOT A GIT CHECKOUT.
    #
    # Every other job here runs in a clone, so anything that shells out to git gets an answer.
    # An sdist, a vendored copy and a distribution package are none of them a checkout, and a
    # test that reads `git ls-files` there gets EMPTY OUTPUT and a non-zero status, which is
    # indistinguishable from "the file is not tracked" unless somebody thought about it.
    #
    # Four tests have already been fixed for reporting on their environment this way, and
    # nothing stopped the next one: on 2026-09-12 a fifth was found by hand elsewhere, because
    # this configuration had no job. It does now.
    name: the suite runs outside a git checkout
    runs-on: ubuntu-latest
    # TORCH'S OWN THREADING WAS COSTING THIS JOB THREE MINUTES, MEASURED.
    #
    # torch defaults its intra-op pool to the core count, and every model in this suite is tiny:
    # the thread coordination costs more than the arithmetic it divides. Emulating a runner by
    # pinning a 16-core box to 4 CPUs, the whole suite ran 16:09 with the default pool and 13:16
    # with one thread, identical at 5,643 passed and 54 skipped. The emulation is faithful rather
    # than assumed: the 16:09 matches the 15.9 minutes this job actually takes here.
    #
    # It is set per job rather than on the workflow, because that is where it was measured. The
    # smoke job runs a real abliteration and might well want the pool, and nothing has asked it.
    #
    # THE ONE THING TO KNOW IF A TEST EVER FAILS ONLY HERE: thread count changes the order of
    # floating-point reductions, so a number can move in the last bits. Nothing in this suite
    # noticed, across every row, but that is the mechanism to suspect first rather than last.
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Export the tree without its history
        # `git archive` gives exactly what a consumer of a tarball gets: tracked files, no .git.
        run: |
          set -euo pipefail
          mkdir -p /tmp/archive
          git archive HEAD | tar -x -C /tmp/archive
          test ! -e /tmp/archive/.git
          echo "exported $(find /tmp/archive -type f | wc -l) file(s), and there is no .git"
      - name: Install torch (CPU build)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install from the archive
        working-directory: /tmp/archive
        run: |
          pip install -e ./checker --no-deps
          pip install -e ".[dev]"
      - name: Run the suite there
        working-directory: /tmp/archive
        # No coverage gate: this job is about WHERE the tree is, and the gate is measured by the
        # matrix rows that run in a checkout.
        run: python -m pytest -q -n 4 --no-cov

  checker:
    # THE TORCH-FREE DISTRIBUTION, RESOLVED FOR REAL (decision Q-29).
    #
    # The suite asserts the property two ways already: a test walks `senbonzakura_check`'s import
    # graph and fails on anything heavy, and `test_torch_free.py` runs the command with the stack
    # made unimportable. Neither of those is an INSTALL. A dependency can be declared in
    # `checker/pyproject.toml` and reach a user without any import in our tree changing, and that
    # user is the one person who never appears in the rest of this file: somebody who typed
    # `pip install senbonzakura-check` and nothing else.
    #
    # So this job builds the wheel, installs it into an environment with nothing in it, and reads
    # back what pip actually resolved. It is the only check here that would catch a dependency
    # arriving through packaging rather than through code.
    name: the checker installs with nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"          # the declared floor, not a convenient version
      - name: Build the checker wheel
        run: |
          pip install --quiet build
          python -m build --wheel --outdir dist-checker checker/
      - name: Install it, and nothing else
        # Deliberately NOT --no-deps. The point is to let pip resolve whatever the metadata asks
        # for, so a dependency that crept into `checker/pyproject.toml` actually arrives here.
        run: pip install --quiet dist-checker/*.whl
      - name: Nothing heavy came with it
        run: |
          set -euo pipefail
          python - <<'PYCHECK'
          import importlib.metadata as md
          heavy = {"torch", "transformers", "accelerate", "optuna", "datasets",
                   "bitsandbytes", "sentencepiece", "gguf", "numpy", "pyarrow",
                   "senbonzakura"}
          installed = {d.metadata["Name"].lower().replace("_", "-")
                       for d in md.distributions() if d.metadata["Name"]}
          found = sorted(h for h in heavy if h in installed)
          assert not found, f"the torch-free distribution pulled in: {found}"
          print(f"resolved to {len(installed)} distribution(s), none of them heavy")
          PYCHECK
      - name: And it works
        # An install that resolves to nothing and then cannot run is not the property wanted.
        # The exit code is 1 on purpose: a metric with no estimator is a finding, so a 0 here
        # would mean the checks did not load, which is the failure a wheel without its data has.
        run: |
          # `set +e` EXPLICITLY, and this is the second time the same mistake cost a red run.
          #
          # GitHub invokes `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so `-e` is
          # ALREADY ON before the first line of this script. Writing `set -uo pipefail` here does
          # not turn it off: it sets `-u` and `-o pipefail` and leaves `-e` exactly where it was.
          # The expected exit code is 1, so the step died on the outcome being asserted, printing
          # nothing at all in fifty milliseconds.
          set +e
          set -uo pipefail
          cat > /tmp/arm.json <<'JSON'
          {"version": 2, "status": "success", "eval": {"task": "t", "model": "m"},
           "results": {"total_samples": 4, "completed_samples": 4,
                       "scores": [{"name": "s", "scorer": null, "scored_samples": 4,
                                   "metrics": {"accuracy": {"name": "accuracy", "value": 0.5}}}]}}
          JSON
          # `set -e` is DELIBERATELY NOT ON HERE. The expected exit code is 1, so `set -e` would
          # kill the script on the very outcome being asserted; the first version of this step
          # did exactly that and failed while the checker was behaving correctly.
          out="$(senbonzakura-check /tmp/arm.json)"
          code=$?
          echo "$out"
          test "$code" -eq 1 || { echo "expected exit 1 (a finding), got $code"; exit 1; }
          echo "$out" | grep -q "metric-reported-without-its-estimator" \
            || { echo "the finding did not name its check; are the checks in the wheel?"; exit 1; }

  journeys:
    # THE JOURNEY RATCHET (decision Q-43), which is the cheap half and runs everywhere.
    #
    # A journey is a scripted session through a real terminal, in tests/journeys/. This step does
    # NOT run them: it reads them with `ast`, checks every one declares which surfaces it covers,
    # and holds two high-water marks in journeys/ratchet.json so neither the number of journeys
    # nor the number of surfaces they cover can fall. No torch, no terminal, seconds.
    #
    # Running the journeys themselves in CI is deliberately not here yet. They start the real
    # program and answer its prompts, and the guided walk needs the bundled track, which a source
    # checkout does not carry; wiring that is v0.5 work and is in DEFERRED.md. Until then they run
    # locally and before a panel, which is what Q-43 asks for.
    name: the journey ratchet holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # No install step: the checker reads source with `ast` and imports nothing of ours, which is
      # the property that lets it run before anything else is built.
      - name: Check the journeys and the ratchet
        run: python tools/ci/check_journeys.py

  docs-commands:
    # EVERY COMMAND THE DOCUMENTATION SHOWS, RUN AGAINST A REAL INSTALL.
    #
    # `test_docs_match_the_package.py` asks whether a documented subcommand exists. It cannot ask
    # whether the command WORKS, and this project's recurring defect is the second kind: the
    # documented benchmark recipe that did not run, the REPRODUCING one-liner that raised KeyError
    # on the first thing a sceptic typed, the quickstart pointing at a directory that ships in no
    # wheel. Each was correct prose about a tool that had moved.
    #
    # No `--network`, so the model-downloading examples are skipped here and the job stays cheap.
    # The runner prints every command it did NOT run and why, so the output says what this tick
    # does and does not cover.
    name: the documented commands run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install this checkout, the way the README says to
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install ./checker .
      - name: Run them
        run: python tools/ci/docs_commands_run.py --bin "$(dirname "$(command -v senbonzakura)")"

  docs:
    # The documentation site, built and link-checked on every change.
    #
    # It is a separate job on purpose. npm lives in docs/ and nowhere else: the Python package is
    # built from src/ and cannot see this tree, so a node_modules cannot reach a wheel. Keeping
    # the boundary visible in the job list is half the point of it.
    #
    # By policy this build MUST fail on a broken link. VitePress exits non-zero on a
    # dead internal link, so no extra checker is needed; `ignoreDeadLinks` is deliberately unset
    # in the config, and a build that only warns is a build nobody reads the output of.
    name: Docs build and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # FULL HISTORY, because the link checker resolves every repository link against the
          # PUBLISHED ref rather than the local one. A shallow clone has no `origin/main` to ask,
          # so the checker would fall back to a network fetch per ref and depend on it succeeding.
          # The ref matters more than it looks: on the maintainer's machine local `main` is 611
          # commits AHEAD of `origin/main` and carries every path, so asking the local branch
          # answers yes to links that 404 for every reader.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0, released 2026-07-14
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install, from the lockfile only
        # `npm ci` refuses to run if package.json and the lockfile disagree, which is the
        # property that makes a committed lockfile worth having (baseline section 5).
        working-directory: docs
        run: npm ci
      - name: Build, which fails on a dead link
        working-directory: docs
        run: npm run build
      - name: Every documentation link in the README resolves to a built page
        # The build checks links between pages of the site. This checks the links pointing INTO
        # it from the README, which is the direction a reader arrives from and the direction that
        # was broken: the site was never deployed at all and all eleven of them returned 404,
        # here and on the PyPI project page, while this job stayed green.
        #
        # It runs on `dev` as well as on the publish path so a page rename is caught where it
        # lands rather than on the release that publishes it.
        run: python3 tools/ci/readme_links_resolve.py docs/.vitepress/dist
      - name: Nothing from the docs tree reached the package
        # A guard rather than a comment. If npm ever installs into the repository root, or a
        # docs dependency finds its way under src/, the wheel would carry it.
        run: |
          test ! -d node_modules || { echo "node_modules at the repository root"; exit 1; }
          test ! -d src/node_modules || { echo "node_modules inside the package"; exit 1; }
          ! git ls-files | grep -q '^docs/node_modules' || { echo "node_modules is tracked"; exit 1; }

  wheel:
    # The wheel is what a stranger actually installs, and every other job runs in a
    # checkout that already has the vendored binaries, the corpora sources and the dev
    # dependencies on disk. This is the only job that asks what someone with none of
    # that receives.
    #
    # THE NEGATIVE CONTROL IS THE POINT. Building a wheel and checking it passes proves
    # nothing about the check: a gate only ever seen agreeing has not been shown to
    # work. So the job also constructs a wheel it knows is wrong and requires the same
    # check to refuse it. That is the discipline this project arrived at the hard way,
    # after a check shipped that passed a tree with the bug reinstated.
    name: the wheel describes itself honestly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist-ci
      - name: The tag and the contents agree
        # `--intermediate`, because this wheel is built from a plain clone and is published nowhere.
        # The packed evaluation track is cut from a held-out corpus kept off the build machines on
        # purpose, so no CI job can produce one, and this job never had to say so while the version
        # carried a `.devN`: the release checks turn themselves on at a release version, and the
        # first push after the 0.4.0 bump failed here on a track that cannot exist in CI. The flag
        # skips that question and the PyPI tag question, and nothing else. This job's own name is
        # what it still asks.
        run: python tools/ci/check_wheel.py dist-ci/*.whl --intermediate
      - name: The source distribution carries nothing platform-specific
        run: |
          python -m build --sdist --outdir dist-ci
          python tools/ci/check_wheel.py dist-ci/*.tar.gz

      - name: A deliberately wrong sdist is refused
        # The same argument as the mislabelled wheel below: a gate only ever seen passing has
        # not been shown to work.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/pkg/src/senbonzakura/vendor/bin/linux-x86_64"
          echo x > "$work/pkg/src/senbonzakura/vendor/bin/linux-x86_64/libggml-base.so"
          tar czf "$work/bad.tar.gz" -C "$work" pkg
          python tools/ci/check_wheel.py "$work/bad.tar.gz" --expect-failure

      - name: A deliberately mislabelled wheel is refused
        # Renaming a platform wheel to the universal tag produces the one combination
        # that installs on machines it cannot run on. If this step passes, the check
        # above is decoration.
        run: |
          set -euo pipefail
          orig="$(ls dist-ci/*.whl)"
          case "$orig" in
            *-py3-none-any.whl)
              # Nothing was vendored, so invent the opposite lie: a platform tag with
              # no platform payload to justify it.
              bad="dist-ci/mislabelled-0.0.0-py3-none-linux_x86_64.whl" ;;
            *)
              bad="dist-ci/mislabelled-0.0.0-py3-none-any.whl" ;;
          esac
          cp "$orig" "$bad"
          python tools/ci/check_wheel.py "$bad" --expect-failure
      - name: The wheel installs and runs where nothing else exists
        # It builds its own wheel into dist-cleanroom/ rather than taking a path, and
        # runs two containers: one with a network to install, one with `--network none`
        # to check. A single container with the network left on would prove nothing
        # about whether the corpora are really bundled.
        run: bash tools/ci/clean_room.sh

  images:
    # Both published images, built and then asked what they can do. `doctor` is the
    # right question because it answers "does this WORK" rather than "is this present",
    # and a container that imports cleanly and cannot run the quantiser is exactly the
    # failure it was written for: that happened twice inside python:3.13-slim, where
    # the binary was correct and libgomp1 was missing.
    name: both container images can do what they claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the CPU image
        # ALLOW_CODE_ONLY=1 BECAUSE THIS JOB WANTS THE CORPORA-LESS IMAGE. The corpora are
        # generated rather than committed, so a runner can never have them, and the assertions
        # below are written around that: they check the absence is legible rather than silent.
        # Without this argument the Dockerfile's release gate refuses the build outright and the
        # job cannot obtain the very image it exists to read.
        run: docker build -f Dockerfile --build-arg ALLOW_CODE_ONLY=1 -t senbonzakura:ci-cpu .
      - name: The CPU image runs the quantiser
        # Not `doctor` exiting 0: it exits 1 on warnings, and a CPU image legitimately
        # warns about having no card. The claim under test is narrower and is read from
        # the check line itself.
        run: |
          set -euo pipefail
          docker run --rm senbonzakura:ci-cpu doctor > cpu.txt 2>&1 || true
          cat cpu.txt
          grep -qE '^\s*✓\s+llama-quantize' cpu.txt
          grep -qE '^\s*✓\s+architecture modules' cpu.txt
          # THE BUNDLED DATA, AND WHY THIS ASKS THE OPPOSITE QUESTION ON A RUNNER.
          #
          # An image that ships without the blobs looks identical from outside: it builds,
          # imports, answers --help, and fails --track default for every user. So this used to
          # assert they were present. The comment above it said, correctly, that Docker's context
          # ignores .gitignore and an image built where the blobs exist works while the same build
          # from a clone does not, and the check was written anyway. A runner is always the second
          # case, so the assertion could never hold here and the job had been red since August.
          #
          # A release image is built where the blobs are, and `check_wheel --release` plus the
          # clean room already gate that. What a runner can prove is the property that must hold
          # for the image it CAN build: that the absence is legible rather than silent. An image
          # that quietly returned rows from somewhere, or reported a pass with no corpora, is the
          # failure worth catching, and this catches it.
          grep -qE '^\s*✗\s+corpus advbench' cpu.txt
          grep -q 'senbonzakura corpora' cpu.txt
          # WHATEVER THE IMAGE CARRIES, IT MUST BE HONEST ABOUT IT. A runner builds without the
          # blobs and a release build has them, so this asserts the property that matches what is
          # actually there: corpora present must load at their declared size, corpora absent must
          # REFUSE and name the builder. Asserting only one of those is how this job came to hold
          # an assertion a runner could never satisfy.
          #
          # `--entrypoint python` IS LOAD-BEARING. The image's ENTRYPOINT is `senbonzakura`, so
          # `docker run <image> python foo.py` hands `python foo.py` to the CLI's argument parser
          # as positional arguments rather than running python at all. That is what happened here:
          # the step printed a `usage:` block and exited 2, and every grep above it had passed.
          # `/check/ci/`, NOT `/check/`: the mount is `tools/` and the script lives in
          # `tools/ci/` since the grouping on 2026-09-21. A path inside a container mount is the
          # fifth spelling of that move this project has had to fix, after ten Python scripts,
          # four shell scripts and the ruff per-file table, and it is the one no guard on disk
          # could ever have caught: the string lives in a workflow, and the file it names is
          # correct where it sits. `tests/test_tools_layout.py` now reads the workflows too.
          docker run --rm -v "$PWD/tools:/check:ro" --entrypoint python senbonzakura:ci-cpu /check/ci/image_is_honest.py
          # EVERY DECLARED LICENCE FILE, NOT ONE OF THEM, and the list is read from
          # `pyproject.toml` rather than written here. This asserted THIRD-PARTY-CORPORA.md alone
          # while both Dockerfiles copied three of the five files `license-files` declares, so
          # APACHE-2.0.txt and ACCEPTABLE-USE.md were absent from the image. setuptools omits a
          # declared-but-missing licence file in silence: no error, no warning, a wheel built
          # without it. `tools/ci/check_wheel.py` already enforces the whole set for the WHEEL,
          # and this is the same obligation one layer down, in the artefact that would carry the
          # Apache-2.0 evaluation track to anyone who pulled it.
          # NOT tomllib: this runs on the runner's python, and `requires-python` is >=3.10 where
          # tomllib does not exist. The declaration is a flat array of quoted names, so it is read
          # with a pattern rather than a parser, and the assertion below fails loudly if the
          # pattern ever reads nothing.
          WANT=$(python3 -c "import re,pathlib;t=pathlib.Path('pyproject.toml').read_text();m=re.search(r'license-files\s*=\s*\[(.*?)\]',t,re.S);print(' '.join(re.findall(r'\"([^\"]+)\"',m.group(1))))")
          test -n "$WANT" || { echo "could not read license-files from pyproject.toml"; exit 1; }
          echo "declared licence files: $WANT"
          docker run --rm --entrypoint python -e WANT="$WANT" senbonzakura:ci-cpu -c "
          import os, pathlib, senbonzakura
          root = pathlib.Path(senbonzakura.__file__).resolve().parents[2]
          missing = [n for n in os.environ['WANT'].split() if not list(root.rglob(n))]
          assert not missing, f'the image is missing declared licence file(s): {missing}'
          print('all declared licence files present:', os.environ['WANT'])
          "
      - name: Build the CUDA image
        run: docker build -f Dockerfile.cuda -t senbonzakura:ci-cuda .
      - name: The CUDA image carries a CUDA torch
        # There is no card on a GitHub runner, so this cannot test that CUDA WORKS. It
        # tests the thing that is actually easy to get wrong and impossible to notice:
        # that the image shipped a CPU torch while calling itself the CUDA image.
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python senbonzakura:ci-cuda -c "
          import torch
          print('torch', torch.__version__)
          assert '+cu' in torch.__version__, f'the CUDA image carries {torch.__version__}, which is not a CUDA build'
          "

  smoke:
    # THE JOB THAT ACTUALLY DOES THE THING.
    #
    # Everything above this runs unit tests, checks packaging, or builds documentation.
    # Not one of them abliterates a model. On 2026-09-10 that was measured: 3048 tests
    # across three operating systems and three interpreters, and the product itself had
    # been exercised by nothing except hand-run jobs on one laptop. A suite that green
    # lights every commit without once doing the job is measuring the parts.
    #
    # It does not need a GPU. SmolLM2-135M-Instruct against the toy track committed in
    # `examples/toy-track` runs a genuine two-trial search, bakes the winner and saves a
    # real model in about 25 seconds of CPU, and the whole chain below finishes in
    # roughly a minute.
    #
    # WHY IT ASSERTS REFUSALS TOO. Three stages require the tool to say NO: `kageyoshi`
    # on a track too small for its own auto budget, and the guided mode both without a
    # terminal and with one. A tool that cannot refuse is a tool whose approvals mean
    # nothing, and the guided mode's 48 unit tests all fake `isatty`, so the pty stage
    # is the only place a real terminal is ever used.
    name: it can actually abliterate a model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU build)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install the package
        # Plain install, no extras: since the editor's dependencies became base
        # dependencies this is what a user gets, and the smoke should exercise that
        # rather than a developer environment.
        run: |
          pip install -e ./checker --no-deps
          pip install -e .

      - name: Abliterate a model, measure it, and drive the guided mode
        # The script asserts on the markers each command prints when it has done the
        # work, not on exit codes. Five benchmark jobs once reported success having
        # measured nothing, because success was printed unconditionally.
        run: python tools/ci/smoke_end_to_end.py

      - name: The artefacts it produced are readable
        # A separate step so a failure here is distinguishable from a failure in the
        # run: the model existing and the model being loadable are different claims.
        run: |
          set -euo pipefail
          ls -la "${RUNNER_TEMP}/smoke/model"
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "smoke"
          for name in ("score.json", "compass.json", "drift.json"):
              doc = json.loads((out / name).read_text(encoding="utf-8"))
              assert doc, f"{name} is empty"
              print(f"  {name}: {len(doc)} keys")
          card = (out / "CARD.md").read_text(encoding="utf-8")
          assert "NOT MEASURED" in card or "Capability" in card, "the card lost its sections"
          print(f"  CARD.md: {len(card.splitlines())} lines")
          PY

  documented-first-run:
    # THE COMMANDS IN THE GUIDE, RUN AS WRITTEN, IN AN ENVIRONMENT THAT HAS NOTHING.
    #
    # Nothing else in this file installs the way the documentation tells a stranger to install,
    # and nothing else runs the first commands it tells them to run. `smoke` comes closest and
    # installs from the tree with `pip install -e .`, which resolves a different dependency set
    # from the one a reader gets, and drives the tool through a script rather than through the
    # documented sequence.
    #
    # That gap shipped a release candidate whose documented first run died at the SECOND command.
    # `senbonzakura track build` opened with `from datasets import load_dataset`, `datasets` is
    # the `hub` extra, and every install string in the guide is the bare package. Every command
    # after it needs the track that one builds, so the whole guide stopped there, and 3,000 tests
    # and nine jobs all passed.
    #
    # THE COMMANDS ARE READ OUT OF THE FILES, NOT RETYPED HERE. A job holding its own copy of the
    # install line proves that copy works and says nothing about the one people read. If the
    # documentation changes shape so this cannot find them, the step fails and says what it
    # looked for, which is the correct outcome: a gate that cannot find the thing it gates has
    # stopped gating it.
    name: the documented first run works, from a clean environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Read the documented commands out of README.md and the guide
        # Two substitutions, both of which MUST match or this refuses. The documented install
        # points at `@dev` on GitHub, so running it verbatim would test the branch instead of
        # this commit and a broken first run would stay green here until after it was merged.
        # Everything else runs exactly as written.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firstrun"
          python - <<'PY'
          import os, pathlib, re

          def blocks(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              return re.findall(r"```sh\n(.*?)```", text, re.DOTALL)

          def only(path, needle):
              found = [b for b in blocks(path) if needle in b]
              if len(found) != 1:
                  raise SystemExit(
                      f"expected exactly one ```sh block in {path} containing {needle!r}, "
                      f"found {len(found)}. This job runs the documented commands rather than a "
                      f"copy of them, so it stops rather than running something else.")
              return found[0]

          install = only("README.md", "pip install senbonzakura")
          quickstart = only("docs/guide/quickstart.md", "track build")

          # POINT THE DOCUMENTED COMMAND AT THIS CHECKOUT, which is the whole trick of this job:
          # it runs what the README says, against the branch under test rather than against
          # whatever PyPI is serving. `pip install senbonzakura` would otherwise resolve to the
          # last release and this job would report on a tree nobody changed.
          #
          # The checker is named first and separately because the abliterator depends on it: given
          # only `.`, pip goes to the index for `senbonzakura-check` and installs the published one
          # beside a local build of its dependent.
          #
          # The README said `pip install "git+...@dev"` until 2026-09-26, and this job swapped the
          # two URLs for paths. That swap is gone with the URLs; the refusal below is what caught
          # the change, which is the behaviour it was written for.
          old, new = "pip install senbonzakura", "pip install ./checker ."
          if old not in install:
              raise SystemExit(
                  f"the README install command no longer contains {old!r}, so it cannot be "
                  f"pointed at this checkout. Update this job together with the README.")
          install = install.replace(old, new, 1)

          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "firstrun"
          (out / "install.sh").write_text(install, encoding="utf-8")
          # The guide's block ends at the command that needs a GPU and a 5 GB download; every
          # line before it runs on a runner.
          (out / "quickstart.sh").write_text(quickstart, encoding="utf-8")
          print("--- install ---");    print(install)
          print("--- quickstart ---"); print(quickstart)
          PY

      - name: A clean virtual environment, with nothing in it
        # A virtual environment rather than the runner's interpreter, because the defect being
        # gated is about WHICH packages arrive with the install, and a runner's Python has
        # whatever earlier steps left there.
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/firstrun/venv"
          echo "${RUNNER_TEMP}/firstrun/venv/bin" >> "$GITHUB_PATH"

      - name: Install torch (CPU build)
        # The same line every other job here uses, and it does not weaken the test. What is under
        # test is the package's own dependency set: which of its dependencies are base and which
        # are extras. Which torch wheel pip would have chosen is a different question, and letting
        # it choose costs 5.8 GB and nineteen CUDA wheels a runner cannot use.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install exactly the way the README says to
        run: bash -euo pipefail "${RUNNER_TEMP}/firstrun/install.sh"

      - name: The heavy optional extras did NOT arrive, which is the point
        # `datasets` is the `hub` extra. If it is here, this job can no longer detect the defect
        # it exists for: a base-install path that quietly needs it would pass. This is the
        # negative control, and without it the steps below prove nothing.
        run: |
          set -euo pipefail
          if python -c "import datasets" 2>/dev/null; then
            echo "datasets is installed in the documented environment, so this job can no longer"
            echo "tell a base-install path from one that needs the hub extra."
            exit 1
          fi
          echo "datasets is absent, as a bare install leaves it"

      - name: Run the documented first commands, as written
        # `corpora` fetches through the GitHub CLI, which is what `senbonzakura corpora` uses so
        # that no credential passes through this project's own code.
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/firstrun
        run: bash -euo pipefail quickstart.sh

      - name: What the documented run was supposed to produce is there
        # Exit codes are not the assertion. A command that printed a plan and wrote nothing exits
        # 0, and this project has already had five benchmark jobs report success having measured
        # nothing.
        working-directory: ${{ runner.temp }}/firstrun
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          corpus = pathlib.Path("corpus")
          manifest = json.loads((corpus / "sources.json").read_text(encoding="utf-8"))
          for side in ("harmful", "harmless"):
              rows = (corpus / f"{side}.txt").read_text(encoding="utf-8").splitlines()
              assert rows, f"{side}.txt is empty"
              assert manifest["outputs"][side]["rows"] == len(rows), (
                  f"sources.json claims {manifest['outputs'][side]['rows']} rows for {side} and "
                  f"the file holds {len(rows)}")
              print(f"  {side}: {len(rows)} prompts")
          assert [s["revision"] for s in manifest["sources"]], "no revisions recorded"
          # THE COUNTS THE REVISIONS PIN, AND THEY CANNOT MOVE UNDER THIS. A commit is immutable,
          # so these two numbers are a property of the recipe rather than of upstream's mood: a
          # `datasets`-based run of the same pins fetched 5,884 and 25,058, and the reader that
          # replaced it must agree to the row. Anything else means the shards were selected,
          # ordered or filtered differently, which is the failure mode that produces a corpus
          # that loads and scores and is not the corpus the manifest describes.
          pinned = {"Bahushruth/abliteration-harmful-enriched": 5884,
                    "mlabonne/harmless_alpaca": 25058}
          for source in manifest["sources"]:
              want = pinned.get(source["repo"])
              if want is None:
                  raise SystemExit(
                      f"{source['repo']} is pinned in SOURCES and has no recorded row count here. "
                      f"Record what a run of the pin fetches, so a reader that starts reading it "
                      f"differently is caught.")
              assert source["rows"] == want, (
                  f"{source['repo']} at {source['revision'][:12]} gave {source['rows']} prompts "
                  f"and the pin has always given {want}")
          print("  both sources gave exactly what their pins have always given")
          track = pathlib.Path("track")
          for name in ("bad_eval_ds", "good_ds"):
              assert (track / name).is_dir(), f"the split left no {name}"
          print("  the track has both sides split")
          PY

  action:
    # THE ACTION THIS REPOSITORY PUBLISHES, RUN RATHER THAN PARSED.
    #
    # `tests/test_check_cli.py` asserts the shape of `action.yml`: that it installs with no heavy
    # stack, that its defaults block, that it exposes both counts. Every one of those passed on
    # 2026-09-28 while the action was comprehensively broken, because none of them ran it.
    #
    # It installed `--no-deps senbonzakura`, which brings the launcher without the
    # `senbonzakura_check` package it dispatches to, so the command exited 1 saying so. The step
    # swallowed that with `|| true`, the report was empty, the three counts parsed to the empty
    # string, `[ "" -eq 0 ]` errors rather than returning false, every gate was skipped, and the
    # step reached `exit 0`. A broken install reported a clean run, on the one channel whose whole
    # purpose is running without anybody choosing to run it.
    #
    # So this job runs it three times, and each case is a defect that actually happened:
    #   clean    a real artefact with nothing wrong passes, and reports a non-zero `checked`
    #   finding  an artefact with a known defect FAILS, which is the entire point of the action
    #   junk     a directory of unrecognised JSON reports checked=0, so `fail-on-empty` can fire.
    #            It used to report `checked=1` from `len(report)` while the command itself printed
    #            "NOTHING WAS CHECKED", so the gate named for this case could never reach it.
    name: the Action this repository publishes actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fixtures, in the shape a real consumer produces
        run: |
          set -euo pipefail
          mkdir -p fx/clean fx/finding fx/junk
          python - <<'PY'
          import json, pathlib
          good = {"version": 2, "status": "success",
                  "eval": {"task": "t", "model": "m"},
                  "results": {"total_samples": 200, "completed_samples": 200,
                              "scores": [{"name": "s", "scorer": "choice",
                                          "scored_samples": 200,
                                          "metrics": {"accuracy": {"name": "accuracy",
                                                                   "value": 0.5}}}]}}
          bad = json.loads(json.dumps(good))
          # A metric reported with no estimator behind it, which is the check the README leads on.
          bad["results"]["scores"][0]["scorer"] = None
          pathlib.Path("fx/clean/good.json").write_text(json.dumps(good))
          pathlib.Path("fx/finding/bad.json").write_text(json.dumps(bad))
          # Valid JSON that is not a result artefact. The command reports it, and must not count
          # it as checked.
          pathlib.Path("fx/junk/config.json").write_text(json.dumps({"ran": ["a"]}))
          PY

      - id: clean
        name: A clean artefact passes, and says it looked at something
        uses: ./
        with:
          path: fx/clean

      - id: finding
        name: An artefact with a known defect fails
        uses: ./
        continue-on-error: true
        with:
          path: fx/finding

      - id: junk
        name: A directory of unrecognised JSON is empty, not clean
        uses: ./
        continue-on-error: true
        with:
          path: fx/junk
          fail-on-empty: "true"

      # THE REGRESSION GATE, THROUGH THE SAME ACTION. A gate nobody has wired in runs exactly as
      # often as no gate, and the whole argument for the gate is that it runs on every change.
      #
      # The three measurements are committed under `tests/fixtures/gate/` and say inside
      # themselves that nobody measured them. What is being tested is the action's shell: that a
      # regression fails the step, that a refusal fails it for a DIFFERENT and stated reason, and
      # that a pass passes while saying how much room there was.
      #
      # NOTE WHAT THIS EXERCISES THAT THE UNIT TESTS CANNOT: the install. These steps resolve
      # `senbonzakura` from the index and run its gate, so an action whose install line cannot
      # produce a working command fails here rather than on a stranger's runner. That was the
      # 2026-09-28 defect exactly.
      # HALF A GATE GOES FIRST, AND THE ORDER IS LOAD-BEARING. It used to sit last and the job
      # failed on it from 2026-10-02, reporting `gate-status='2'` for a step that correctly
      # refused before installing anything.
      #
      # The action was right and the assertion was wrong. All four of these invocations are the
      # same composite action, whose internal gate step carries the id `gate` in every instance.
      # When this instance stops at its first step, that inner step is SKIPPED and never writes
      # an output, so `steps.gate_half.outputs.gate-status` resolves to the last value any
      # instance wrote in this job. Sitting directly after `gate_refused`, it read that step's
      # `2`, which is why the number was always exactly the preceding verdict.
      #
      # So "produced no gate-status at all" is only observable where nothing has written one yet,
      # and that is here. Moving this block back down does not silently weaken the check: it
      # re-reads whichever verdict now precedes it and fails the build, which is the right
      # failure rather than a false green.
      - id: gate_half
        name: Half a gate stops the run rather than checking nothing
        uses: ./
        continue-on-error: true
        with:
          path: fx/clean
          baseline: tests/fixtures/gate/baseline-refusal-rate.json

      - id: gate_pass
        name: A measurement inside its interval passes the gate
        uses: ./
        with:
          path: fx/clean
          baseline: tests/fixtures/gate/baseline-refusal-rate.json
          measurement: tests/fixtures/gate/measurement-steady.json

      - id: gate_regressed
        name: A measurement outside its interval fails the gate
        uses: ./
        continue-on-error: true
        with:
          path: fx/clean
          baseline: tests/fixtures/gate/baseline-refusal-rate.json
          measurement: tests/fixtures/gate/measurement-regressed.json

      - id: gate_refused
        name: A measurement that was never comparable is refused, not failed
        uses: ./
        continue-on-error: true
        with:
          path: fx/clean
          baseline: tests/fixtures/gate/baseline-refusal-rate.json
          measurement: tests/fixtures/gate/measurement-incomparable.json

      - name: The gate's three verdicts are three different outcomes
        run: |
          set -euo pipefail
          fail=0
          say() { echo "  $*"; }

          # EVERY STATUS IS CHECKED FOR BEING A NUMBER BEFORE IT IS COMPARED AS ONE, which is the
          # lesson from the block below this one: an action that crashes before writing its output
          # leaves the expansion empty, `[ "" -eq 0 ]` exits 2 with "integer expected", and a
          # non-zero status inside an `elif` condition is merely false and does not trip `set -e`.
          # Control then falls through to a success line.
          check() {
            local label="$1" want="$2" got="$3" outcome="$4" want_outcome="$5"
            if ! printf '%s' "$got" | grep -qE '^[0-9]+$'; then
              echo "::error::${label}: gate-status was '${got}', which is not a number. The action did not reach a verdict, and an unset status must never read as a pass."
              fail=1
            elif [ "$got" -ne "$want" ]; then
              echo "::error::${label}: gate-status was ${got}, expected ${want}."
              fail=1
            elif [ "$outcome" != "$want_outcome" ]; then
              echo "::error::${label}: the step outcome was '${outcome}', expected '${want_outcome}'. The verdict was right and the build was told the wrong thing."
              fail=1
            else say "${label}: gate-status=${got}, outcome=${outcome}"; fi
          }

          check "pass" 0 "${{ steps.gate_pass.outputs.gate-status }}" "${{ steps.gate_pass.outcome }}" "success"
          check "regressed" 1 "${{ steps.gate_regressed.outputs.gate-status }}" "${{ steps.gate_regressed.outcome }}" "failure"
          check "refused" 2 "${{ steps.gate_refused.outputs.gate-status }}" "${{ steps.gate_refused.outcome }}" "failure"

          # A baseline with no measurement must stop the run before anything is installed, so it
          # has no gate-status at all. An empty status here is the correct answer rather than the
          # failure the helper above is shaped around, which is why it is checked separately.
          if [ "${{ steps.gate_half.outcome }}" != "failure" ]; then
            echo "::error::half a gate was accepted. A workflow whose author believes their numbers are gated and whose build never compares them is worse than no gate."
            fail=1
          elif [ -n "${{ steps.gate_half.outputs.gate-status }}" ]; then
            echo "::error::half a gate produced gate-status='${{ steps.gate_half.outputs.gate-status }}'. It must stop before comparing anything."
            fail=1
          else say "half a gate: refused before installing anything"; fi

          exit $fail

      - name: The three outcomes are the ones that make the action worth having
        run: |
          set -euo pipefail
          fail=0
          say() { echo "  $*"; }

          # A green that checked nothing is the failure this whole job exists for, so the clean
          # case asserts the COUNT and not merely the exit status.
          if [ "${{ steps.clean.outputs.checked }}" != "1" ]; then
            echo "::error::the clean run reported checked='${{ steps.clean.outputs.checked }}', not 1. A pass that examined nothing is not a pass."
            fail=1
          else say "clean: checked=1, passed"; fi

          # The findings count is captured into a variable and checked for being a number BEFORE
          # it is compared as one. Found by actionlint (SC2170) and the real defect is worse than
          # the one it names: when the action crashes before setting `findings`, the expansion is
          # empty, `[ "" -lt 1 ]` exits 2 with "integer expected", and a non-zero status in an
          # `elif` CONDITION is just "false" and does not trip `set -e`. Control fell through to
          # the `else`, which printed a success line, and the job exited 0. So the block that
          # exists to catch "a green that checked nothing" was itself green when it had checked
          # nothing. Verified 2026-10-01 by running the substituted form.
          findings="${{ steps.finding.outputs.findings }}"
          if [ "${{ steps.finding.outcome }}" != "failure" ]; then
            echo "::error::the action PASSED a file with a known finding. That is the defect the action exists to catch."
            fail=1
          elif ! printf '%s' "$findings" | grep -qE '^[0-9]+$'; then
            echo "::error::the action failed the finding case but reported findings='${findings}', which is not a number. It crashed before setting its output rather than reporting a finding, and an unset count must never read as a pass."
            fail=1
          elif [ "$findings" -lt 1 ]; then
            echo "::error::the action failed the finding case but reported ${findings} findings, so it failed for some other reason."
            fail=1
          else say "finding: outcome=failure, findings=${findings}"; fi

          if [ "${{ steps.junk.outputs.checked }}" != "0" ]; then
            echo "::error::a directory holding no result artefacts reported checked='${{ steps.junk.outputs.checked }}'. Unreadable files are being counted as checked, so fail-on-empty can never fire."
            fail=1
          elif [ "${{ steps.junk.outcome }}" != "failure" ]; then
            echo "::error::fail-on-empty was set and nothing was checked, and the action passed anyway."
            fail=1
          else say "junk: checked=0, fail-on-empty fired"; fi

          exit $fail
