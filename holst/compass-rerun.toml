[[job]]
id = "base-qwen2.5-1.5b"
name = "baseline both axes, qwen2.5-1.5b"
machine = "rented"
deps = ["setup"]
timeout_secs = 3600
resources = { needs_gpu = true }
success = { type = "stdout-contains", needle = "BASE_OK" }
command = """
set -euo pipefail
_gpu=""
for i in $(seq 0 $(( $(nvidia-smi -L | wc -l) - 1 ))); do
  if exec 9>/workspace/.gpu$i.lock && flock -n 9; then _gpu=$i; break; fi
done
[ -n "$_gpu" ] || { echo "NO_FREE_GPU"; exit 1; }
export CUDA_VISIBLE_DEVICES=$_gpu
echo "CLAIMED_GPU=$_gpu"
M=Qwen/Qwen2.5-1.5B-Instruct
python3 -m senbonzakura.score --model $M --eval /workspace/track/bad_eval_ds --device cuda \
  --out /workspace/results/base-refusal-qwen2.5-1.5b.json --label base-refusal \
  --save-generations /workspace/gens/base-refusal-qwen2.5-1.5b.jsonl
python3 -m senbonzakura.score --model $M --eval /workspace/track/bad_eval_ds --device cuda \
  --harm-recognition --out /workspace/results/base-compass-qwen2.5-1.5b.json --label base-compass \
  --save-generations /workspace/gens/base-compass-qwen2.5-1.5b.jsonl
python3 - <<'UP'
import os
from huggingface_hub import HfApi
api = HfApi(token=os.environ["HF_TOKEN"])
api.create_repo("ops-malware/senbon-compass-2026-07", repo_type="dataset", private=True, exist_ok=True)
for f in ["results/base-refusal-qwen2.5-1.5b.json","results/base-compass-qwen2.5-1.5b.json","gens/base-refusal-qwen2.5-1.5b.jsonl","gens/base-compass-qwen2.5-1.5b.jsonl"]:
    api.upload_file(path_or_fileobj="/workspace/"+f, path_in_repo=f, repo_id="ops-malware/senbon-compass-2026-07", repo_type="dataset")
UP
echo BASE_OK
"""

