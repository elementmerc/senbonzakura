# Compass re-run, 2026-07-27. Replaces the July sweep, whose artefacts are gone.
#
# The July run kept only percentages: its JSONs, generations and weights died
# with the pod, so the article's table became the only surviving record and every
# follow-up needed the GPU back. This run keeps all three.
#
# Both axes at n=200 so before and after are finally like-for-like; July scored 64.
#
# The abl-* jobs depend only on setup, NOT on their base-* sibling. They are
# independent work on the same model, and chaining them would serialise the graph
# for tidiness rather than correctness, wasting half a two-card box.
run = "compass-2026-07-27d"

[[job]]
id = "setup"
machine = "rented"
timeout_secs = 2400
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
pip install -q 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cu124
python3 -c 'from torch.distributed.tensor import DTensor'
python3 -c 'import torch; assert torch.cuda.is_available()'
# Install the tree holst uploaded, NOT a published branch. The run then uses
# exactly the code on the operator's machine, including work that is committed
# but not pushed. The first attempt died precisely there: --save-generations
# existed locally and nowhere else, so the pod installed a version without it.
pip install -q /workspace/senbonzakura hf_transfer
python3 -m senbonzakura.score --help 2>&1 | grep -q -- --save-generations \
  || { echo "MISSING_SAVE_GENERATIONS: the uploaded tree is not the one expected"; exit 1; }
echo "SENBONZAKURA_COMMIT=d4682e6"
test -n "${HF_TOKEN:-}"
hf download ops-malware/senbon-track-35axis-clean --repo-type dataset --local-dir /workspace/track
test -d /workspace/track/bad_eval_ds
mkdir -p /workspace/results /workspace/gens /workspace/abl
nvidia-smi -L
echo SETUP_OK
"""

[[job]]
id = "base-gemma-2-2b-it"
name = "baseline both axes, gemma-2-2b-it"
machine = "rented"
deps = ["setup"]
timeout_secs = 3600
resources = { needs_gpu = true }
success = { type = "stdout-contains", needle = "BASE_OK" }
command = """
set -euo pipefail
_gpu=""
for i in $(seq 0 $(( $(nvidia-smi -L | wc -l) - 1 ))); do
  if exec 9>/workspace/.gpu$i.lock && flock -n 9; then _gpu=$i; break; fi
done
[ -n "$_gpu" ] || { echo "NO_FREE_GPU"; exit 1; }
export CUDA_VISIBLE_DEVICES=$_gpu
echo "CLAIMED_GPU=$_gpu"
M=google/gemma-2-2b-it
python3 -m senbonzakura.score --model $M --eval /workspace/track/bad_eval_ds --device cuda \
  --out /workspace/results/base-refusal-gemma-2-2b-it.json --label base-refusal \
  --save-generations /workspace/gens/base-refusal-gemma-2-2b-it.jsonl
python3 -m senbonzakura.score --model $M --eval /workspace/track/bad_eval_ds --device cuda \
  --harm-recognition --out /workspace/results/base-compass-gemma-2-2b-it.json --label base-compass \
  --save-generations /workspace/gens/base-compass-gemma-2-2b-it.jsonl
python3 - <<'UP'
import os
from huggingface_hub import HfApi
api = HfApi(token=os.environ["HF_TOKEN"])
api.create_repo("ops-malware/senbon-compass-2026-07", repo_type="dataset", private=True, exist_ok=True)
for f in ["results/base-refusal-gemma-2-2b-it.json","results/base-compass-gemma-2-2b-it.json","gens/base-refusal-gemma-2-2b-it.jsonl","gens/base-compass-gemma-2-2b-it.jsonl"]:
    api.upload_file(path_or_fileobj="/workspace/"+f, path_in_repo=f, repo_id="ops-malware/senbon-compass-2026-07", repo_type="dataset")
UP
echo BASE_OK
"""

[[job]]
id = "abl-gemma-2-2b-it"
name = "abliterate then both axes, gemma-2-2b-it"
machine = "rented"
deps = ["setup"]
timeout_secs = 7200
resources = { needs_gpu = true }
success = { type = "stdout-contains", needle = "ABL_OK" }
command = """
set -euo pipefail
_gpu=""
for i in $(seq 0 $(( $(nvidia-smi -L | wc -l) - 1 ))); do
  if exec 9>/workspace/.gpu$i.lock && flock -n 9; then _gpu=$i; break; fi
done
[ -n "$_gpu" ] || { echo "NO_FREE_GPU"; exit 1; }
export CUDA_VISIBLE_DEVICES=$_gpu
echo "CLAIMED_GPU=$_gpu"
M=google/gemma-2-2b-it
O=/workspace/abl/gemma-2-2b-it
senbonzakura kageyoshi --model $M --out $O --track /workspace/track --device cuda \
  --study-db /workspace/abl/gemma-2-2b-it-study.db
test -d $O
python3 -m senbonzakura.score --model $O --eval /workspace/track/bad_eval_ds --device cuda \
  --out /workspace/results/abl-refusal-gemma-2-2b-it.json --label abl-refusal \
  --save-generations /workspace/gens/abl-refusal-gemma-2-2b-it.jsonl
python3 -m senbonzakura.score --model $O --eval /workspace/track/bad_eval_ds --device cuda \
  --harm-recognition --out /workspace/results/abl-compass-gemma-2-2b-it.json --label abl-compass \
  --save-generations /workspace/gens/abl-compass-gemma-2-2b-it.jsonl
python3 - <<'UP'
import os
from huggingface_hub import HfApi
api = HfApi(token=os.environ["HF_TOKEN"])
api.create_repo("ops-malware/senbon-compass-2026-07", repo_type="dataset", private=True, exist_ok=True)
for f in ["results/abl-refusal-gemma-2-2b-it.json","results/abl-compass-gemma-2-2b-it.json","gens/abl-refusal-gemma-2-2b-it.jsonl","gens/abl-compass-gemma-2-2b-it.jsonl"]:
    api.upload_file(path_or_fileobj="/workspace/"+f, path_in_repo=f, repo_id="ops-malware/senbon-compass-2026-07", repo_type="dataset")
UP
python3 - <<'UPW'
import os
from huggingface_hub import HfApi
api = HfApi(token=os.environ["HF_TOKEN"])
api.create_repo("ops-malware/gemma-2-2b-it-abliterated", repo_type="model", private=False, exist_ok=True)
api.upload_folder(folder_path="/workspace/abl/gemma-2-2b-it", repo_id="ops-malware/gemma-2-2b-it-abliterated", repo_type="model")
UPW
echo ABL_OK
"""

