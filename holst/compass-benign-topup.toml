# The three benign base passes lost when the pod filled its disk.
#
# The container root is 40G and the HF cache accumulated every model the run
# had downloaded, 32G of it, until the last jobs had nowhere to write. The
# cache now lives on /workspace, which is a network mount with room, and each
# job clears its own model afterwards so the failure cannot creep back as the
# job count grows.
run = "compass-benign-topup"

[[job]]
id = "setup"
machine = "rented"
timeout_secs = 2400
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
exec 2>&1
export HF_HOME=/workspace/hf
mkdir -p /workspace/hf
retry() {
  local n=0
  until "$@"; do
    n=$((n+1)); [ $n -ge 3 ] && { echo "RETRY_EXHAUSTED: $*"; return 1; }
    echo "RETRYING ($n/3): $*"; sleep 20
  done
}
pip install -q 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cu124
python3 -c 'from torch.distributed.tensor import DTensor'
python3 -c 'import torch; assert torch.cuda.is_available()'
# Install the tree holst uploaded, NOT a published branch. The run then uses
# exactly the code on the operator's machine, including work that is committed
# but not pushed. The first attempt died precisely there: --save-generations
# existed locally and nowhere else, so the pod installed a version without it.
pip install -q /workspace/senbonzakura hf_transfer
python3 -m senbonzakura.score --help 2>&1 | grep -q -- --save-generations || { echo "MISSING_SAVE_GENERATIONS: the uploaded tree is not the one expected"; exit 1; }
# --skip is what keeps this run off the prompts the surgery was fitted on. A tree
# without it would silently score the wrong slice, so fail here rather than there.
python3 -m senbonzakura.score --help 2>&1 | grep -q -- --skip || { echo "MISSING_SKIP: uploaded tree predates the held-out slice flag"; exit 1; }
echo "SENBONZAKURA_COMMIT=d4682e6"
test -n "${HF_TOKEN:-}"
hf download ops-malware/senbon-track-35axis-clean --repo-type dataset --local-dir /workspace/track
test -d /workspace/track/bad_eval_ds
mkdir -p /workspace/results /workspace/gens /workspace/abl
nvidia-smi -L
echo SETUP_OK
"""

[[job]]
id = "benign-base-qwen3-1.7b"
machine = "rented"
deps = ["setup"]
timeout_secs = 5400
resources = { needs_gpu = true }
success = { type = "stdout-contains", needle = "BENIGN_OK" }
command = """
set -euo pipefail
exec 2>&1
export HF_HOME=/workspace/hf
mkdir -p /workspace/hf
retry() {
  local n=0
  until "$@"; do
    n=$((n+1)); [ $n -ge 3 ] && { echo "RETRY_EXHAUSTED: $*"; return 1; }
    echo "RETRYING ($n/3): $*"; sleep 20
  done
}
_gpu=""
for i in $(seq 0 $(( $(nvidia-smi -L | wc -l) - 1 ))); do
  if exec 9>/workspace/.gpu$i.lock && flock -n 9; then _gpu=$i; break; fi
done
[ -n "$_gpu" ] || { echo "NO_FREE_GPU"; exit 1; }
export CUDA_VISIBLE_DEVICES=$_gpu
echo "CLAIMED_GPU=$_gpu"
# The judge frame, on HARMLESS prompts. harm_recognition here is the FALSE
# POSITIVE rate: how often the model calls a harmless request dangerous.
python3 -m senbonzakura.score --model Qwen/Qwen3-1.7B --eval /workspace/track/good_ds --device cuda --skip 320 --n 200 --batch 32 --max-new 512 --harm-recognition --out /workspace/results/benign-base-qwen3-1.7b.json --label benign-base-qwen3-1.7b --save-generations /workspace/gens/benign-base-qwen3-1.7b.jsonl
cat > /workspace/_upload_benign.py <<'UP'
import os
from huggingface_hub import HfApi
api = HfApi(token=os.environ["HF_TOKEN"])
for f in ["results/benign-base-qwen3-1.7b.json", "gens/benign-base-qwen3-1.7b.jsonl"]:
    api.upload_file(path_or_fileobj="/workspace/"+f, path_in_repo=f,
                    repo_id="ops-malware/senbon-compass-2026-07", repo_type="dataset")
UP
retry python3 /workspace/_upload_benign.py
rm -rf /workspace/hf/hub/models--* 2>/dev/null || true
echo BENIGN_OK
"""

