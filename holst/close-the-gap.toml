# The control that makes the RDO number readable. Cluster directions were never optimised
# against a hook, so if THEY also show a hook-bake gap the gap is a property of the two
# operations rather than something RDO did, and it explains nothing about RDO specifically.
PYTHONPATH=src "$PY" -u -m senbonzakura validate \\
    --model google/gemma-2-2b-it --track "$HOME/track-heldout" \\
    --experiment transfer \\
    --dir-prompts 128 --eval-refusal 128 --eval-kl 64 --device cuda --seed 42 \\
    --out "$RUN/gap/transfer-gemma-clusters.json"
echo T_OK
"""

# ── L: does a bigger optimisation budget close it? ────────────────────────────────────
# Runs after S. S answers whether the project's one positive result is real, which is worth more
# than whether a longer budget improves a model whose RDO number is still unmeasured, and L's
# six-hour ceiling would otherwise eat the card before the seeds got near it.

[[job]]
