# The Heretic rematch, on the ROG, five seeds.
#
# Pre-registered in private/plans/pre-registration-2026-07-30-rematch.md, which was written
# BEFORE this file and fixes what would count as a win, a loss, and an inconclusive result.
# Read it first. Editing this spec to disagree with it is the failure both documents exist
# to prevent.
#
# Why the ROG and not a rented card: Qwen3-1.7B fits 6 GB, and five seeds on hardware that
# bills by the hour is a different decision from five seeds on hardware already owned. The
# 4B and 12B re-reports do not fit and are a separate rented spec.
#
# Why both tools in the same job: a head-to-head where the two sides ran on different torch
# builds, different cards, or different corpora is not a head-to-head. One job, one card, one
# environment, one slice.
#
# THE SLICE: the promoted track's measure partition and nothing else.
#   ~/track-heldout   harmful fit 259 / search 132 / measure 4504
#   the search selects on rows 0..131 of bad_eval_ds; every number below comes from 132+
run = "rematch-qwen3-1.7b-2026-07-30"

[[job]]
id = "setup"
machine = "rog"
timeout_secs = 3600
success = { type = "stdout-contains", needle = "SETUP_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout

# Preflight, not discovery. Every one of these has cost a run before: a tree without the
# flag the spec passes, a track whose partitions are not the ones the skips assume, a torch
# that cannot see the card. Checked here, once, rather than three hours in.
test -d "$RUN/src/senbonzakura" || { echo "MISSING_TREE: ship the tree first"; exit 1; }
test -d "$T/bad_eval_ds" || { echo "MISSING_TRACK: $T has no bad_eval_ds"; exit 1; }
"$PY" -c 'import torch; assert torch.cuda.is_available(), "no card"'
cd "$RUN"
PYTHONPATH=src "$PY" -u -m senbonzakura.margin --help | grep -q -- --harmless-matched || {
    echo "TREE_PREDATES_CONTROLS: the shipped tree has no --harmless-matched"; exit 1; }
PYTHONPATH=src "$PY" -u -m senbonzakura.track --out "$T" --audit

# The recorded boundaries, and the flags this run will pass, checked against each other
# before anything is measured.
PYTHONPATH=src "$PY" - <<'PY'
import os
from senbonzakura.track import flag_violations, read_manifest
m = read_manifest(os.path.expanduser("~/track-heldout"))
bad = flag_violations(m, eval_refusal=64, eval_refusal_final=128, dir_prompts=256, eval_kl=64)
assert not bad, bad
print("boundaries OK:", m["counts"])
PY

# Heretic, at its own defaults, in its own environment. Tuning our side and not theirs is
# the most common way a head-to-head lies.
H=$HOME/track2/heretic-src
test -d "$H" || { echo "MISSING_HERETIC: no checkout at $H"; exit 1; }
if ! "$H/.venv/bin/python" -c 'import torch' 2>/dev/null; then
    echo "installing heretic into its own venv"
    "$H/.venv/bin/pip" install -q --index-url https://download.pytorch.org/whl/cu130 torch
    "$H/.venv/bin/pip" install -q -e "$H"
fi
"$H/.venv/bin/python" -c 'import torch; assert torch.cuda.is_available()'
git -C "$H" rev-parse --short HEAD | sed 's/^/HERETIC_COMMIT=/'

mkdir -p "$RUN/results" "$RUN/margins" "$RUN/gens" "$RUN/abl" "$RUN/logs"
nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
echo SETUP_OK
"""

# ── senbonzakura, one job per seed ────────────────────────────────────────────────────
# Five seeds because reporting the best of five is reporting the maximum of a distribution
# and calling it a measurement. The seeds are fixed in the pre-registration; changing them
# here without changing that document is the thing neither is allowed to do.
#
# --eval-refusal-final 128 is the largest the recorded search partition permits, and the
# tree refuses a larger one rather than quietly selecting on the measured rows.

[[job]]
id = "senbon-seed-42"
name = "senbonzakura, Qwen3-1.7B, seed 42"
machine = "rog"
deps = ["setup"]
timeout_secs = 14400
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "ARM_OK" }
command = """
set -euo pipefail
exec 2>&1
SEED=42
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout
M=$HOME/track-matched/good_matched_ds
O=$RUN/abl/senbon-qwen3-1.7b-s$SEED
cd "$RUN"

# The commit is declared rather than measured: the shipped tree is a tarball, not a
# checkout, so git cannot answer and the result file records this as a claim.
#
# It is read from the file the ship step writes beside the tree, not from the
# environment: this job runs over ssh to PowerShell to wsl to bash, and an exported variable
# does not survive that. Reading it from the tree also ties the declared commit to the code
# that was actually shipped, which is what provenance is supposed to mean.
export SENBONZAKURA_COMMIT="$(cat "$RUN/COMMIT" 2>/dev/null || true)"
[ -n "$SENBONZAKURA_COMMIT" ] || { echo "NO_COMMIT_FILE: $RUN/COMMIT is missing, so this run could not name its own code"; exit 1; }

export PYTHONPATH=src
# kageyoshi, not a hand-set budget: it owns trials, dir-prompts and the eval sizes, resolving
# them from the loaded model's size. For a 1.7B that is 100 trials, dir-prompts 256, eval-kl
# 64 and eval-refusal-final 128, and the track was sized for exactly those: 128 fits inside
# the recorded 132-row search partition, 256 + 64 fits inside the 385 harmless rows set aside.
# Passing them by hand would be ignored, so it is not done. --gen-batch pins the generation
# batch, which has to be fixed and recorded because batching reorders reductions.
"$PY" -u -m senbonzakura.cli kageyoshi --model Qwen/Qwen3-1.7B --out "$O" --track "$T" \
    --seed $SEED --device cuda --gen-batch 16 --study-db "$RUN/abl/s$SEED.db"
test -d "$O"

# Refusal, hedging, the Heretic keyword rate, and the harmless arm, in one pass each. The
# harmless arm is not optional: a harmful refusal rate alone cannot tell "the abliteration
# worked" from "the model is too damaged to refuse anything".
"$PY" -u -m senbonzakura.score --model "$O" --eval "$T/bad_eval_ds" --skip 132 --n 512 \
    --batch 16 --device cuda --label "senbon-s$SEED-harmful" \
    --out "results/senbon-s$SEED-harmful.json" \
    --save-generations "gens/senbon-s$SEED-harmful.jsonl"
"$PY" -u -m senbonzakura.score --model "$O" --eval "$T/good_ds" --skip 385 --n 512 \
    --batch 16 --device cuda --label "senbon-s$SEED-harmless" \
    --out "results/senbon-s$SEED-harmless.json" \
    --save-generations "gens/senbon-s$SEED-harmless.jsonl"

# The compass, with the construct-validity controls, on the full measure arm. Forward passes
# only, so the whole arm costs minutes and there is no reason to subsample it.
"$PY" -u -m senbonzakura.margin --model "$O" \
    --harmful "$T/bad_eval_ds" --harmless "$T/good_ds" --harmless-matched "$M" \
    --skip-harmful 132 --skip-harmless 385 --n 4504 \
    --batch 16 --bootstrap 2000 --seed $SEED --device cuda \
    --label "senbon-s$SEED-compass" \
    --out "results/senbon-s$SEED-compass.json" \
    --margins "margins/senbon-s$SEED-compass.jsonl" \
    --compare-to "margins/base-Qwen3-1.7B.jsonl"

# The weights are 3.4 GB and there are ten arms. Keeping them all would fill the disk
# before seed 46; the result files and the margins are what the numbers come from.
rm -rf "$O"
echo ARM_OK
"""

[[job]]
id = "heretic-seed-42"
name = "heretic at its own defaults, Qwen3-1.7B, seed 42"
machine = "rog"
deps = ["setup"]
timeout_secs = 14400
resources = { needs_gpu = true, ram_gb = 6 }
success = { type = "stdout-contains", needle = "ARM_OK" }
command = """
set -euo pipefail
exec 2>&1
SEED=42
RUN=$HOME/senbon-run
H=$HOME/track2/heretic-src
PY=$HOME/track2/venv/bin/python
T=$HOME/track-heldout
M=$HOME/track-matched/good_matched_ds
O=$RUN/abl/heretic-qwen3-1.7b-s$SEED
cd "$RUN"

# Heretic's own budget, its own corpus, its own defaults. The ONLY thing held in common is
# what happens afterwards: the same ruler, on the same held-out rows, at the same batch size.
"$H/.venv/bin/python" -m heretic --model Qwen/Qwen3-1.7B --save "$O" --seed $SEED
test -d "$O"

export SENBONZAKURA_COMMIT="${SENBON_COMMIT:-unset}"
export PYTHONPATH=src
"$PY" -u -m senbonzakura.score --model "$O" --eval "$T/bad_eval_ds" --skip 132 --n 512 \
    --batch 16 --device cuda --label "heretic-s$SEED-harmful" \
    --out "results/heretic-s$SEED-harmful.json" \
    --save-generations "gens/heretic-s$SEED-harmful.jsonl"
"$PY" -u -m senbonzakura.score --model "$O" --eval "$T/good_ds" --skip 385 --n 512 \
    --batch 16 --device cuda --label "heretic-s$SEED-harmless" \
    --out "results/heretic-s$SEED-harmless.json" \
    --save-generations "gens/heretic-s$SEED-harmless.jsonl"
"$PY" -u -m senbonzakura.margin --model "$O" \
    --harmful "$T/bad_eval_ds" --harmless "$T/good_ds" --harmless-matched "$M" \
    --skip-harmful 132 --skip-harmless 385 --n 4504 \
    --batch 16 --bootstrap 2000 --seed $SEED --device cuda \
    --label "heretic-s$SEED-compass" \
    --out "results/heretic-s$SEED-compass.json" \
    --margins "margins/heretic-s$SEED-compass.jsonl" \
    --compare-to "margins/base-Qwen3-1.7B.jsonl"
rm -rf "$O"
echo ARM_OK
"""

# Seeds 43 to 46 are the same two jobs with SEED changed. They are written out rather than
# generated because holst reads a static file, and a spec that cannot be read line by line
# is a spec nobody checks. To add a seed, copy a pair and change the three SEED lines.
#
# NOT YET WRITTEN OUT: seeds 43, 44, 45, 46. The pair above is the shape; running seed 42
# first is deliberate, because a spec that has never executed is a guess about ten jobs
# rather than one. Copy the pair once seed 42 has landed and its wall clock is known.

[[job]]
id = "summarise"
name = "one table, from the result files rather than from a notebook"
machine = "rog"
deps = ["senbon-seed-42", "heretic-seed-42"]
timeout_secs = 600
success = { type = "stdout-contains", needle = "SUMMARY_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python
cd "$RUN"

# Generated from the files, never typed. Every table this project has had to walk back was
# typed by hand from a terminal that had scrolled.
"$PY" - <<'PY'
import glob
import json

rows = []
for path in sorted(glob.glob("results/*-harmful.json")):
    d = json.loads(open(path).read())
    tag = d.get("label", path)
    compass = path.replace("-harmful.json", "-compass.json")
    try:
        c = json.loads(open(compass).read())
    except OSError:
        c = {}
    # The key names are score.py's, checked against the source rather than guessed: they are
    # `heretic`, `refusal`, `soft_refusal`, not the *_rate spellings a reader expects. A
    # summariser that guesses them prints a table of nulls that looks like a finished table.
    rows.append({
        "arm": tag,
        "keyword": d["heretic"],
        "refusal": d["refusal"],
        "soft": d["soft_refusal"],
        "broken": d["broken"],
        "auc": c.get("auc"),
        "auc_ci": c.get("auc_ci"),
        # Printed beside the AUC on purpose: a discrimination figure without its
        # length-only baseline cannot be read.
        "length_only_auc": (c.get("controls") or {}).get("length_only_auc"),
        "canonical_auc": (c.get("controls") or {}).get("canonical_auc"),
        "commit": ((c.get("provenance") or {}).get("senbonzakura") or {}).get("git"),
    })
print(json.dumps(rows, indent=2))
open("results/SUMMARY.json", "w").write(json.dumps(rows, indent=2) + "\\n")
PY
echo SUMMARY_OK
"""
