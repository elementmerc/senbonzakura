# says whether it is worth asking again. If the card runs out of night, this is the arm to lose.

[[job]]
id = "a3-gemma"
name = "C: the shipped configuration on gemma-2-2b-it"
machine = "rog"
deps = ["a2"]
timeout_secs = 28800
resources = { needs_gpu = true, ram_gb = 6 }
