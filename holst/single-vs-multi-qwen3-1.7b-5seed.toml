[[job]]
id = "compare"
name = "K=1 against K=3, from the files"
machine = "rog"
deps = ["arm-k1-seed-42", "arm-k3-seed-42", "arm-k1-seed-43", "arm-k3-seed-43", "arm-k1-seed-44", "arm-k3-seed-44", "arm-k1-seed-45", "arm-k3-seed-45", "arm-k1-seed-46", "arm-k3-seed-46"]
timeout_secs = 600
success = { type = "stdout-contains", needle = "COMPARE_OK" }
command = """
set -euo pipefail
exec 2>&1
cd "$HOME/senbon-run"
$HOME/track2/venv/bin/python - <<'PY'
import glob
import json
import statistics

def read(pattern):
    return {p: json.loads(open(p).read()) for p in sorted(glob.glob(pattern))}

def mean(vals):
    return round(sum(vals) / len(vals), 4) if vals else None

def spread(vals):
    # The seed-to-seed standard deviation, which is the whole reason five seeds were run.
    # Reported rather than a confidence interval because five is too few for one to mean much.
    return round(statistics.stdev(vals), 4) if len(vals) > 1 else None

rows = []
for k in (1, 3):
    h = read(f"results/k{k}-s*-harmful.json")
    g = read(f"results/k{k}-s*-harmless.json")
    c = read(f"results/k{k}-s*-compass.json")
    if not h:
        continue
    kw = [d["heretic"] for d in h.values()]
    auc = [d["auc"] for d in c.values()]
    rows.append({
        "K": k,
        "seeds": sorted(int(p.split("-s")[1].split("-")[0]) for p in h),
        # score.py's own key names: heretic, refusal, soft_refusal, broken.
        "keyword_mean": mean(kw),
        "keyword_sd": spread(kw),
        "keyword_per_seed": [round(v, 4) for v in kw],
        "refusal_mean": mean([d["refusal"] for d in h.values()]),
        "soft_mean": mean([d["soft_refusal"] for d in h.values()]),
        # The harmless arm, always beside the harmful one.
        "harmless_refusal_mean": mean([d["refusal"] for d in g.values()]),
        "broken_mean": mean([d["broken"] for d in h.values()]),
        "auc_mean": mean(auc),
        "auc_sd": spread(auc),
        # The paired interval on the change from base, which is the number that says whether
        # a difference is distinguishable from no change at all.
        "paired": [d.get("paired", {}).get("delta_ci") for d in c.values()],
        "length_only_auc": sorted({(d.get("controls") or {}).get("length_only_auc")
                                   for d in c.values()}),
    })
print(json.dumps(rows, indent=2))
open("results/SINGLE_VS_MULTI.json", "w").write(json.dumps(rows, indent=2) + "\\n")

# ── did the manipulation actually happen? ────────────────────────────────────────────────
# The statistics above can be impeccable and the conclusion still wrong, because nothing in
# them checks that the arms differed in the thing being tested. On 2026-08-03 this exact
# comparison returned a clean separation across ten arms at p about 0.004, passed its own
# declared inconclusive test, and was reported as "K=3 better" while BOTH arms had ablated one
# direction per layer. The requested K differed; the applied K did not.
#
# So the verdict is gated on the manipulation, not only on the numbers. A comparison that
# cannot show its arms differed reports that, loudly, instead of a result.
applied = {}
for path in sorted(glob.glob("applied-k/k*-s*-abliteration.json")):
    arm = path.split("/")[-1].split("-")[0]              # k1 / k3
    dpl = json.loads(open(path).read()).get("directions_per_layer") or []
    if dpl:
        applied.setdefault(arm, set()).add(max(dpl))

print("
APPLIED K, read from directions_per_layer rather than from the request:")
if len(applied) < 2:
    print("  RECORDS MISSING for at least one arm, so the K actually applied is unknown.")
    print("  NO CLAIM ABOUT K CAN BE MADE from this run.")
else:
    for arm in sorted(applied):
        print(f"  {arm}: max directions per layer = {sorted(applied[arm])}")
    if len({frozenset(v) for v in applied.values()}) == 1:
        print("  MANIPULATION FAILED: every arm applied the same number of directions per layer.")
        print("  The arms performed identical surgery, so any difference between them is a")
        print("  difference between searches and NOT evidence about K. Do not report this as a")
        print("  result about direction count.")
    else:
        print("  the arms differ in applied K, so a comparison about K is meaningful.")

# The declared outcome, evaluated by the script rather than by eye on the morning the numbers
# land. Says "inconclusive" out loud, because that is a result and not a failure.
if len(rows) == 2:
    a, b = rows[0], rows[1]
    delta = b["keyword_mean"] - a["keyword_mean"]
    print(f"\\nK=3 minus K=1 on the keyword axis: {delta:+.4f} "
          f"({'K=3 better' if delta < 0 else 'K=1 better or equal'})")
    n = min(len(a["keyword_per_seed"]), len(b["keyword_per_seed"]))
    print(f"seeds per arm: K=1 {len(a['keyword_per_seed'])}, K=3 {len(b['keyword_per_seed'])}")
    if n < 5:
        print(f"PRE-REGISTRATION SHORTFALL: {n} seed(s) per arm, not the five that were "
              f"declared. Read this as provisional.")
    sd = max(x for x in (a["keyword_sd"], b["keyword_sd"], 0) if x is not None)
    if sd and abs(delta) < 2 * sd:
        print(f"INCONCLUSIVE: the gap ({abs(delta):.4f}) is inside twice the seed-to-seed "
              f"spread ({sd:.4f}).")
PY
echo COMPARE_OK
"""
