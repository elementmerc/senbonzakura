# SPDX-License-Identifier: AGPL-3.0-or-later
# Author:  Daniel Iwugo
# Comment: Christ is King
#
# Distribution fan-out: get every channel that needs no approval out of one push.
#
# WHY THIS EXISTS AS ITS OWN WORKFLOW
#
# `publish.yml` puts wheels on PyPI when a release is published, and it is deliberately narrow:
# it holds the trusted-publishing identity, so the less it does the better. This does everything
# else, holds no publishing identity beyond the repository's own package registry, and can
# therefore run on ordinary pushes.
#
# THE TWO LANES, AND WHY PYPI IS NOT IN THE FAST ONE
#
#   push to dev          container :dev, and a rolling pre-release carrying the wheels
#   tag vX.Y.Zrc1        the same, plus PyPI as a pre-release (pip install --pre)
#   tag vX.Y.Z on main   PyPI proper, container :latest, a real release
#
# The fast lane deliberately stops short of PyPI. A version on PyPI can never be reused and never
# really be withdrawn, so publishing one per commit would burn the version space permanently and
# fill the index with builds nobody asked for. A container tag is mutable and a GitHub pre-release
# is deletable, so the fast lane uses the channels where being wrong is recoverable.
#
# WHAT STILL NEEDS A HUMAN, ONCE
#
#   The Action's Marketplace listing is a tick-box on the first release that carries `action.yml`.
#   After that every release updates it automatically.
#
# WHAT IS NOT HERE AND WHY
#
#   Hugging Face Spaces and the VS Code Marketplace both need an account and a token this
#   repository does not hold. They are one secret away rather than one workflow away, and adding
#   half of each would be worse than a note saying so.
name: distribute

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

# The default token, and only what the registry needs. `contents: write` is scoped to the job that
# writes a pre-release rather than granted here, so the build job cannot write to the repository.
permissions:
  contents: read

concurrency:
  # One fan-out at a time per ref. Two pushes in a minute should produce the later artefact, not a
  # race over the same mutable tag.
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    name: work out which lane this is
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.decide.outputs.channel }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml
      - id: decide
        # Stated as one shell step rather than spread across `if:` expressions on every job,
        # because "which lane am I" is one question and answering it in six places is how two of
        # them end up disagreeing.
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "$ref" == refs/tags/v*rc* ]]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/tags/v* ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi
          version=$(python -c "import re,pathlib;\
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/senbonzakura/_version.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lane: $(grep channel= "$GITHUB_OUTPUT" | cut -d= -f2), version $version"

  container:
    name: container to ghcr
    needs: lane
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # tip of the v3 series, resolved 2026-09-23

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # tip of the v3 series, resolved 2026-09-23
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        # `:dev` is mutable on purpose and `:vX.Y.Z` never moves. Somebody pinning a version gets
        # the bytes they pinned; somebody following the edge gets the edge.
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "${{ needs.lane.outputs.channel }}" in
            stable)     tags="$image:latest,$image:v${{ needs.lane.outputs.version }}" ;;
            prerelease) tags="$image:rc,$image:v${{ needs.lane.outputs.version }}" ;;
            *)          tags="$image:dev" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, as pinned in ci.yml
        with:
          python-version: "3.12"

      - name: Build the bundled data, because a checkout does not carry it
        # THE IMAGE SHIPPED WITHOUT ITS CORPORA UNTIL 2026-09-23, and the first run of this
        # workflow is what found it: `doctor` inside the image reported 7 of 19 checks failed,
        # every one of them a missing corpus or the missing evaluation track.
        #
        # The corpora and the track are GENERATED, not committed: they hold 4,895 harmful prompts
        # and the project publishes that corpus as a gated dataset on purpose, so a public git
        # tree must not carry them. A wheel gets them because building a wheel is a deliberate act
        # that attaches the licence notice. `.dockerignore` says in as many words that an image is
        # a release artefact like a wheel and should carry them too. Nothing ever built them here.
        #
        # This is the same two lines ci.yml already runs, for the same reason and with the same
        # credential. The third channel to be caught by one root cause in two days: an artefact
        # generated at build time is absent from every channel that does not explicitly build it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pyarrow
          python tools/packaging/build_corpora.py

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # tip of the v6 series, resolved 2026-09-23
        # BUILT AND LOADED, NOT PUSHED. The smoke test below used to run after the push, and its
        # own failure message said so out loud: "the image was pushed and cannot run doctor".
        # A test that can only report what the public already has is not a gate, and on the first
        # real run of this workflow it published a broken image to :dev before saying anything.
        #
        # The push is a second call below. It costs no rebuild: the layers are in the GitHub
        # Actions cache from this step, so the second call is a cache hit and a registry upload.
        id: build
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: senbonzakura:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image can answer for itself, BEFORE anybody else can pull it
        # `doctor` is the right smoke test because its whole job is to say what an install can and
        # cannot do, and it exercises the vendored binaries rather than only the Python import.
        #
        # Its exit code is not used on its own: a CPU-only image legitimately carries a torch
        # advisory and exits non-zero for a reason that is not a fault. So the report is read.
        # "0 failed" is the assertion, and it is the one that was missing while the image job
        # grepped for two lines that said nothing about the bundled data.
        run: |
          set -euo pipefail
          docker run --rm senbonzakura:smoke doctor 2>&1 | tee doctor.txt || true
          grep -q "llama-quantize *vendored, runs" doctor.txt \
            || { echo "::error::the image ships a quantiser that does not run"; exit 1; }
          # The bundled track is the one named exception: it is packed from a held-out track that
          # lives outside this repository, so no CI job can build one. Named rather than covered
          # by a loosened count, and the line is still asserted to EXIST so that doctor dropping
          # the check entirely cannot pass as doctor being happy about it.
          grep -q "bundled track" doctor.txt \
            || { echo "::error::doctor no longer reports on the bundled track"; exit 1; }
          if grep -vE "bundled track" doctor.txt | grep -qE "^\s+✗"; then
            echo "::error::doctor reports failing checks inside the image, so it is not shippable"
            grep -E "^\s+✗" doctor.txt
            exit 1
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # tip of the v6 series, resolved 2026-09-23
        # The same layers, now that something has actually run them.
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha

  wheels:
    name: wheels for the fast lane
    needs: lane
    if: needs.lane.outputs.channel != 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, as pinned in ci.yml
        with:
          python-version: "3.12"

      - name: Build the bundled data, because a checkout does not carry it
        # WITHOUT THIS THE FAST LANE PUBLISHES A WHEEL WITH NO CORPORA, which is the defect the
        # step below exists to catch and the same one that made the Colab notebook unusable. They
        # are generated rather than committed on purpose: they hold 4,895 harmful prompts and the
        # project publishes that corpus as a gated dataset. A wheel carries them because building
        # one is a deliberate act that attaches the licence notice, and nothing here was making
        # that act happen.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pyarrow
          python tools/packaging/build_corpora.py

      - name: Build both distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build
          python -m build checker --outdir dist

      - name: The wheel carries what it claims
        # The same check the release path runs. A fast lane that skipped it would be a fast lane
        # for shipping a wheel with no corpora in it, which is the defect this project has already
        # shipped once.
        #
        # ONE WHEEL PER CALL, in a loop. This read `dist/*.whl`, which globs to BOTH distributions
        # since Q-29 put the checker in its own tree, and the script takes a single positional
        # argument: it exited 2 on "unrecognized arguments" before checking anything at all. So on
        # the first real run of this workflow the guard against a corpora-less wheel was itself
        # the reason nothing was checked. The script already knows both distributions and holds a
        # separate table of expectations for each, because what a distribution owes follows from
        # what it ships.
        #
        # NOT `--release`. A fast-lane build is a `.dev` version, `is_release_artefact` says that
        # is not a release artefact, and `test_a_pre_release_of_ours_is_not_forced_into_release_mode`
        # pins that on purpose: a pre-release is allowed to be thin. Forcing the strict table here
        # would override a decision somebody made deliberately and wrote a test for.
        #
        # The thing that actually needs guarding is narrower, so it is guarded directly below
        # rather than by reaching for a flag that means something else.
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test ${#wheels[@]} -eq 2 || {
            echo "::error::expected two wheels, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          }
          for wheel in "${wheels[@]}"; do
            echo "== $wheel"
            python tools/ci/check_wheel.py "$wheel"
          done

      - name: The wheel this lane publishes is not a thin one
        # The fast lane publishes a rolling pre-release somebody can actually install, and a wheel
        # without the corpora installs, imports, answers `--help` and then fails `--track default`
        # for every one of them. That is not hypothetical: it is what made the Colab notebook
        # unusable, found on 2026-09-22.
        #
        # Asserted against the built wheel rather than against the source tree, because the
        # question is what the artefact carries, and `package-data` has already once listed a glob
        # that matched none of the files it was meant to ship.
        run: |
          set -euo pipefail
          wheel=$(ls dist/senbonzakura-*.whl)
          python -c "import sys, zipfile; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$wheel" > names.txt
          # THE CORPORA ONLY, and `default-track.bin` deliberately is not here. The bundled
          # evaluation track is packed from a HELD-OUT track the operator keeps off this machine
          # and out of this repository (RELEASING.md, "Before anything else"), so no CI job can
          # build one and asserting it here would fail every push forever. What a CI-built
          # artefact can and cannot do is a live question, recorded in DEFERRED.md.
          for want in senbonzakura/data/corpora.bin; do
            grep -qxF "$want" names.txt || {
              echo "::error::$wheel does not carry $want, so --track default fails for anyone who installs it"
              exit 1
            }
          done
          echo "the published wheel carries its corpora and its track"

      - name: Publish or refresh the rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One rolling tag rather than a release per commit. `dev` moves; anybody who wants a fixed
        # artefact takes a real release. Deleting and recreating is deliberate: a release whose
        # assets are stale is worse than no release, because the version string still looks right.
        run: |
          set -euo pipefail
          tag="rolling-dev"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* \
            --prerelease \
            --title "Rolling development build" \
            --notes "Built from ${GITHUB_SHA}. This is not a release: it is whatever \`dev\` was
          at the time, it has not been through the release review, and it will be replaced without
          warning. Use it to try something today. Do not build anything on it.

          Install: \`pip install <the wheel below>\`
          Container: \`docker run --rm ghcr.io/${GITHUB_REPOSITORY,,}:dev doctor\`"

  packaging-manifests:
    name: refresh the brew formula and scoop manifest
    needs: lane
    if: needs.lane.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      # The only job here that writes to the repository, and it touches exactly two files. Kept
      # separate from the container and wheel jobs for the reason ci.yml gives about its badge
      # job: a token that can write should never be in the same job as code it did not build.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, as pinned in ci.yml
        with:
          ref: main

      - name: Rewrite the version and the hashes
        env:
          VERSION: ${{ needs.lane.outputs.version }}
        # Hand-editing these is how a formula ends up pointing at a tarball that no longer has
        # that hash, which fails for the user and nobody else. The hash is taken from the archive
        # GitHub actually serves rather than computed from the working tree, because those are not
        # the same bytes and only one of them is what `brew` will download.
        run: |
          set -euo pipefail
          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          zipball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.zip"
          tar_sha=$(curl -fsSL "$tarball" | sha256sum | cut -d' ' -f1)
          zip_sha=$(curl -fsSL "$zipball" | sha256sum | cut -d' ' -f1)
          repo_name="${GITHUB_REPOSITORY#*/}"

          python - "$VERSION" "$tarball" "$tar_sha" "$zip_sha" "$repo_name" <<'PY'
          import json, pathlib, re, sys
          version, tarball, tar_sha, zip_sha, repo = sys.argv[1:6]

          formula = pathlib.Path("packaging/senbonzakura-check.rb")
          text = formula.read_text(encoding="utf-8")
          text = re.sub(r'^  url ".*"$', f'  url "{tarball}"', text, flags=re.M)
          text = re.sub(r'^  sha256 ".*"$', f'  sha256 "{tar_sha}"', text, flags=re.M)
          formula.write_text(text, encoding="utf-8")

          manifest = pathlib.Path("bucket/senbonzakura-check.json")
          doc = json.loads(manifest.read_text(encoding="utf-8"))
          doc["version"] = version
          doc["url"] = tarball.replace(".tar.gz", ".zip")
          doc["hash"] = zip_sha
          doc["extract_dir"] = f"{repo}-{version}\\checker"
          manifest.write_text(json.dumps(doc, indent=4) + "\n", encoding="utf-8")
          print(f"refreshed both manifests to {version}")
          PY

      - name: Commit them if they moved
        env:
          VERSION: ${{ needs.lane.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "manifests already describe ${VERSION}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/senbonzakura-check.rb bucket/senbonzakura-check.json
          git commit -m "chore(packaging): point the brew formula and scoop manifest at v${VERSION}"
          git push
