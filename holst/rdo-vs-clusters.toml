[[job]]
id = "report"
name = "RDO against clusters against single, at matched refusal"
machine = "rog"
deps = ["score-gemma-rdo", "score-gemma-clusters", "score-qwen3-rdo"]
timeout_secs = 600
success = { type = "stdout-contains", needle = "REPORT_OK" }
command = """
set -euo pipefail
exec 2>&1
RUN=$HOME/senbon-run
PY=$HOME/track2/venv/bin/python

PYTHONPATH="$RUN/src" "$PY" - <<'EOF'
import json, os, sys

RUN = os.path.expanduser("~/senbon-run")
WANT = [("gemma RDO", "score-gemma-rdo"), ("gemma clusters", "score-gemma-clusters"),
        ("Qwen3 RDO", "score-qwen3-rdo")]

rows, missing = [], []
for tag, name in WANT:
    try:
        with open(f"{RUN}/rdo/{name}.json", encoding="utf-8") as f:
            rows.append((tag, json.load(f)))
    except (OSError, ValueError) as e:
        missing.append(f"{tag}: {e}")
if missing:
    print("INCOMPLETE: refusing to summarise a comparison that did not finish")
    for m in missing:
        print("  " + m)
    sys.exit(1)

for tag, r in rows:
    e4 = r.get("e4")
    print(f"\\n=== {tag} ===")
    if not e4:
        print("  no grid"); continue
    if e4["degenerate_reason"]:
        print(f"  UNREADABLE: {e4['degenerate_reason']}")
        continue
    mr = e4["matched_refusal"]
    print(f"  baseline refusal (least-ablated arm): {mr.get('baseline_refusal')}")
    for band, entries in mr["targets"].items():
        kls = {int(K): e["kl"] for K, e in entries.items()}
        if not kls:
            continue
        best = min(kls, key=kls.get)
        line = "  ".join(f"K={K}:{kl:.3f}" for K, kl in sorted(kls.items()))
        verdict = "MULTI WINS" if best > 1 else "single wins"
        print(f"  {band:<14} {line}   -> cheapest K={best}  {verdict}")

print("\\nWhat to conclude: a K>1 arm reaching the same refusal level at lower KL than K=1 is the")
print("multi-direction claim holding. K=1 cheapest everywhere is the claim failing at this scale,")
print("which is a result and not a bug, and it should be published as one.")
EOF
echo REPORT_OK
"""
