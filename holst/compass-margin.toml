machine = "rented"
deps = ["setup"]
timeout_secs = 3600
resources = { needs_gpu = true }
success = { type = "stdout-contains", needle = "MARGIN_DONE" }
command = """
set -euo pipefail
exec 2>&1
export HF_HOME=/workspace/hf
mkdir -p /workspace/hf /workspace/margins
retry() {
  local n=0
  until "$@"; do
    n=$((n+1)); [ $n -ge 3 ] && { echo "RETRY_EXHAUSTED: $*"; return 1; }
    echo "RETRYING ($n/3): $*"; sleep 30
  done
}
_gpu=""
for i in $(seq 0 $(( $(nvidia-smi -L | wc -l) - 1 ))); do
  if exec 9>/workspace/.gpu$i.lock && flock -n 9; then _gpu=$i; break; fi
done
[ -n "$_gpu" ] || { echo "NO_FREE_GPU"; exit 1; }
export CUDA_VISIBLE_DEVICES=$_gpu
python3 -m senbonzakura.margin --model ops-malware/llama-3.2-1b-abliterated \
  --harmful /workspace/track/bad_eval_ds --harmless /workspace/track/good_ds \
  --n 200 --skip-harmless 320 --batch 16 --device cuda --label margin-abl-llama-3.2-1b \
  --out /workspace/results/margin-abl-llama-3.2-1b.json --margins /workspace/margins/margin-abl-llama-3.2-1b.jsonl
cat > /workspace/_up_margin.py <<'UP'
import os, sys
from huggingface_hub import HfApi
api = HfApi(token=os.environ["HF_TOKEN"])
tag = sys.argv[1]
for f in [f"results/{tag}.json", f"margins/{tag}.jsonl"]:
    api.upload_file(path_or_fileobj="/workspace/"+f, path_in_repo=f,
                    repo_id="ops-malware/senbon-compass-2026-07", repo_type="dataset")
UP
retry python3 /workspace/_up_margin.py margin-abl-llama-3.2-1b
rm -rf /workspace/hf/hub/models--* 2>/dev/null || true
"""

